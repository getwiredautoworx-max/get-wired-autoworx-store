<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff,#f1f5f9 70%,#eaf0f6);color:#173650;font:15px Arial,Helvetica,sans-serif}header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.97);border-bottom:1px solid #d5e0e9;padding:12px 16px}.head{max-width:1200px;margin:auto;display:flex;align-items:center;gap:12px}.back{border:1px solid #b9d2e3;background:#fff;color:#173650;border-radius:8px;padding:10px 13px;font-weight:800;text-decoration:none}.logo{height:46px;width:min(240px,48vw);object-fit:contain;margin-left:auto}main{max-width:1200px;margin:auto;padding:18px 14px 55px}.notice{padding:12px 14px;border:1px solid #e0b84f;background:#fff8df;color:#5a4508;border-radius:10px;font-size:12px;line-height:1.5}.crumb{margin:14px 0 7px;color:#61778b;font-size:12px}h1{margin:5px 0;color:#12344f;font-size:clamp(22px,4vw,31px)}.intro{margin:5px 0 18px;color:#53687a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{min-width:0;min-height:66px;padding:13px 14px;border:1px solid #bdd4e4;border-radius:11px;background:linear-gradient(135deg,#fff,#edf5fb);color:#173650;text-align:left;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}.tile:hover,.tile[aria-pressed=true]{border-color:#087fce;box-shadow:0 5px 16px #19375018}.tile small{display:block;color:#61778b;font-size:11px;font-weight:500;margin-top:4px}.arrow{color:#087fce;font-size:22px}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:16px}.card{overflow:hidden;border:1px solid #cbdbe7;border-radius:12px;background:#fff;box-shadow:0 4px 14px #1937500d}.photo{height:190px;background:#edf3f8;display:grid;place-items:center}.photo img{width:100%;height:100%;object-fit:contain}.body{padding:11px}.body h3{margin:0 0 7px;font-size:14px;color:#173650}.fitment{color:#53687a;font-size:12px;line-height:1.4}.price{margin-top:8px;color:#53687a;font-size:12px}.source{margin-top:7px;color:#087fce;font-size:11px;font-weight:700}.empty{padding:20px;border:1px dashed #9eb8ca;border-radius:12px;background:#fff;color:#53687a;line-height:1.5}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}.controls input{flex:1;min-width:180px;padding:11px;border:1px solid #b9d2e3;border-radius:9px}.count{font-size:12px;color:#61778b}@media(max-width:700px){main{padding:13px 10px 40px}.grid,.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{min-height:60px;padding:10px;font-size:12px}.photo{height:130px}.body{padding:9px}.body h3{font-size:12px}.fitment{font-size:11px}}
</style></head><body><header><div class="head"><a class="back" href="preview-category.html?id=ba263c9f-d038-48bd-bca0-944f3ebdc5e9">← AUTO ELECTRICAL</a><img class="logo" src="assets/gw-logo.png" alt="Get Wired AutoWorx"></div></header>
<main><div class="notice" id="notice">Loading ASC review catalogue…</div><div class="crumb" id="crumb">Auto Electrical Parts & Spares / ASC Catalogue Review</div><h1 id="heading">ASC Auto Electrical Catalogue</h1><p class="intro" id="intro">Choose a catalogue, then a source section to inspect the reviewed pilot products.</p><div class="grid" id="catalogues"></div><div class="grid" id="sections" hidden></div><div class="controls" id="controls" hidden><input id="search" type="search" placeholder="Search this section…"><span class="count" id="count"></span></div><div class="products" id="products"></div></main>
<script>
(async()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data;try{const r=await fetch('assets/asc-auto-electrical-preview.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json()}catch(e){$('notice').textContent='ASC preview data unavailable: '+e.message;return}$('notice').textContent=data.notice;const params=new URLSearchParams(location.search),selected=params.get('catalogue')||'',catalogues=data.catalogues||[],items=data.records||[];function tile(name,sub,id){return '<button class="tile" type="button" data-id="'+esc(id)+'"><span>'+esc(name)+'<small>'+esc(sub||'')+'</small></span><span class="arrow">›</span></button>'}function showCatalogues(){$('heading').textContent='ASC Auto Electrical Catalogue';$('crumb').textContent='Auto Electrical Parts & Spares / ASC Catalogue Review';$('intro').textContent='Choose one of the four ASC catalogue groups. Each retains the original catalogue section order.';$('catalogues').hidden=false;$('sections').hidden=true;$('controls').hidden=true;$('products').innerHTML='';$('catalogues').innerHTML=catalogues.map(c=>tile(c.name,c.sections.length+' source sections',c.name)).join('');$('catalogues').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{location.href='asc-auto-electrical-preview.html?catalogue='+encodeURIComponent(b.dataset.id)})}function showSections(c){$('heading').textContent=c.name;$('crumb').textContent='Auto Electrical Parts & Spares / '+c.name;$('intro').textContent='Choose a source heading. Only exact, visually reviewed pilot matches are shown.';$('catalogues').hidden=true;$('sections').hidden=false;$('controls').hidden=true;$('products').innerHTML='';$('sections').innerHTML='<button class="tile" id="back">← All ASC catalogues</button>'+c.sections.map(s=>tile(s.name,items.filter(p=>p.subcategory_id===s.id).length+' reviewed pilot items',s.id)).join('');$('back').onclick=showCatalogues;$('sections').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>showProducts(c,b.dataset.id))}function showProducts(c,id){const s=c.sections.find(x=>x.id===id);if(!s)return;$('heading').textContent=s.name;$('crumb').textContent='Auto Electrical Parts & Spares / '+c.name+' / '+s.name;$('intro').textContent='Review-only pilot products from the original ASC source catalogue. Confirm fitment and availability before any future listing.';$('catalogues').hidden=true;$('sections').hidden=false;$('controls').hidden=false;$('sections').innerHTML='<button class="tile" id="back">← '+esc(c.name)+' sections</button>';$('back').onclick=()=>showSections(c);const draw=()=>{const q=$('search').value.trim().toLowerCase(),list=items.filter(p=>p.subcategory_id===id&&(!q||[p.title,p.source_description,p.fitment_as_printed].join(' ').toLowerCase().includes(q)));$('count').textContent=list.length+' reviewed items';$('products').innerHTML=list.length?list.map(p=>'<article class="card"><div class="photo"><img loading="lazy" src="'+esc(p.image_url)+'" alt="'+esc(p.title)+'"></div><div class="body"><h3>'+esc(p.title)+'</h3><div class="fitment"><b>Draft description — owner review only:</b> '+esc(p.draft_customer_description||'Description pending')+'</div><div class="fitment"><b>Original catalogue wording:</b> '+esc(p.source_description||'Not transcribed')+'</div><div class="fitment"><b>Fitment as printed:</b> '+esc(p.fitment_as_printed||'Not printed / not verified — do not infer')+'</div><div class="price">Price On Request due to Limited Stock and Availability</div><div class="source">'+esc(p.subcategory)+' · '+esc(p.source_pdf||'Source file pending')+' · p.'+esc(p.source_page||'?')+' · ASC ref candidate '+esc(p.source_sku_candidate||'pending verification')+'</div></div></article>').join(''):'<div class="empty">No visually reviewed pilot products are available under this source heading yet. We have not filled this section with guessed or unrelated items.</div>'};$('search').value='';$('search').oninput=draw;draw()}const c=catalogues.find(x=>x.name===selected);if(c)showSections(c);else showCatalogues()})();
</script></body></html>
