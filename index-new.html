<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#02060d"><title>Get Wired AutoWorx | Store Categories</title><meta name="description" content="Get Wired AutoWorx category navigation. Product catalogue content is intentionally cleared while buttons are rebuilt and verified.">
<style>
:root{color-scheme:dark;--bg:#02060d;--panel:#071525;--blue:#078fe9;--white:#f5f8fc;--line:#16476a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--white);font:16px Arial,Helvetica,sans-serif}header{padding:20px 16px;text-align:center;border-bottom:1px solid var(--line);background:#030a13}.logo{display:block;max-width:min(320px,80vw);max-height:100px;object-fit:contain;margin:0 auto 12px}h1{font-size:clamp(20px,4vw,30px);margin:8px 0;color:var(--white)}p{margin:6px 0 0;color:#aab7c8;font-size:13px}main{max-width:1100px;margin:0 auto;padding:18px 14px 48px}.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.group{min-width:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}button{font:700 15px Arial,Helvetica,sans-serif;cursor:pointer}.category{width:100%;min-height:66px;border:0;padding:15px;background:#071525;color:#fff;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}.category:focus-visible,.child:focus-visible{outline:3px solid #fff;outline-offset:-3px}.category:hover{background:#0b2942}.symbol{color:#21aaff;font-size:22px}.children{display:none;padding:10px;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}.group.open .children{display:grid}.child{min-height:44px;padding:10px 8px;border:1px solid #28658c;border-radius:7px;background:#04101d;color:#eaf4ff}.child:hover{background:#0b2942}.note{margin:18px 0 0;text-align:center;color:#7f95aa;font-size:12px}@media(max-width:480px){.categories{grid-template-columns:1fr}.children{grid-template-columns:1fr 1fr}.category{min-height:60px}}
</style></head><body data-storefront-mode="buttons-only">
<!-- Button-only storefront reset active; catalogue content stays suppressed pending verified reload. -->\n<!-- Button-only reset: product catalogue content intentionally suppressed pending verified reload. --><header><img class="logo" src="assets/gw-logo.png" alt="Get Wired AutoWorx" onerror="this.hidden=true"><h1>Get Wired AutoWorx</h1><p>Sound &amp; Security • Auto Electrical • Spares &amp; Accessories</p></header>
<main><div class="categories" aria-label="Store categories">
<section class="group"><button class="category" aria-expanded="false">Auto Electrical Spares <span class="symbol">+</span></button><div class="children"><button class="child">Alternators &amp; Starters</button><button class="child">Batteries &amp; Charging</button><button class="child">Electrical Parts</button><button class="child">Vehicle Lighting</button></div></section>
<section class="group"><button class="category" aria-expanded="false">Vehicle Security <span class="symbol">+</span></button><div class="children"><button class="child">Alarms</button><button class="child">Immobilisers</button><button class="child">Central Locking</button><button class="child">Tracking &amp; Safety</button></div></section>
<section class="group"><button class="category" aria-expanded="false">Car Audio &amp; Entertainment <span class="symbol">+</span></button><div class="children"><button class="child">Car Audio / Video</button><button class="child">JBL</button><button class="child">Hertz</button><button class="child">Denon</button><button class="child">Home Entertainment</button><button class="child">Studio Equipment</button><button class="child">Marine Audio</button><button class="child">Band Instruments</button></div></section>
<section class="group"><button class="category" aria-expanded="false">Automotive Accessories <span class="symbol">+</span></button><div class="children"><button class="child">Interior Accessories</button><button class="child">Exterior Accessories</button><button class="child">Convenience &amp; Care</button></div></section>
<section class="group"><button class="category" aria-expanded="false">Marine Spares &amp; Accessories <span class="symbol">+</span></button><div class="children"><button class="child">Marine Electrical</button><button class="child">Marine Audio</button><button class="child">Marine Accessories</button></div></section>
<section class="group"><button class="category" aria-expanded="false">Tools, Hardware &amp; Consumables <span class="symbol">+</span></button><div class="children"><button class="child">Tools</button><button class="child">Hardware</button><button class="child">Consumables</button></div></section>
<section class="group"><button class="category" aria-expanded="false">Camping, Leisure &amp; Outdoors <span class="symbol">+</span></button><div class="children"><button class="child">4x4 Outdoor</button><button class="child">Camping</button><button class="child">Leisure</button><button class="child">Outdoor Accessories</button></div></section>
<section class="group"><button class="category" aria-expanded="false">Trailer &amp; Canopy <span class="symbol">+</span></button><div class="children"><button class="child">Trailer Parts</button><button class="child">Canopy Accessories</button></div></section>
</div></main>
<script>document.querySelectorAll('.category').forEach(button=>button.addEventListener('click',()=>{const group=button.closest('.group');const open=!group.classList.contains('open');document.querySelectorAll('.group').forEach(item=>{item.classList.remove('open');const b=item.querySelector('.category');b.setAttribute('aria-expanded','false');b.querySelector('.symbol').textContent='+'});if(open){group.classList.add('open');button.setAttribute('aria-expanded','true');button.querySelector('.symbol').textContent='−'}}));</script></body></html>
