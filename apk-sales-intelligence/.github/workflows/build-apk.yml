name: Build Sales Intelligence APK
on:
  push:
    paths:
      - 'apk-sales-intelligence/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk-sales-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: get-wired-sales-intelligence-debug
          path: apk-sales-intelligence/app/build/outputs/apk/debug/app-debug.apk
