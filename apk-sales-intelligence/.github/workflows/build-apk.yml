name: Build APK
on: { push: { branches: [apk-sales-intelligence-v03] } }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apk-sales-intelligence } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11' }
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: get-wired-sales-intelligence-v0.3.0
          path: apk-sales-intelligence/app/build/outputs/apk/debug/app-debug.apk
