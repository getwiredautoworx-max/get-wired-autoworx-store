const U='https://ojytykqpvonxvepprgbh.supabase.co',K='sb_publishable_rSKAEYqQheFAljUmro6uGA_MmBm-l3w',id=new URLSearchParams(location.search).get('id');

async function api(path){const r=await fetch(U+'/rest/v1/'+path,{headers:{apikey:K,Authorization:'Bearer '+K}});if(!r.ok)throw Error('Product request failed');return r.json()}
function cart(){try{return JSON.parse(localStorage.getItem('gw_cart')||'[]')}catch(e){return []}}function badge(){document.getElementById('badge').textContent=cart().reduce((s,x)=>s+Number(x.qty||0),0)}

function priceVerified(p){return Boolean(p&&Number(p.price)>0&&(!p.specifications||p.specifications.price_status!=='QUOTE_REQUIRED'))}function priceQuoteUrl(p){return 'https://wa.me/27744884234?text='+encodeURIComponent('Hi Get Wired AutoWorx, please confirm the current selling price and availability for '+p.name+' (SKU '+p.public_sku+').')}function add(p){if(!priceVerified(p)){window.open(priceQuoteUrl(p),'_blank','noopener');return}const c=cart(),x=c.find(x=>x.id===p.id);if(x)x.qty=(Number(x.qty)||0)+1;else c.push({id:p.id,public_sku:p.public_sku,name:p.name,price:p.price,image_url:p.image_url,qty:1});localStorage.setItem('gw_cart',JSON.stringify(c));badge();toast('Added to cart: '+p.name)}

duct-image?sku='+encodeURIComponent(p.public_sku||'');const localImage='assets/products_webp/'+encodeURIComponent(p.public_sku||'')+'.webp';const primaryImage=String(p.image_url||'').trim()||edgeImage;const fallbackImage=primaryImage!==edgeImage?edgeImage:localImage;const img=esc(primaryImage),fallback=esc(fallbackImage),localFallback=esc(localImage);document.getElementById('root').innerHTML='<div class="product"><div><div class="hero"><img src="'+img+'" data-fallback="'+fallback+'" data-local-fallback="'+localFallback+'" alt="'+esc(p.name)+'" onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.dataset.fallback=this.dataset.localFallback||\'\';this.dataset.localFallback=\'\'}else{this.onerror=null;this.src=\'assets/product-image-pending.svg\';this.parentNode.classList.add(\'no-image\')}"></div></div><div><h1 class="name">'+esc(p.name)+'</h1><div class="sku">SKU: '+esc(p.public_sku||'—')+'</div><div class="price">'+(verified?money(p.price):'Price on request')+'</div><div class="stock">'+(!verified?'Current price must be confirmed':(Number(p.stock_quantity||0)>0?'In stock — '+Number(p.stock_quantity)+' available':'Stock to confirm'))+'</div><div class="actions"><button id="add" class="btn" '+(verified&&Number(p.stock_quantity||0)<=0?'disabled':'')+'>'+(!verified?'REQUEST PRICE':(Number(p.stock_quantity||0)>0?'ADD TO CART':'OUT OF STOCK'))+'</button><button class="btn secondary" onclick="location.href=\'checkout-v2.html\'">VIEW CART / CHECKOUT</button><a class="btn secondary" id="queryPart" target="_blank" rel="noopener">QUERY PART ON WHATSAPP</a></div><div class="desc"><h2>Product Description</h2>'+esc(safeDescription||'Product details are being confirmed. Contact Get Wired AutoWorx if you need more information before ordering.')+'</div></div></div>'+(specEntries.length?'<div class="section"><h2>Specifications</h2><div class="specs">'+specEntries.map(([k,v])=>'<div class="spec"><b>'+esc(k)+'</b><br>'+esc(typeof v==='object'?JSON.stringify(v):v)+'</div>').join('')+'</div></div>':'')+'<div class="section"><h2>Vehicle compatibility</h2><div class="muted">'+(vehicles.length?vehicles.map(esc).join(', '):'Vehicle compatibility not available — please enquire before ordering.')+'</div></div>';document.getElementById('add').onclick=()=>add(p);document.getElementById('queryPart').href='https://wa.me/27744884234?text='+encodeURIComponent('Hi Get Wired AutoWorx, I would like to query this part: '+p.name+' (SKU '+p.public_sku+'). Please confirm description, picture, price and availability.')}catch(e){document.getElementById('root').innerHTML='<div class="error">'+esc(e.message||'Unable to load product.')+'</div>'}badge()}main();
