<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#02060d"><title>Product | Get Wired AutoWorx</title><style>
:root{--bg:#02060d;--panel:#071222;--blue:#08a5ff;--red:#ff1c2d;--white:#f5f8fc;--muted:#9fb1c4;--line:#12456c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#0d2d4b,#030914 42%,#02060d 78%);color:var(--white);font-family:Arial,Helvetica,sans-serif}.header{position:sticky;top:0;z-index:5;background:rgba(2,6,13,.97);backdrop-filter:blur(12px);border-bottom:1px solid #0c3b60}.head{max-width:1400px;margin:auto;min-height:82px;display:flex;align-items:center;gap:14px;padding:8px 14px}.logo{height:66px;width:min(330px,62vw);object-fit:contain}.back{border:1px solid #087fe0;background:#06111e;color:#fff;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.cart{margin-left:auto;background:#ff1c2d;color:#fff;border:0;border-radius:9px;padding:12px 15px;font-weight:900;cursor:pointer;position:relative}.badge{position:absolute;right:-8px;top:-8px;background:#fff;color:#ff1c2d;border-radius:50%;min-width:22px;text-align:center;padding:3px;font-size:12px}.wrap{max-width:1200px;margin:auto;padding:22px 18px 80px}.crumb{color:#8fa4b8;font-size:13px;margin-bottom:16px}.crumb a{color:#20b1ff;text-decoration:none}.panel{background:linear-gradient(145deg,#0b1b30,#050d18);border:1px solid #124e77;border-radius:14px;padding:18px}.product{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,1fr);gap:26px}.hero{min-height:430px;background:radial-gradient(circle,#123452,#040912);border-radius:10px;display:grid;place-items:center;overflow:hidden}.hero img{max-width:100%;max-height:420px;object-fit:contain}.name{font-size:31px;line-height:1.15;margin:0 0 10px}.sku{color:#9fb1c4;font-size:13px}.price{font-size:29px;font-weight:900;margin:18px 0 8px}.stock{color:#9fb1c4;margin-bottom:18px}.desc{color:#d8e2eb;line-height:1.55;white-space:pre-wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:900;cursor:pointer;background:#ff1c2d;color:#fff}.btn.secondary{background:#087fe0}.btn:disabled{background:#39434d;cursor:not-allowed}.section{margin-top:20px}.section h2{font-size:19px;border-bottom:1px solid #12456c;padding-bottom:8px}.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.spec{background:#050d18;border:1px solid #123f60;border-radius:8px;padding:9px;font-size:13px}.muted{color:#9fb1c4}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#06111e;border:1px solid #08a5ff;border-radius:10px;padding:12px 18px;display:none;z-index:20}.toast.show{display:block}.error{padding:20px;border:1px solid #ff1c2d;border-radius:10px;color:#ffd7da;background:#07111e}@media(max-width:800px){.product{grid-template-columns:1fr}.hero{min-height:300px}.hero img{max-height:290px}.name{font-size:25px}.specs{grid-template-columns:1fr}.head{min-height:74px}.logo{height:58px}.wrap{padding:16px 10px 80px}}</style></head><body><header class="header"><div class="head"><button class="back" onclick="history.back()">← BACK</button><img class="logo" src="assets/gw-logo.png" alt="Get Wired AutoWorx"><button class="cart" onclick="location.href='checkout-v2.html'">CART <span class="badge" id="badge">0</span></button></div></header><main class="wrap"><div class="crumb"><a href="store.html">Home</a> / <a id="categoryLink" href="category.html">Categories</a> / <span id="crumb">Product</span></div><div id="root" class="panel">Loading product…</div></main><div class="toast" id="toast"></div><script>
const U='https://ojytykqpvonxvepprgbh.supabase.co',K='sb_publishable_rSKAEYQqheFAljUmro6uGA_MmBm-l3w',id=new URLSearchParams(location.search).get('id');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(Number(v||0));
async function api(path){const r=await fetch(U+'/rest/v1/'+path,{headers:{apikey:K,Authorization:'Bearer '+K}});if(!r.ok)throw Error('Product request failed');return r.json()}
function cart(){try{return JSON.parse(localStorage.getItem('gw_cart')||'[]')}catch(e){return []}}function badge(){document.getElementById('badge').textContent=cart().reduce((s,x)=>s+Number(x.qty||0),0)}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function add(p){const c=cart(),x=c.find(x=>x.id===p.id);if(x)x.qty=(Number(x.qty)||0)+1;else c.push({id:p.id,public_sku:p.public_sku,name:p.name,price:p.price,image_url:p.image_url,qty:1});localStorage.setItem('gw_cart',JSON.stringify(c));badge();toast('Added to cart: '+p.name)}
async function main(){try{if(!id)throw Error('Product not specified');const rows=await api('products?select=id,name,public_sku,description,price,stock_quantity,image_url,gallery_urls,compatible_vehicles,specifications,category_id,active&id=eq.'+encodeURIComponent(id)+'&active=eq.true&limit=1');const p=rows[0];if(!p)throw Error('Product not found');const cats=await api('categories?select=id,name,parent_id&id=eq.'+encodeURIComponent(p.category_id));const cat=cats[0];if(cat){document.getElementById('crumb').textContent=p.name;document.getElementById('categoryLink').href='products.html?category='+encodeURIComponent(cat.id)}document.title=p.name+' | Get Wired AutoWorx';const specs=p.specifications&&typeof p.specifications==='object'?p.specifications:{};const specEntries=Object.entries(specs).filter(([k])=>k!=='supplier_id'&&k!=='quote_required');const vehicles=Array.isArray(p.compatible_vehicles)?p.compatible_vehicles:[];const img=esc(p.image_url||'assets/gw-logo.png');document.getElementById('root').innerHTML='<div class="product"><div><div class="hero"><img src="'+img+'" alt="'+esc(p.name)+'"></div></div><div><h1 class="name">'+esc(p.name)+'</h1><div class="sku">SKU: '+esc(p.public_sku||'—')+'</div><div class="price">'+money(p.price)+'</div><div class="stock">'+(Number(p.stock_quantity||0)>0?'In stock — '+Number(p.stock_quantity)+' available':'Stock to confirm')+'</div><div class="actions"><button id="add" class="btn" '+(Number(p.stock_quantity||0)<=0?'disabled':'')+'>'+(Number(p.stock_quantity||0)>0?'ADD TO CART':'OUT OF STOCK')+'</button><button class="btn secondary" onclick="location.href=\'checkout-v2.html\'">VIEW CART / CHECKOUT</button></div><div class="desc">'+esc(p.description||'OEM Quality replacement part. Contact Get Wired AutoWorx if you need assistance confirming fitment.')+'</div></div></div>'+(specEntries.length?'<div class="section"><h2>Specifications</h2><div class="specs">'+specEntries.map(([k,v])=>'<div class="spec"><b>'+esc(k)+'</b><br>'+esc(typeof v==='object'?JSON.stringify(v):v)+'</div>').join('')+'</div></div>':'')+(vehicles.length?'<div class="section"><h2>Compatible vehicles</h2><div class="muted">'+vehicles.map(esc).join(', ')+'</div></div>':'');document.getElementById('add').onclick=()=>add(p)}catch(e){document.getElementById('root').innerHTML='<div class="error">'+esc(e.message||'Unable to load product.')+'</div>'}badge()}main();
</script></body></html>
