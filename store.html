<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#02060d"><title>Get Wired AutoWorx | Online Store</title><style>html,body{margin:0;width:100%;height:100%;background:#02060d;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}.checkout-fab{position:fixed;right:18px;bottom:18px;z-index:9999;background:#ff1c2d;color:#fff;border:2px solid #fff;border-radius:999px;padding:13px 18px;font:800 14px Arial,sans-serif;text-decoration:none;box-shadow:0 8px 30px rgba(0,0,0,.55);display:none}.checkout-fab.show{display:block}.checkout-fab span{display:inline-block;min-width:20px;margin-left:6px;padding:2px 6px;border-radius:999px;background:#fff;color:#ff1c2d;text-align:center}@media(max-width:600px){.checkout-fab{right:12px;bottom:76px;padding:11px 14px;font-size:13px}}</style></head><body><iframe id="store" src="index-new.html" title="Get Wired AutoWorx Online Store"></iframe><a id="checkout" class="checkout-fab" href="checkout-v2.html">CHECKOUT <span id="count">0</span></a><script src="assets/product-image-fallback.js"></script><script src="assets/category-cleanup.js"></script><script src="assets/progressive-store-enhancements.js"></script><script src="category-navigation.js"></script><script>const c=document.getElementById('checkout'),n=document.getElementById('count'),frame=document.getElementById('store');function sync(){try{const cart=JSON.parse(localStorage.getItem('gw_cart')||'[]');const count=cart.reduce((s,x)=>s+Number(x.qty||0),0);n.textContent=count;c.classList.toggle('show',count>0)}catch(e){c.classList.remove('show')}}sync();setInterval(sync,500);window.addEventListener('storage',sync);function refine(){try{const d=frame.contentDocument;if(!d)return;d.querySelectorAll('*').forEach(el=>{if(el.children.length===0&&el.textContent.trim()==='Pick up available')el.textContent='Pickup and delivery available';});const total=d.getElementById('cartTotal');if(total&&!total.dataset.refined){total.dataset.refined='1';const note=d.createElement('div');note.textContent='Delivery: R15.00 per delivery address/order';note.style.cssText='color:#8fa4b8;font-size:12px;margin-top:6px';total.parentNode.insertBefore(note,total.nextSibling)}}catch(e){}}frame.addEventListener('load',function(){refine();if(window.installGetWiredProductImageFallback)window.installGetWiredProductImageFallback(frame);if(window.installGetWiredCategoryCleanup)window.installGetWiredCategoryCleanup(frame);if(window.installGetWiredCategoryNavigation)window.installGetWiredCategoryNavigation(frame)});setTimeout(refine,1000);setInterval(refine,3000);if(window.installGetWiredProductImageFallback)window.installGetWiredProductImageFallback(frame);if(window.installGetWiredCategoryCleanup)window.installGetWiredCategoryCleanup(frame);if(window.installGetWiredCategoryNavigation)window.installGetWiredCategoryNavigation(frame);</script></body></html>
