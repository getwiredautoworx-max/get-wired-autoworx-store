<script>
const params=new URLSearchParams(location.search),department=params.get('department')||'Car Audio',brand=params.get('brand')||'',component=params.get('component')||'',label=params.get('label')||'Car Audio & Video';
const $=id=>document.getElementById(id);
function group(p){const raw=String(p.component||'').trim().toLowerCase();if(p.collection==='Harnesses & Trims'||p.component==='Harnesses, Trims & Fitment')return 'Harnesses, Trims & Fitment';if(/^(car audio|car audio & video|car audio and video|all car audio products)$/.test(raw))return '';if(raw==='speakers')return 'Speakers & Component Kits';if(raw==='cameras'||raw.includes('display'))return 'Cameras & Monitors';if(raw.includes('processor')||raw.includes('crossover'))return 'Signal Processing & Crossovers';return p.component||'Other / Review'}
function unique(rows){const seen=new Set();return rows.filter(p=>{const k=JSON.stringify([p.collection,p.brand,p.title,p.component,p.indicativePrice,p.hasStock,p.manufacturerProductName||'']);if(seen.has(k))return false;seen.add(k);return true})}
const ONENAV_WORDMARK='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160"><text x="12" y="120" fill="#173650" font-family="Arial,Helvetica,sans-serif" font-size="118" font-weight="300" letter-spacing="-4">OneNav</text></svg>');
function brandDisplayName(b){const n=String(b).trim().toLowerCase();return n==='one'||n==='onenav'?'ONE / OneNav':n==='one x'||n==='onex'?'One X':b}
function logo(b){const n=b.toLowerCase();if(n==='one'||n==='onenav'||n.includes('onenav'))return ONENAV_WORDMARK;if(n==='one x'||n==='onex')return 'https://planetworld.canto.global/direct/image/78grbk30lp5ejb3v0s93889d5v/9ECBwgB8vFryBOGFxljIuivToMw/original?content-type=image%2Fpng&name=_OneX.png';if(n.includes('amplified'))return 'https://planetworld.canto.global/direct/image/vhu1051tf93277757p4gkjes41/7rNanaRqMsc9p3HhnVNSIEeHbJQ/original?content-type=image%2Fpng&name=_AMPLIFIED.png';if(n.includes('kicker'))return 'https://down-ph.img.susercontent.com/file/962ea81bf211c3afc930edf076da9e76';if(n.includes('jbl'))return '/assets/brand-logos/jbl.svg';if(n.includes('denon'))return '/assets/brand-logos/denon.svg';if(n.includes('sony'))return '/assets/brand-logos/sony.svg';if(n.includes('hertz'))return '/assets/brand-logos/hertz.svg';const map=[[/klipsch/,'https://commons.wikimedia.org/wiki/Special:FilePath/Klipsch_logo.png'],[/sonos/,'https://cdn.simpleicons.org/sonos'],[/jvc/,'https://cdn.simpleicons.org/jvc'],[/onkyo/,'https://cdn.simpleicons.org/onkyo'],[/jlab/,'https://cdn.simpleicons.org/jlab'],[/arcam/,'https://cdn.simpleicons.org/arcam'],[/integra/,'https://cdn.simpleicons.org/integra'],[/sonance/,'https://cdn.simpleicons.org/sonance'],[/roborock/,'https://cdn.simpleicons.org/roborock'],[/aiper/,'https://cdn.simpleicons.org/aiper'],[/vogel/,'https://cdn.simpleicons.org/vogels'],[/hdanywhere/,'https://cdn.simpleicons.org/hdanywhere'],[/pioneer/,'https://commons.wikimedia.org/wiki/Special:FilePath/Pioneer_logo.svg'],[/kenwood/,'https://upload.wikimedia.org/wikipedia/commons/0/07/Kenwood_Logo.svg'],[/alpine/,'https://upload.wikimedia.org/wikipedia/commons/5/56/Alpine_logo.svg'],[/audison/,'https://upload.wikimedia.org/wikipedia/commons/e/ec/Audison_logo.png'],[/kicker/,'https://down-ph.img.susercontent.com/file/962ea81bf211c3afc930edf076da9e76'],[/focal/,'https://commons.wikimedia.org/wiki/Special:FilePath/Focal_logo.svg']];return (map.find(x=>x[0].test(n))||[])[1]||'https://cdn.simpleicons.org/'+n.replace(/[^a-z0-9]+/g,'')}
function typeImage(name){
 const n=String(name||"").toLowerCase();
 const photos=department==="Home Entertainment"?[
  [/home audio|home cinema|speaker|soundbar/,"https://images.unsplash.com/photo-1558284296-7579da2deb30?auto=format&fit=crop&w=720&q=82"],
  [/projection screens|projectors|displays & projection/,"https://images.unsplash.com/photo-1524985069026-dd778a71c7b4?auto=format&fit=crop&w=720&q=82"],
  [/cables|mounts|accessories|av infrastructure|control/,"https://images.unsplash.com/photo-1771554753127-8e5a90b5a61d?auto=format&fit=crop&w=720&q=82"],
  [/installed audio|conferencing|collaboration|other home ci|other installed av/,"https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&w=720&q=82"]
 ]:[
  [/speaker|component/,"https://images.unsplash.com/photo-1654447398824-dbcbefeafdd6?auto=format&fit=crop&w=720&q=82"],
  [/subwoofer/,"https://images.unsplash.com/photo-1776176359206-a1d34436ddff?auto=format&fit=crop&w=720&q=82"],
  [/amplifier/,"https://images.unsplash.com/photo-1543017471-62c14029f7ce?auto=format&fit=crop&w=720&q=82"],
  [/head unit|media player|radio/,"https://images.unsplash.com/photo-1470948062737-aeb014e274c2?auto=format&fit=crop&w=720&q=82"],
  [/camera|monitor/,"https://images.unsplash.com/photo-1738138986988-add3dd7cde9a?auto=format&fit=crop&w=720&q=82"],
  [/signal processing|crossover|dsp/,"https://images.unsplash.com/photo-1543017471-62c14029f7ce?auto=format&fit=crop&w=720&q=82"],
  [/harness|trim|fitment|wiring/,"https://images.unsplash.com/photo-1677230017860-a8cc67785f0a?auto=format&fit=crop&w=720&q=82"],
  [/aerial|antenna/,"https://images.unsplash.com/photo-1759667880866-702f9f615489?auto=format&fit=crop&w=720&q=82"]
 ];
 const found=photos.find(([re])=>re.test(n));
 return found?found[1]:"";
}
function rowsFor(data){const p=data[0]?.records||[],ac=data[1]?.records||[];const enriched=p.map(x=>({...x,division:x.division||(x.collection==='Car Audio & Video'||x.collection==='Harnesses & Trims'?'Car Audio':x.division)}));function isHomeEntertainmentRecord(x){if(x.collection==='Installed AV')return true;if(x.collection!=='Home Entertainment')return false;const component=String(x.component||'');const title=[x.title,x.name,x.description].join(' ').toLowerCase();if(component==='Home & Leisure Appliances')return false;if(component==='Smart Home & Security')return /sonos|soundbar|speaker|audio|home theatre|home theater|headphone|earbud|receiver|amplifier/.test(title);if(component==='Other Home Retail')return /audio|speaker|soundbar|subwoofer|earbud|earphone|headphone|headset|sonos|klipsch|home theatre|home theater|amplifier|hdmi|optical adapter|line-in|wall mount|stand/.test(title);return true;}return unique(enriched.concat(ac)).filter(x=>x.component!=='Excluded — Non-Audio Merchandise').filter(x=>department==='Car Audio'?x.division==='Car Audio'&&x.collection!=='Marine Audio':department==='Home Entertainment'?isHomeEntertainmentRecord(x):x.collection===department)}
function load(){return Promise.all(['assets/planetworld-catalogue-preview.json','assets/audio-connections-catalogue-preview.json'].map(u=>fetch(u).then(r=>{if(!r.ok)throw Error('Catalogue unavailable');return r.json()})))}

load().then(d=>{const rows=rowsFor(d);if(!brand)throw Error('A brand was not selected. Return to Car Audio & Video and choose a brand.');const types=[...new Set(rows.filter(p=>p.brand===brand).map(group).filter(Boolean))].sort((a,b)=>{const order=['Head Units & Media Players','Speakers & Component Kits','Subwoofers','Amplifiers','Cameras & Monitors','Signal Processing & Crossovers','Accessories','Harnesses, Trims & Fitment','Aerials'];return (order.indexOf(a)<0?999:order.indexOf(a))-(order.indexOf(b)<0?999:order.indexOf(b))||a.localeCompare(b)});const displayBrand=brandDisplayName(brand);const src=logo(brand);$('content').innerHTML='<section class="brandHero">'+(src?'<img src="'+src+'" alt="'+displayBrand+' logo" onerror="this.replaceWith(Object.assign(document.createElement(\'strong\'),{className:\'brandWordmark\',textContent:displayBrand}))">':'<strong style="font-size:28px">'+displayBrand+'</strong>')+'<div><div class="eyebrow">'+label+'</div><h1 class="heading">'+displayBrand+'</h1><p class="sub">Choose a product type to continue. Products are shown on the next page.</p></div></section><h2 class="heading" style="font-size:22px">Choose a product type</h2><div class="grid" id="types"></div>';const grid=$('types');if(!types.length){grid.outerHTML='<p class="empty">No reviewed product types are currently listed for '+brand+'. No products are displayed on this page.</p>';return}types.forEach(t=>{const card=document.createElement('a');card.className='typeCard';card.href='preview-audio-products.html?'+new URLSearchParams({department,brand,component:t,label});const exactBrandImage=rows.find(p=>p.brand===brand&&group(p)===t&&p.imageUrl);const sharedTypeImage=rows.find(p=>group(p)===t&&p.imageUrl);const imageSrc=(exactBrandImage&&exactBrandImage.imageUrl)||(sharedTypeImage&&sharedTypeImage.imageUrl)||typeImage(t);if(imageSrc){const img=document.createElement('img');img.src=imageSrc;img.alt=t+" product category";img.loading="lazy";img.onerror=()=>{img.onerror=null;const fallback=typeImage(t);if(fallback)img.src=fallback;else img.remove()};card.append(img)}const title=document.createElement('strong');title.textContent=t;card.append(title);grid.append(card)})}).catch(e=>{$('content').innerHTML='<p class="empty">'+String(e.message||e)+'</p>'});
