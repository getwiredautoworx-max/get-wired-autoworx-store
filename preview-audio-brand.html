<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Car Audio Brand | Get Wired AutoWorx</title><link rel="stylesheet" href="assets/storefront-subpage-shell.css"><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f2f6fa;color:#173650;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.back{display:inline-block;padding:10px 14px;border-radius:9px;background:#0b3554;color:#fff;text-decoration:none;font-weight:700}.eyebrow{font-size:12px;letter-spacing:.12em;color:#56748c;font-weight:800}.heading{margin:5px 0;font-size:clamp(24px,4vw,36px)}.sub{color:#56748c;margin:0 0 20px}.brandHero,.typeCard,.product{background:#fff;border:1px solid #d4e0e9;border-radius:14px;box-shadow:0 4px 16px #18354a12}.brandHero{padding:18px;display:flex;align-items:center;gap:18px;margin-bottom:20px}.brandHero img{width:160px;height:72px;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.typeCard{display:block;color:inherit;text-decoration:none;overflow:hidden;transition:transform .15s}.typeCard:active{transform:scale(.99)}.typeCard img{display:block;width:100%;height:170px;object-fit:cover;background:#e7eef4}.typeCard strong{display:block;padding:13px;font-size:16px}.product{display:grid;grid-template-columns:170px 1fr;gap:16px;padding:14px;margin:12px 0}.product img{width:100%;height:150px;object-fit:contain;background:#f4f7fa;border-radius:8px}.product h3{margin:3px 0 8px}.meta{color:#56748c;font-size:13px}.price{font-weight:800;margin-top:10px}.empty{padding:22px;background:#fff;border:1px solid #d4e0e9;border-radius:12px}@media(max-width:700px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.typeCard img{height:125px}.brandHero img{width:110px;height:60px}.product{grid-template-columns:100px 1fr;gap:10px;padding:10px}.product img{height:110px}}@media(max-width:380px){.grid{grid-template-columns:1fr 1fr}.typeCard img{height:110px}}
</style></head><body><main class="wrap"><nav class="top"><a class="back" href="preview-audio.html">← Audio departments</a><span class="eyebrow">GET WIRED AUTOWORX · OWNER PREVIEW</span></nav><div id="content"><p class="empty">Loading brand categories…</p></div></main>
<script>
const params=new URLSearchParams(location.search),department=params.get('department')||'Car Audio',brand=params.get('brand')||'',component=params.get('component')||'',label=params.get('label')||'Car Audio & Video';
const $=id=>document.getElementById(id);
function group(p){const raw=String(p.component||'').trim().toLowerCase();if(p.collection==='Harnesses & Trims'||p.component==='Harnesses, Trims & Fitment')return 'Harnesses, Trims & Fitment';if(/^(car audio|car audio & video|car audio and video|all car audio products)$/.test(raw))return '';if(raw==='speakers')return 'Speakers & Component Kits';if(raw==='cameras'||raw.includes('display'))return 'Cameras & Monitors';if(raw.includes('processor')||raw.includes('crossover'))return 'Signal Processing & Crossovers';return p.component||'Other / Review'}
function unique(rows){const seen=new Set();return rows.filter(p=>{const k=JSON.stringify([p.collection,p.brand,p.title,p.component,p.indicativePrice,p.hasStock,p.modelNumber||'']);if(seen.has(k))return false;seen.add(k);return true})}
function logo(b){const n=b.toLowerCase();if(n.includes('jbl'))return 'assets/brand-logos/jbl.svg';if(n.includes('denon'))return 'assets/brand-logos/denon.svg';if(n.includes('hertz'))return 'assets/brand-logos/hertz.svg';return ''}
function typeImage(name){const n=name.toLowerCase();const map=[[/speaker|component/,'https://ds18.com/cdn/shop/files/S65C-2000x2000_grande.jpg?v=1742315221'],[/subwoofer/,'https://i.ebayimg.com/00/s/MTYwMFgxNjAw/z/g-AAAOSwRGVh76DB/$_57.JPG'],[/amplifier/,'https://nakamichicaraudio.com/cdn/shop/files/1_NKTA75.2_600x.png?v=1749694509'],[/head unit|media player|radio/,'https://bossaudio.com/cdn/shop/files/lw1bpspmyfs4nx6h4byu_108a72e4-501e-438f-a73b-df15522b8f83_1445x.png?v=1728960891'],[/camera|monitor/,'https://down-ph.img.susercontent.com/file/23da3f49f2e772cfaa55a72f0704f539'],[/signal processing|crossover|dsp/,'https://soundautoconcept.com/cdn/shop/files/esx-dsp-numerique-default-title-dsp-esx-qe812sp-58524501344579.jpg?v=1745945938&width=1214'],[/harness|trim|fitment|wiring/,'https://fljoffroad.com/cdn/shop/collections/electricite_4x4_FLJ_Offroad.png?v=1777822231&width=800'],[/aerial|antenna/,'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=720&q=82']];return (map.find(x=>x[0].test(n))||[])[1]||'assets/car-audio-video-category.svg'}
function rowsFor(data){const p=data[0]||[],v=data[1]||[],ac=data[2]||[];const matched=new Set();const enriched=p.map(x=>{const div=x.division||(x.collection==='Car Audio & Video'||x.collection==='Harnesses & Trims'?'Car Audio':x.division);const m=v.find(y=>{const t=' '+String(x.title||'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim()+' ';const k=String(y.modelNumber||'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();return k&&t.startsWith(' '+k+' ')});if(!m)return {...x,division:div};matched.add(m.gwSku);return {...x,division:div,modelNumber:m.modelNumber,description:m.description,imageUrl:m.imageUrl||x.imageUrl}});const extras=v.filter(x=>!matched.has(x.gwSku)).map(x=>({division:'Car Audio',collection:'Car Audio & Video',brand:x.brand,title:x.name,component:x.component,indicativePrice:null,modelNumber:x.modelNumber,description:x.description,imageUrl:x.imageUrl}));return unique(enriched.concat(extras,ac)).filter(x=>x.component!=='Excluded — Non-Audio Merchandise').filter(x=>department==='Car Audio'?x.division==='Car Audio'&&x.collection!=='Marine Audio':x.collection===department)}
function load(){return Promise.all(['assets/planetworld-catalogue-preview.json','assets/planetworld-verified-models-preview.json','assets/audio-connections-catalogue-preview.json'].map(u=>fetch(u).then(r=>{if(!r.ok)throw Error('Catalogue unavailable');return r.json()})))}

load().then(d=>{const rows=rowsFor(d);if(!brand)throw Error('A brand was not selected. Return to Car Audio & Video and choose a brand.');const types=[...new Set(rows.filter(p=>p.brand===brand).map(group).filter(Boolean))].sort((a,b)=>{const order=['Head Units & Media Players','Speakers & Component Kits','Subwoofers','Amplifiers','Cameras & Monitors','Signal Processing & Crossovers','Accessories','Harnesses, Trims & Fitment','Aerials'];return (order.indexOf(a)<0?999:order.indexOf(a))-(order.indexOf(b)<0?999:order.indexOf(b))||a.localeCompare(b)});const src=logo(brand);$('content').innerHTML='<section class="brandHero">'+(src?'<img src="'+src+'" alt="'+brand+' logo" onerror="this.remove()">':'<strong style="font-size:28px">'+brand+'</strong>')+'<div><div class="eyebrow">'+label+'</div><h1 class="heading">'+brand+'</h1><p class="sub">Choose a product type to continue. Products are shown on the next page.</p></div></section><h2 class="heading" style="font-size:22px">Choose a product type</h2><div class="grid" id="types"></div>';const grid=$('types');if(!types.length){grid.outerHTML='<p class="empty">No reviewed product types are currently listed for '+brand+'. No products are displayed on this page.</p>';return}types.forEach(t=>{const card=document.createElement('a');card.className='typeCard';card.href='preview-audio-products.html?'+new URLSearchParams({department,brand,component:t,label});const img=document.createElement('img');img.src=typeImage(t);img.alt=t;img.onerror=()=>{img.onerror=null;img.src='assets/car-audio-video-category.svg'};const title=document.createElement('strong');title.textContent=t;card.append(img,title);grid.append(card)})}).catch(e=>{$('content').innerHTML='<p class="empty">'+String(e.message||e)+'</p>'});
</script></body></html>
