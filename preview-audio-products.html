<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Audio Products | Get Wired AutoWorx</title><link rel="stylesheet" href="assets/storefront-subpage-shell.css"><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f2f6fa;color:#173650;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.back{display:inline-block;padding:10px 14px;border-radius:9px;background:#0b3554;color:#fff;text-decoration:none;font-weight:700}.eyebrow{font-size:12px;letter-spacing:.12em;color:#56748c;font-weight:800}.heading{margin:5px 0;font-size:clamp(24px,4vw,36px)}.sub{color:#56748c;margin:0 0 20px}.brandHero,.typeCard,.product{background:#fff;border:1px solid #d4e0e9;border-radius:14px;box-shadow:0 4px 16px #18354a12}.brandHero{padding:18px;display:flex;align-items:center;gap:18px;margin-bottom:20px}.brandHero img{width:160px;height:72px;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.typeCard{display:block;color:inherit;text-decoration:none;overflow:hidden;transition:transform .15s}.typeCard:active{transform:scale(.99)}.typeCard img{display:block;width:100%;height:170px;object-fit:cover;background:#e7eef4}.typeCard strong{display:block;padding:13px;font-size:16px}.product{display:grid;grid-template-columns:170px minmax(0,1fr);align-items:center;gap:16px;padding:14px;margin:12px 0}.productMedia{min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}.productDetails{min-width:0;text-align:center}.productDetails p{margin:8px 0;line-height:1.5}.productDetails h3{line-height:1.3}.productDetails .productModel{font-size:19px;font-weight:900;margin:3px 0 5px;color:#123a58}.productDetails .productBrand{font-size:13px;font-weight:800;color:#56748c;margin-bottom:8px}.productDetails .productDescription{font-size:14px;color:#243f55}.productDetails .productPrice{font-size:19px;color:#0b3554}.product img{width:100%;height:150px;object-fit:contain;background:#f4f7fa;border-radius:8px}.productPhotoCrop{width:100%;aspect-ratio:4/3;align-self:start;overflow:hidden;border-radius:8px;background:#f4f7fa}.productPhotoCrop img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 40%}.product h3{margin:3px 0 8px}.meta{color:#56748c;font-size:13px}.price{font-weight:800;margin-top:10px}.empty{padding:22px;background:#fff;border:1px solid #d4e0e9;border-radius:12px}.photoPending{display:grid;place-items:center;min-height:150px;padding:12px;border-radius:8px;background:#f4f7fa;color:#667b8d;font-size:12px;font-weight:700;text-align:center}.imageReviewNote{display:block;margin:5px 0;color:#80602a;font-size:11px;font-weight:600}@media(max-width:700px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.typeCard img{height:125px}.brandHero img{width:110px;height:60px}.product{grid-template-columns:100px minmax(0,1fr);gap:10px;padding:10px}.productDetails{font-size:14px}.product img{height:110px}}@media(max-width:380px){.grid{grid-template-columns:1fr 1fr}.typeCard img{height:110px}}
</style></head><body><main class="wrap"><nav class="top"><a class="back" href="preview-audio.html">← Audio departments</a><span class="eyebrow">GET WIRED AUTOWORX · OWNER PREVIEW</span></nav><div id="content"><p class="empty">Loading matching products…</p></div></main>
<script>
const params=new URLSearchParams(location.search),department=params.get('department')||'Car Audio',brand=params.get('brand')||'',component=params.get('component')||'',label=params.get('label')||'Car Audio & Video';
const $=id=>document.getElementById(id);
function group(p){const raw=String(p.component||'').trim().toLowerCase();if(p.collection==='Harnesses & Trims'||p.component==='Harnesses, Trims & Fitment')return 'Harnesses, Trims & Fitment';if(/^(car audio|car audio & video|car audio and video|all car audio products)$/.test(raw))return '';if(raw==='speakers')return 'Speakers & Component Kits';if(raw.includes('radio')||raw.includes('multimedia')||raw.includes('head unit')||raw.includes('media player'))return 'Head Units & Media Players';if(raw==='cameras'||raw.includes('display'))return 'Cameras & Monitors';if(raw.includes('processor')||raw.includes('crossover'))return 'Signal Processing & Crossovers';return p.component||'Other / Review'}
function unique(rows){const seen=new Set();return rows.filter(p=>{const k=JSON.stringify([p.collection,p.brand,p.title,p.component,p.indicativePrice,p.hasStock,p.manufacturerProductName||'']);if(seen.has(k))return false;seen.add(k);return true})}
function logo(b){const n=b.toLowerCase();if(n.includes('jbl'))return 'assets/brand-logos/jbl.svg';if(n.includes('denon'))return 'assets/brand-logos/denon.svg';if(n.includes('hertz'))return 'assets/brand-logos/hertz.svg';return ''}
function typeImage(name){
 const n=String(name||"").toLowerCase();
 const photos=[
  [/subwoofer/,"https://images.unsplash.com/photo-1776176359206-a1d34436ddff?auto=format&fit=crop&w=720&q=82"],
  [/amplifier/,"https://images.unsplash.com/photo-1543017471-62c14029f7ce?auto=format&fit=crop&w=720&q=82"],
  [/speaker|component/,"https://images.unsplash.com/photo-1726248985986-20bef82d2b52?auto=format&fit=crop&w=720&q=82"],
  [/head unit|media player|radio/,"https://images.unsplash.com/photo-1470948062737-aeb014e274c2?auto=format&fit=crop&w=720&q=82"],
  [/camera|monitor/,"https://images.unsplash.com/photo-1738138986988-add3dd7cde9a?auto=format&fit=crop&w=720&q=82"],
  [/signal processing|crossover|dsp|processor/,"https://images.unsplash.com/photo-1543017471-62c14029f7ce?auto=format&fit=crop&w=720&q=82"],
  [/harness|trim|fitment|wiring/,"https://images.unsplash.com/photo-1677230017860-a8cc67785f0a?auto=format&fit=crop&w=720&q=82"],
  [/aerial|antenna/,"https://images.unsplash.com/photo-1759667880866-702f9f615489?auto=format&fit=crop&w=720&q=82"],
  [/home audio|home cinema|projection|projector|display|cables|mounts|accessories|av infrastructure|installed audio|conferencing|collaboration/,"https://images.unsplash.com/photo-1558284296-7579da2deb30?auto=format&fit=crop&w=720&q=82"]
 ];
 const found=photos.find(([re])=>re.test(n));
 return found?found[1]:"";
}
function rowsFor(data){const p=data[0]?.records||[],ac=data[1]?.records||[];const enriched=p.map(x=>({...x,division:x.division||(x.collection==='Car Audio & Video'||x.collection==='Harnesses & Trims'?'Car Audio':x.division)}));function isHomeEntertainmentRecord(x){if(x.collection==='Installed AV')return true;if(x.collection!=='Home Entertainment')return false;const component=String(x.component||'');const title=[x.title,x.name,x.description].join(' ').toLowerCase();if(component==='Home & Leisure Appliances')return false;if(component==='Smart Home & Security')return /sonos|soundbar|speaker|audio|home theatre|home theater|headphone|earbud|receiver|amplifier/.test(title);if(component==='Other Home Retail')return /audio|speaker|soundbar|subwoofer|earbud|earphone|headphone|headset|sonos|klipsch|home theatre|home theater|amplifier|hdmi|optical adapter|line-in|wall mount|stand/.test(title);return true;}return unique(enriched.concat(ac)).filter(x=>x.component!=='Excluded — Non-Audio Merchandise').filter(x=>department==='Car Audio'?x.division==='Car Audio'&&x.collection!=='Marine Audio':department==='Home Entertainment'?isHomeEntertainmentRecord(x):x.collection===department)}
function load(){return Promise.all(['assets/planetworld-catalogue-preview.json','assets/audio-connections-catalogue-preview.json'].map(u=>fetch(u).then(r=>{if(!r.ok)throw Error('Catalogue unavailable');return r.json()})))}

load().then(d=>{const rows=rowsFor(d).filter(p=>p.brand===brand&&group(p)===component);$('content').innerHTML='<div class="eyebrow">'+label+' / '+brand+'</div><h1 class="heading">'+component+'</h1><p class="sub">Matching products for '+brand+' · '+rows.length+' catalogue records</p><div id="products"></div>';const list=$('products');if(!rows.length){list.innerHTML='<p class="empty">No products are currently listed for this brand and product type.</p>';return}rows.forEach(p=>{const card=document.createElement('article');card.className='product';const media=document.createElement('div');media.className='productMedia';const imageSrc=p.imageUrl||'';const missingPhoto=()=>{const missing=document.createElement('div');missing.className='photoPending';missing.textContent='Exact product photo pending verification';missing.setAttribute('aria-label','Exact product photo pending verification for '+(p.title||'this product'));return missing};if(imageSrc){const img=document.createElement('img');img.src=imageSrc;img.alt=p.title||component;img.loading='lazy';if(p.imageCrop){const photo=document.createElement('div');photo.className='productPhotoCrop';img.style.objectPosition=p.imagePosition||'center 40%';img.onerror=()=>{img.onerror=null;photo.replaceWith(missingPhoto())};photo.append(img);media.append(photo)}else{img.onerror=()=>{img.onerror=null;img.replaceWith(missingPhoto())};media.append(img)}}else{media.append(missingPhoto())}if(p.imageStatus&&(/candidate|review_only/i.test(p.imageStatus))){const note=document.createElement('small');note.className='imageReviewNote';note.textContent='Owner-authorised source image — review-only preview';media.append(note)}const body=document.createElement('div');body.className='productDetails';const title=document.createElement('h3');title.className='productModel';title.textContent=p.modelNumber||p.manufacturerProductName||p.title||p.name||'Product';title.setAttribute('data-product-model','');const meta=document.createElement('div');meta.className='meta productBrand';meta.textContent=p.brandDisplayName||p.brand||'';meta.setAttribute('data-product-brand','');const desc=document.createElement('p');desc.className='productDescription';desc.textContent=p.description||'Product details to be confirmed.';desc.setAttribute('data-product-description','');const price=document.createElement('div');price.className='price productPrice';price.setAttribute('data-product-price','');price.textContent='Price On Request';body.append(title,meta,desc,price);card.append(media,body);list.append(card)})}).catch(e=>{$('content').innerHTML='<p class="empty">'+String(e.message||e)+'</p>'});
</script></body></html>
