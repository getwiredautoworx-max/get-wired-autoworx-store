<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#02060d"><title>Get Wired AutoWorx | Order Management</title><style>:root{--bg:#02060d;--panel:#071222;--blue:#08a5ff;--red:#ff1c2d;--white:#f5f8fc;--muted:#aab7c8;--line:#12456c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#0c2944 0,#030914 45%,#02060d 80%);color:var(--white);font:14px Arial,Helvetica,sans-serif}.wrap{max-width:1300px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font-size:22px;font-weight:900}.brand span{color:var(--red)}button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:800;background:var(--blue);color:#00111d}.danger{background:var(--red);color:#fff}.ghost{background:#06111e;color:#fff;border:1px solid #1e79b0}.panel{background:#07111e;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px}.login{max-width:430px;margin:8vh auto}.field{margin:10px 0}.field label{display:block;color:#aab7c8;margin-bottom:6px;font-size:12px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:12px;background:#050d18;color:#fff;border:1px solid #174d70;border-radius:7px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.orders{display:grid;gap:12px}.order{background:#050d18;border:1px solid #174d70;border-radius:10px;padding:15px}.orderHead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.num{font-size:20px;font-weight:900}.muted{color:var(--muted)}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#123452;font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.stat{background:#06111e;border:1px solid var(--line);padding:12px;border-radius:8px}.stat b{display:block;font-size:18px}.items{margin-top:12px;border-top:1px solid var(--line)}.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(18,69,108,.5)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}.msg{margin-top:10px;padding:10px;border-radius:7px;background:#0a1b2d}.error{background:#3a1016;color:#ffdce0}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div class="brand">GET WIRED <span>AUTOWORX</span> — ORDER MANAGEMENT</div><button id="logout" class="btn ghost hidden">LOG OUT</button></div><section id="login" class="panel login"><h2>Admin sign in</h2><p class="muted">Authorised store administrators only.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">SIGN IN</button></form><div id="loginMsg"></div></section><section id="app" class="hidden"><div class="panel"><div class="toolbar"><select id="filter"><option value="">All orders</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="processing">Processing</option><option value="ready">Ready</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><button id="refresh" class="btn">REFRESH</button><span id="summary" class="muted"></span></div></div><div id="orders" class="orders"></div></section></div><script src="assets/admin.js"></script></body></html>
