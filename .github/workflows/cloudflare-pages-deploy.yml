name: Deploy Store to Cloudflare Pages

on:
  # Manual-only: run only after the owner approves the final release.
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Cloudflare Pages production deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build clean runtime-only storefront
        run: bash scripts/build-storefront.sh dist && cp _headers dist/_headers
      - name: Deploy approved storefront output only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=get-wired-autoworx-store --branch=main
          gitHubToken: \${{ secrets.GITHUB_TOKEN }}
