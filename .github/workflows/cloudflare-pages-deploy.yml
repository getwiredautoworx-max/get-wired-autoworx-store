name: Deploy Store to Cloudflare Pages

on:
  # Deliberately manual-only until the approved release is ready and
  # Cloudflare deployment secrets have been verified by the account owner.
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Cloudflare Pages production deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=get-wired-autoworx-store --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
