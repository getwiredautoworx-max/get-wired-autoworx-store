name: Cancel superseded slow ASC crawl
on:
  push:
    branches: [audit/asc-catalogue-cleanup]
    paths:
      - ".github/workflows/cancel-superseded-asc-crawl.yml"
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the obsolete serial crawl
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cancel-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GH_REPOSITORY/actions/runs/39017530629/cancel")
          cat /tmp/cancel-response.json
          echo "GitHub cancellation HTTP status: $code"
          test "$code" = "202" || test "$code" = "409"
