name: Build Store APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk-sales-intelligence/**'
      - '.github/workflows/build-store-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: apk-sales-intelligence
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: get-wired-autoworx-sales-v0.3.1
          path: apk-sales-intelligence/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Emulator install and launch validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r apk-sales-intelligence/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n za.co.getwiredautoworx.sales/.MainActivity
            sleep 8
            adb shell dumpsys package za.co.getwiredautoworx.sales | grep -q 'versionName=0.3.1'
            adb shell dumpsys activity activities | grep -q 'za.co.getwiredautoworx.sales/.MainActivity'
