name: ASC live status audit (read-only)
on:
  pull_request:
    paths:
      - 'audit-tools/asc_live_status_audit.py'
      - '.github/workflows/asc-live-status-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asc-live-status-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned HTTP dependency
        run: python -m pip install requests==2.32.5
      - name: Run no-network audit self-tests
        run: python audit-tools/asc_live_status_audit.py --self-test
      - name: Run read-only ASC status comparison
        if: github.event_name == 'workflow_dispatch'
        run: python audit-tools/asc_live_status_audit.py
      - name: Upload audit report
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: asc-live-status-audit
          path: reports/asc_live_status_audit.*
          if-no-files-found: warn
          retention-days: 7
