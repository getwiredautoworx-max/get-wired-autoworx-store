name: Mobile Storefront Layout Browser QA

on:
  push:
    branches:
      - fix/mobile-storefront-layout-2026-10-19-v3
    paths:
      - 'index-new.html'
      - 'store.html'
      - 'category-navigation.js'
      - 'assets/category-cleanup.js'
      - 'assets/store-category-hierarchy.json'
      - 'scripts/test-mobile-layout.cjs'
      - '.github/workflows/mobile-layout-browser-qa.yml'
  pull_request:
    paths:
      - 'index-new.html'
      - 'store.html'
      - 'scripts/test-mobile-layout.cjs'
      - '.github/workflows/mobile-layout-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install isolated Playwright browser runner
        run: |
          mkdir -p "$RUNNER_TEMP/mobile-layout-qa"
          cd "$RUNNER_TEMP/mobile-layout-qa"
          npm init -y
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test storefront at 320, 390, 430 and 1440 pixels
        env:
          NODE_PATH: ${{ runner.temp }}/mobile-layout-qa/node_modules
          QA_OUT: ${{ github.workspace }}/qa-evidence
        run: node scripts/test-mobile-layout.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-screenshots-${{ github.run_id }}
          path: qa-evidence/
          if-no-files-found: warn
          retention-days: 14
