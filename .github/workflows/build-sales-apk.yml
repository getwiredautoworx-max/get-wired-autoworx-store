name: Build Get Wired Sales Intelligence APK
on:
  push:
    branches: [apk-sales-intelligence]
    paths:
      - 'apk-sales-intelligence/**'
      - '.github/workflows/build-sales-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: apk-sales-intelligence
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: get-wired-sales-intelligence-debug
          path: apk-sales-intelligence/app/build/outputs/apk/debug/app-debug.apk
