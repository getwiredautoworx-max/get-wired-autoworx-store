name: Build and Emulator-Test Sales Intelligence APK

on:
  push:
    branches: [apk-sales-intelligence-v03]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Build debug APK
        run: gradle -p apk-sales-intelligence :app:assembleDebug
      - name: Verify APK
        run: |
          test -s apk-sales-intelligence/app/build/outputs/apk/debug/app-debug.apk
          unzip -t apk-sales-intelligence/app/build/outputs/apk/debug/app-debug.apk
      - name: Run APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r apk-sales-intelligence/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm list packages | grep -q 'za.co.getwiredautoworx.sales'
            adb shell monkey -p za.co.getwiredautoworx.sales -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell pidof za.co.getwiredautoworx.sales
            adb shell dumpsys activity activities | grep -q 'za.co.getwiredautoworx.sales'
      - name: Publish emulator-tested APK
        uses: actions/upload-artifact@v4
        with:
          name: get-wired-sales-intelligence-v0.3.1-emulator-tested
          path: apk-sales-intelligence/app/build/outputs/apk/debug/app-debug.apk
