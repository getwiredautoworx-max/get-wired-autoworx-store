name: Audio Official Model Candidate Extractor

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */4 * * *"
  push:
    branches:
      - fix/owner-preview-population-and-full-height-images-2026-11-09
    paths:
      - "scripts/extract-audison-official-candidates.py"
      - "catalogue-review/planetworld-audison-official-model-audit.csv"
      - "assets/audio-product-enrichment-overrides.json"
      - ".github/workflows/audio-official-model-candidate-extraction.yml"

permissions:
  contents: write

concurrency:
  group: audio-official-model-candidates
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image inspection dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.0.0
      - name: Extract a bounded batch of exact Audison product-page candidates
        run: python scripts/extract-audison-official-candidates.py --limit 5
      - name: Commit review-only candidate images and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue-review/audio-official-model-candidates
          if git diff --cached --quiet; then echo "No new official audio candidates."; exit 0; fi
          git commit -m "chore(audio): checkpoint official product-page image candidates"
          git push
