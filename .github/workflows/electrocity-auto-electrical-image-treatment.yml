name: Auto Electrical Preview Image Treatment
on:
  workflow_dispatch:
  push:
    branches:
      - owner/electrocity-auto-electrical-priority-2026-11-17
    paths:
      - "scripts/process-auto-electrical-preview-images.py"
      - "suppliers/Electrocity/catalogue-work/ignition-looms-modules/normalised-review.csv"
      - "suppliers/Electrocity/catalogue-work/ignition-looms-modules/page-evidence/**"
      - ".github/workflows/electrocity-auto-electrical-image-treatment.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/process-auto-electrical-preview-images.py"
      - "suppliers/Electrocity/catalogue-work/ignition-looms-modules/normalised-review.csv"
      - "suppliers/Electrocity/catalogue-work/ignition-looms-modules/page-evidence/**"
      - ".github/workflows/electrocity-auto-electrical-image-treatment.yml"
permissions:
  contents: write
concurrency:
  group: auto-electrical-image-treatment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  treatment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned image-processing dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.0.0
      - name: Generate sanitized customer-preview product images
        run: python scripts/process-auto-electrical-preview-images.py
      - name: Commit neutral preview assets and review evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/auto-electrical-products
          git add catalogue-review/electrocity-auto-electrical-image-manifest.json
          git add catalogue-review/electrocity-auto-electrical-contact-sheet.jpg
          if git diff --cached --quiet; then echo "No image-treatment output changes."; exit 0; fi
          git commit -m "chore(images): add sanitized Auto Electrical preview images"
          target_branch="${{ github.head_ref || github.ref_name }}"
          git pull --rebase origin "$target_branch"
          git push origin "HEAD:$target_branch"
