name: Owner Preview Mobile and Desktop Browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'index-new.html'
      - 'owner-preview.html'
      - 'preview-audio*.html'
      - 'assets/category-tree.json'
      - 'assets/*catalogue-preview.json'
      - 'assets/auto-electrical-owner-preview.json'
      - 'tests/owner-preview-browser-qa.cjs'
      - '.github/workflows/store-preview-browser-qa.yml'
  push:
    branches: [main]
    paths:
      - 'index-new.html'
      - 'owner-preview.html'
      - 'preview-audio*.html'
      - 'assets/category-tree.json'
      - 'assets/*catalogue-preview.json'
      - 'assets/auto-electrical-owner-preview.json'
      - 'tests/owner-preview-browser-qa.cjs'
      - '.github/workflows/store-preview-browser-qa.yml'
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static preview server
        run: |
          python3 -m http.server 4173 >/tmp/gw-preview-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/owner-preview.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/gw-preview-server.log
          exit 1
      - name: Verify mobile and desktop owner preview and audio product route
        run: node tests/owner-preview-browser-qa.cjs
