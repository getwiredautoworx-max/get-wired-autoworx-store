name: Populated Store Preview Browser QA

on:
  push:
    branches: [integration/current-main-refresh-2026-11-01]
    paths:
      - 'preview-store.html'
      - 'preview-category.html'
      - 'preview-products.html'
      - 'preview-product.html'
      - 'preview-planetworld.html'
      - 'preview-audio.html'
      - 'tests/audio-navigation.test.cjs'
      - 'tests/asc-catalogue-navigation.test.cjs'
      - 'scripts/build-cloudflare-pages-public.py'
      - 'assets/**'
      - '.github/workflows/store-preview-browser-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'preview-store.html'
      - 'preview-category.html'
      - 'preview-products.html'
      - 'preview-product.html'
      - 'preview-planetworld.html'
      - 'preview-audio.html'
      - 'tests/audio-navigation.test.cjs'
      - 'tests/asc-catalogue-navigation.test.cjs'
      - 'assets/**'
      - '.github/workflows/store-preview-browser-qa.yml'

permissions:
  contents: read

jobs:
  populated-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build the exact isolated preview package
        run: python3 scripts/build-cloudflare-pages-public.py
        env:
          GW_INCLUDE_PREVIEW_ROUTES: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Audio hierarchy source and package checks
        run: node tests/audio-navigation.test.cjs
      - name: Run ASC catalogue navigation checks
        run: node tests/asc-catalogue-navigation.test.cjs
      - name: Run read-only populated preview browser checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory pages-public --bind 127.0.0.1 >/tmp/gw-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          const ASC_PUBLIC_SKUS = [
            'GW-09D1B7AD','GW-1C87D5E5','GW-1CE86A57','GW-1ED91C25','GW-269894FE',
            'GW-2A7A9F1E','GW-2AE829B0','GW-2C508DE3','GW-2C792975','GW-31FC9859',
            'GW-334E3E01','GW-39D7BE90','GW-3EEEC849','GW-43EDB928','GW-4B57D263',
            'GW-4EE1C0D7','GW-4FE9F254','GW-55138BB7','GW-558D6CCF','GW-5EEF5729',
            'GW-63A2C0A3','GW-8923C055','GW-8B85BE3E','GW-94FB6A20','GW-957F1BB1',
            'GW-A792D62B','GW-ACBAADC3','GW-B068547C','GW-B1E343ED','GW-D1CCE3E1',
            'GW-D8CB9050','GW-DA4281C8','GW-EC20B1E8','GW-F5FAD5A5','GW-F856C85B',
            'GW-FA6341C4'
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const pageErrors=[];
            const pageConsoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')pageConsoleErrors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelectorAll('#categoryGrid .catWrap:not(.findPartCategoryTile)').length>=1,{timeout:60000});
            await page.waitForFunction(()=>Array.isArray(window.gwProducts)&&window.gwProducts.length>0,{timeout:60000});
            const audit=await page.evaluate(skus=>{
              const rows=window.gwProducts||[];
              const asc=rows.filter(p=>skus.includes(p.public_sku));
              const visibleCheckout=[...document.querySelectorAll('a[href*="checkout"],.checkoutNow')].some(el=>getComputedStyle(el).display!=='none'&&el.getClientRects().length>0);
              return {
                products:rows.length,
                categories:document.querySelectorAll('#categoryGrid > .catWrap:not(.findPartCategoryTile)').length,
                rootLabels:[...document.querySelectorAll('#categoryGrid > .catWrap:not(.findPartCategoryTile) > .catBtn > .catContent > b')].map(el=>el.textContent.trim()),
                rootIds:[...document.querySelectorAll('#categoryGrid > .catWrap:not(.findPartCategoryTile)')].map(el=>el.dataset.filter),
                ascMatched:asc.length,
                ascPositiveStock:asc.filter(p=>Number(p.stock_quantity||0)>0).length,
                ascZeroStock:asc.filter(p=>Number(p.stock_quantity||0)===0).length,
                previewNotice:document.getElementById('gwPreviewNotice')?.innerText||'',
                visibleCheckout
              };
            },ASC_PUBLIC_SKUS);
            const EXPECTED_ROOTS=['Auto Electrical Spares','Vehicle Security','Car Audio & Entertainment','Automotive Accessories','Marine Spares & Accessories','Tools, Hardware & Consumables','Camping, Leisure & Outdoors','Trailer & Canopy'];
            if(audit.categories!==8||JSON.stringify(audit.rootLabels)!==JSON.stringify(EXPECTED_ROOTS)||audit.rootIds.length!==8||audit.rootIds.some(id=>!id))throw new Error('Approved eight-category root hierarchy mismatch: '+JSON.stringify({count:audit.categories,labels:audit.rootLabels,ids:audit.rootIds}));
            const camping=page.locator('#categoryGrid > .catWrap').filter({hasText:'Camping, Leisure & Outdoors'});
            if(await camping.locator('.children .catWrap').filter({hasText:/4X4 Outdoor/i}).count()!==1)throw new Error('4X4 Outdoor must be nested under Camping, Leisure & Outdoors');
            if(audit.products<1)throw new Error('No live product records loaded into preview');
            const imageAudit=await page.evaluate(async()=>{
              const samples=['GW-EBA53965','GW-F323915E','GW-DCDD840E','GW-B4F502E6','GW-5107B32F'];
              const results=[];
              for(const sku of samples){const img=new Image();img.src='assets/products_webp/'+encodeURIComponent(sku)+'.webp';try{await img.decode();results.push({sku,width:img.naturalWidth,height:img.naturalHeight})}catch{results.push({sku,width:0,height:0})}}
              return results;
            });
            if(imageAudit.some(x=>x.width<1||x.height<1))throw new Error('Local product WebP images failed to load: '+JSON.stringify(imageAudit));
            console.log('PRODUCT_WEBP_IMAGE_LOAD_PASS '+JSON.stringify(imageAudit));
            if(audit.ascMatched!==34||audit.ascPositiveStock!==0||audit.ascZeroStock!==34)throw new Error('ASC stock exclusion mismatch (34 active products must be zero; 2 inactive ASC products are correctly absent): '+JSON.stringify(audit));
            if(!audit.previewNotice.includes('ASC STOCK REMOVED'))throw new Error('Preview notice missing');
            if(audit.visibleCheckout)throw new Error('Checkout must remain hidden in preview');
            if(/Wattlebrook|Brookdale Crescent/i.test(await page.locator('body').innerText()))throw new Error('Private street address leaked into preview');
            const category=page.locator('#categoryGrid .catWrap:not(.findPartCategoryTile) button.catBtn').first();
            await category.click();
            await page.waitForURL(/preview-category\.html\?id=/,{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForFunction(()=>document.querySelectorAll('#grid .card').length>0,{timeout:30000});
            const categoryShell=await page.evaluate(()=>({header:getComputedStyle(document.querySelector('.gwHeader')).backgroundColor,card:getComputedStyle(document.querySelector('.card')).backgroundColor}));
            if(!categoryShell.header.includes('255')||!categoryShell.card.includes('255'))throw new Error('Dedicated category page did not inherit the bright shared shell: '+JSON.stringify(categoryShell));
            const categoryLinks=await page.locator('#grid .card').evaluateAll(cards=>cards.map(card=>card.getAttribute('href')).filter(Boolean));
            if(!categoryLinks.some(href=>href.startsWith('preview-category.html?id=')||href.startsWith('preview-products.html?category=')))throw new Error('Category landing page did not offer subcategory/product routes: '+JSON.stringify(categoryLinks));
            const firstSubcategory=categoryLinks.find(href=>href.startsWith('preview-category.html?id='));
            if(!firstSubcategory)throw new Error('Category landing page did not expose a dedicated subcategory page');
            await page.goto(new URL(firstSubcategory,'http://127.0.0.1:4173/').toString(),{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelectorAll('#grid .card').length>0,{timeout:30000});
            await page.goto('http://127.0.0.1:4173/preview-category.html?id=f7f2ea3b-f15d-46a7-920b-9d3d9a394c79',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelectorAll('#grid .card').length>0,{timeout:30000});
            await page.locator('#grid .card').filter({hasText:'Vehicle-Specific Aerials'}).click();
            await page.waitForURL(/preview-store\.html\?asc_query=/,{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForFunction(()=>document.querySelectorAll('#allProductsGrid [data-asc-preview-id]').length===4,{timeout:30000});
            // Verify all 12 ASC catalogue pilot subcategories render the exact 50 visually reviewed source-page records.
            const ascPilotPage=await browser.newPage({viewport:{width:390,height:844}});
            const ascPilotErrors=[];
            ascPilotPage.on('pageerror',e=>ascPilotErrors.push(e.message));
            await ascPilotPage.goto('http://127.0.0.1:4173/preview-store.html',{waitUntil:'domcontentloaded'});
            await ascPilotPage.waitForFunction(()=>Array.isArray(window.gwProducts)&&window.gwProducts.length>0,{timeout:60000});
            const pilotChecks=[
              ['vehicle-specific aerial|vehicle aerial','Vehicle-Specific Aerials',4],
              ['crankshaft sensor|camshaft sensor','Crankshaft & Camshaft Position Sensors',5],
              ['ignition switch|barrel set','Ignition Switches & Barrel Sets',8],
              ['halogen globe|headlight globe','Headlight Globes — Halogen',4],
              ['carpet mat+toyota','Carpet Mat Sets — Toyota',4],
              ['electric fuel pump+bmw|fuel pump+bmw','Electric Fuel Pumps — BMW',4],
              ['universal aerial|roof aerial|pillar aerial','Universal, Roof & Pillar Mount Aerials',4],
              ['air flow sensor|air mass sensor','Air Flow & Air Mass Sensors',4],
              ['hid globe|hid kit|ballast','HID Globes, Kits & Ballasts',4],
              ['carpet mat+vw|carpet mat+audi','Carpet Mat Sets — VW & Audi',1],
              ['carpet mat+bmw','Carpet Mat Sets — BMW',3],
              ['electric fuel pump+ford|fuel pump+ford|fuel pump+mazda','Electric Fuel Pumps — Ford & Mazda',5]
            ];
            const pilotAudit=[];
            for(const [query,label,expected] of pilotChecks){
              const result=await ascPilotPage.evaluate(async ({query,label})=>{
                await window.openAscCatalogueCategory(query,label);
                const cards=[...document.querySelectorAll('#allProductsGrid [data-asc-preview-id]')];
                const pilotText=cards.map(c=>c.innerText).join('\n');
                const imagesLoaded=await Promise.all(cards.map(async c=>{const img=c.querySelector('img.ascPilotSourceImage');if(!img)return false;try{await img.decode();return img.naturalWidth>0;}catch{return false;}}));
                return {label,count:cards.length,codes:cards.map(c=>c.querySelector('.sku')?.innerText||''),pilotText,imagesLoaded};
              },{query,label});
              if(result.count!==expected)throw new Error('ASC pilot subcategory count mismatch: '+JSON.stringify({label,expected,result}));
              if(!result.pilotText.includes('Price on request')||!result.pilotText.includes('Availability to confirm')||result.imagesLoaded.length!==expected||result.imagesLoaded.some(x=>!x))throw new Error('ASC pilot card release guards missing: '+label);
              if(/ADD TO CART|In stock|Only \d+ left/i.test(result.pilotText))throw new Error('ASC pilot must not imply live stock or checkout: '+label);
              pilotAudit.push({label,count:result.count});
            }
            if(ascPilotErrors.length)throw new Error('ASC pilot page errors: '+ascPilotErrors.join(' | '));
            console.log('ASC_PILOT_PREVIEW_PASS '+JSON.stringify(pilotAudit));
            await ascPilotPage.close();
            // Verify Part Search and the no-AI photo-request fallback in the actual preview.
            const partSearchButton=page.locator('.headerPartSearch').first();
            await partSearchButton.waitFor({state:'visible',timeout:10000});
            await partSearchButton.click();
            await page.locator('#partSearchDialog.open').waitFor({state:'visible',timeout:10000});
            const partSearchCopy=await page.locator('#partSearchDialog').innerText();
            if(!partSearchCopy.includes('NO AI CREDITS NEEDED'))throw new Error('No-AI photo-request fallback is missing');
            await page.waitForFunction(()=>Array.isArray(window.gwPlanetworldSearchRows)&&window.gwPlanetworldSearchRows.length===3385,{timeout:30000});
            await page.locator('#partSearchQuery').fill('HCE-C2100RD');
            await page.waitForFunction(()=>document.querySelectorAll('#partSearchResults [data-quote-pw]').length>0,{timeout:15000});
            const planetworldSearchText=await page.locator('#partSearchResults').innerText();
            if(!planetworldSearchText.includes('Model / code: HCE-C2100RD')||!planetworldSearchText.includes('VIEW MANUFACTURER PAGE')||!planetworldSearchText.includes('REQUEST QUOTE'))throw new Error('Verified Planetworld model Part Search integration failed: '+planetworldSearchText);
            console.log('PLANETWORLD_VERIFIED_MODEL_SEARCH_PASS '+planetworldSearchText.slice(0,500));

            await page.locator('#partSearchDialog button.pictureSearchBtn').first().click();
            await page.locator('#sourcePart').waitFor({state:'visible',timeout:10000});
            const photoInput=page.locator('#sourcePhotos');
            const photoRules=await photoInput.evaluate(el=>({multiple:el.multiple,accept:el.accept}));
            if(!photoRules.multiple||!photoRules.accept.includes('image/jpeg')||!photoRules.accept.includes('image/png'))throw new Error('Photo request upload rules are incomplete: '+JSON.stringify(photoRules));
            const previewSource=await require('fs').promises.readFile('preview-store.html','utf8');
            if(/generativelanguage|api\.openai\.com|gemini\/|openai\/images/i.test(previewSource))throw new Error('Paid AI image-search endpoint remains in preview source');
            if(!previewSource.includes('files.length>5'))throw new Error('Five-photo maximum is not enforced in the request handler');
            await page.evaluate(()=>window.closePartRequest());
            await page.locator('#sourcePart').waitFor({state:'hidden',timeout:10000});
            const mobileWidth=await page.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(mobileWidth.scrollWidth>mobileWidth.innerWidth+1)throw new Error('Mobile horizontal overflow: '+JSON.stringify(mobileWidth));
            await page.setViewportSize({width:360,height:800});
            const narrowMobileWidth=await page.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(narrowMobileWidth.scrollWidth>narrowMobileWidth.innerWidth+1)throw new Error('360px phone horizontal overflow: '+JSON.stringify(narrowMobileWidth));
            await page.setViewportSize({width:390,height:844});
            await page.setViewportSize({width:1280,height:900});
            const desktopWidth=await page.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(desktopWidth.scrollWidth>desktopWidth.innerWidth+1)throw new Error('Desktop horizontal overflow: '+JSON.stringify(desktopWidth));
            // Verify the provisional Planetworld snapshot without touching Supabase or exposing dealer cost.
            const planetworld=await browser.newPage({viewport:{width:390,height:844}});
            await planetworld.goto('http://127.0.0.1:4173/preview-planetworld.html',{waitUntil:'domcontentloaded'});
            await planetworld.waitForFunction(()=>document.querySelectorAll('#grid .card').length===68,{timeout:15000});
            const pwAudit=await planetworld.evaluate(()=>{const rows=window.gwPlanetworldPreview||[];return {rows:rows.length,positiveStock:rows.filter(p=>p.total>0).length,zeroStock:rows.filter(p=>p.total===0).length,costFloorPass:rows.filter(p=>p.costFloor==='PASS_REVIEW_ONLY').length,snapshotDates:[...new Set(rows.map(p=>p.snapshot))],imageSources:rows.filter(p=>p.imageUrl).length,imageModels:rows.filter(p=>p.imageUrl).map(p=>p.modelNumber).sort(),officialImageSources:rows.filter(p=>p.imageUrl).every(p=>['https://static.audison.com/media/','https://www.kicker.com/','https://finland.alpine-europe.com/fileadmin/','https://dam.focal-naim.com/'].some(prefix=>String(p.imageUrl).startsWith(prefix))),hasManufacturerLinks:rows.every(p=>String(p.manufacturerPage).startsWith('https://')),dealerCostExposed:/Dealer Price|estimated_cost_incl_vat|cost_numeric/i.test(document.body.innerText)}});
            if(pwAudit.rows!==68||pwAudit.positiveStock!==44||pwAudit.zeroStock!==24||pwAudit.costFloorPass!==68||pwAudit.imageSources!==9||JSON.stringify(pwAudit.imageModels)!==JSON.stringify(['43C104','46CXA3604','46CXA4001','46CXA6605','69070060','HILO V3','R2-A60F.','R2-W10D2','S2-S40C'].sort())||!pwAudit.officialImageSources||!pwAudit.hasManufacturerLinks||pwAudit.dealerCostExposed)throw new Error('Planetworld provisional preview audit failed: '+JSON.stringify(pwAudit));
            await planetworld.waitForFunction(()=>{const imgs=[...document.querySelectorAll('#grid .card img')];return imgs.length===9&&imgs.every(img=>img.complete);},{timeout:15000});
            const imageLoadAudit=await planetworld.locator('#grid .card img').evaluateAll(imgs=>imgs.map(img=>({src:img.src,loaded:img.naturalWidth>0})));
            if(imageLoadAudit.some(img=>!img.loaded))throw new Error('An official manufacturer product image did not load: '+JSON.stringify(imageLoadAudit));
            const pwWidth=await planetworld.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(pwWidth.scrollWidth>pwWidth.innerWidth+1)throw new Error('Planetworld mobile overflow: '+JSON.stringify(pwWidth));
            await planetworld.setViewportSize({width:360,height:800});
            const pwNarrowWidth=await planetworld.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(pwNarrowWidth.scrollWidth>pwNarrowWidth.innerWidth+1)throw new Error('Planetworld 360px phone overflow: '+JSON.stringify(pwNarrowWidth));
            await planetworld.locator('#q').fill('Alpine');
            await planetworld.waitForFunction(()=>document.querySelectorAll('#grid .card').length>0&&document.querySelectorAll('#grid .card').length<68,{timeout:10000});
            console.log('PLANETWORLD_PROVISIONAL_PREVIEW_PASS '+JSON.stringify({...pwAudit,mobileWidth:pwWidth,searchFilter:true}));
            await planetworld.setViewportSize({width:1280,height:900});
            const pwDesktop=await planetworld.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(pwDesktop.scrollWidth>pwDesktop.innerWidth+1)throw new Error('Planetworld desktop overflow: '+JSON.stringify(pwDesktop));
            await planetworld.close();
            // Exercise the dedicated audio-area navigation from the real category page.
            const audioResponse=await page.goto('http://127.0.0.1:4173/preview-category.html?id=5ab55c53-eee3-41ce-ad48-04ad6df85181',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(3000);
            const audioDebug=await page.evaluate(()=>({url:location.href,title:document.title,gridError:document.getElementById('grid')?.dataset.error||'',gridDebug:document.getElementById('grid')?.dataset.debug||'',gridText:document.getElementById('grid')?.innerText||''}));
            console.log('AUDIO_HTTP_STATUS '+audioResponse?.status());
            console.log('AUDIO_PAGE_ERRORS '+JSON.stringify({pageErrors,pageConsoleErrors})); 
            console.log('AUDIO_CATEGORY_DEBUG '+JSON.stringify(audioDebug));
            if(await page.locator('#grid .card').count()<3)throw new Error('Audio category page did not render three area cards: '+JSON.stringify(audioDebug));
            const audioAreas=await page.locator('#grid').innerText();
            for(const label of ['Car Audio & Video','Home Entertainment','Studio Equipment'])if(!audioAreas.includes(label))throw new Error('Audio area navigation missing '+label);
            await page.locator('#grid .card').filter({hasText:'Car Audio & Video'}).click();
            await page.waitForURL(/audio_area=car/,{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForFunction(()=>document.getElementById('heading')?.innerText.includes('Car Audio & Video'),{timeout:15000});
            // Verify the required main-store Audio → departments → brand → component journey.
            const audioShop=await browser.newPage({viewport:{width:390,height:844}});
            const audioShopErrors=[],audioShopConsoleErrors=[];
            audioShop.on('pageerror',e=>audioShopErrors.push(e.message));
            audioShop.on('console',m=>{if(m.type()==='error')audioShopConsoleErrors.push(m.text())});
            await audioShop.route('**/assets/planetworld-catalogue-preview.json',async route=>{await new Promise(resolve=>setTimeout(resolve,1500));await route.continue();});
            await audioShop.goto('http://127.0.0.1:4173/preview-store.html',{waitUntil:'domcontentloaded'});
            await audioShop.waitForFunction(()=>document.querySelectorAll('#categoryGrid .catWrap').length>=8,{timeout:60000});
            await audioShop.locator('#categoryGrid > .catWrap[data-filter="5ab55c53-eee3-41ce-ad48-04ad6df85181"] > .catBtn').click();
            await audioShop.waitForURL(/preview-audio\.html/,{waitUntil:'domcontentloaded',timeout:15000});
            audioShop.on('pageerror',e=>console.log('AUDIO_SHOP_PAGE_ERROR '+e.message));
            console.log('AUDIO_SHOP_PAGE_DEBUG '+JSON.stringify(await audioShop.evaluate(()=>({url:location.href,title:document.title,readyState:document.readyState,tileCount:document.querySelectorAll('#departments .audioTile').length,departmentHtml:document.getElementById('departments')?.innerHTML||'',scripts:[...document.scripts].map(x=>({src:x.src,inlineLength:x.textContent.length}))})))+' pageErrors='+JSON.stringify(audioShopErrors)+' consoleErrors='+JSON.stringify(audioShopConsoleErrors));
            await audioShop.waitForFunction(()=>document.querySelectorAll('#departments .audioTile').length===9,{timeout:30000}).catch(()=>{throw new Error('Audio department tiles did not render; pageErrors='+JSON.stringify(audioShopErrors)+' consoleErrors='+JSON.stringify(audioShopConsoleErrors))});
            if(audioShopErrors.length)throw new Error('Audio page runtime errors: '+audioShopErrors.join(' | '));
            await audioShop.locator('#departments button').filter({hasText:'Car Audio & Video'}).click();
            // Select the department before the delayed catalogue response completes; it must redraw after load.
            await audioShop.waitForFunction(()=>document.querySelectorAll('#products .audioProduct').length>0,{timeout:30000});
            await audioShop.locator('#brands button').first().waitFor({state:'visible',timeout:15000});
            const brandCount=await audioShop.locator('#brands button').count();
            if(brandCount<2)throw new Error('Car Audio department has no selectable brand list');
            await audioShop.locator('#brands button').nth(1).click();
            const componentCount=await audioShop.locator('#components button').count();
            if(componentCount<2)throw new Error('Selected audio brand has no component/product-type grouping');
            await audioShop.locator('#components button').first().click();
            await audioShop.locator('#products .quoteLink').first().waitFor({state:'visible',timeout:15000});
            const quoteHref=await audioShop.locator('#products .quoteLink').first().getAttribute('href');
            const quoteText=new URL(quoteHref).searchParams.get('text')||'';
            if(!quoteHref.startsWith('https://wa.me/27744884234?text=')||!quoteText.includes('Department: Car Audio & Video')||!quoteText.includes('Product:')||!quoteText.includes('25-Oct-2026')||!quoteText.includes('\n'))throw new Error('Audio product WhatsApp quote draft is incomplete: '+quoteText);
            const audioOverflow=await audioShop.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(audioOverflow.scrollWidth>audioOverflow.innerWidth+1)throw new Error('Audio navigation mobile overflow: '+JSON.stringify(audioOverflow));
            await audioShop.setViewportSize({width:360,height:800});
            const audioNarrowOverflow=await audioShop.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(audioNarrowOverflow.scrollWidth>audioNarrowOverflow.innerWidth+1)throw new Error('Audio navigation 360px phone overflow: '+JSON.stringify(audioNarrowOverflow));
            await audioShop.setViewportSize({width:1366,height:900});
            const audioDesktopOverflow=await audioShop.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(audioDesktopOverflow.scrollWidth>audioDesktopOverflow.innerWidth+1)throw new Error('Audio navigation desktop overflow: '+JSON.stringify(audioDesktopOverflow));
            console.log('AUDIO_HIERARCHY_PASS '+JSON.stringify({departments:9,brands:brandCount,components:componentCount,mobile:audioOverflow,desktop:audioDesktopOverflow}));
            await audioShop.close();
            if(pageErrors.length)throw new Error('Browser page errors: '+pageErrors.join(' | '));
            console.log('POPULATED_PREVIEW_PASS '+JSON.stringify({...audit,mobileWidth,desktopWidth,productModal:true,pageErrors}));
            const hosted=await browser.newPage({viewport:{width:390,height:844}});
            const hostedErrors=[],hostedConsoleErrors=[];
            hosted.on('pageerror',e=>hostedErrors.push(e.message));
            hosted.on('console',m=>{if(m.type()==='error')hostedConsoleErrors.push(m.text())});
            await hosted.setExtraHTTPHeaders({'Cache-Control':'no-cache'});
            await hosted.goto('https://planetworld-audio-preview.get-wired-autoworx-store.pages.dev/preview-store.html?gw_preview_qa=hosted-home-20261101',{waitUntil:'domcontentloaded',timeout:60000});
            try {
              await hosted.waitForFunction(()=>document.querySelectorAll('#categoryGrid .catWrap:not(.findPartCategoryTile)').length>=1,{timeout:45000});
