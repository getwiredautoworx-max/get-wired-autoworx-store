            const hostedPlanet=await hosted.evaluate(()=>{const rows=window.gwPlanetworldPreview||[],images=rows.filter(p=>p.imageUrl),text=document.body.innerText;return {rows:rows.length,imageSources:images.length,officialImageSources:images.every(p=>['https://static.audison.com/media/','https://audison.com/wp-content/','https://www.kicker.com/','https://finland.alpine-europe.com/fileadmin/','https://dam.focal-naim.com/'].some(prefix=>String(p.imageUrl).startsWith(prefix))),hasManufacturerLinks:rows.every(p=>String(p.manufacturerPage).startsWith('https://')),datedDisclosure:/dated 25 October 2026 supplier workbook snapshot/i.test(text),priceOnRequest:/Price on request — current supplier confirmation required/i.test(text),availabilityUnconfirmed:/Not currently confirmed/i.test(text),dealerCostExposed:/Dealer Price|estimated_cost_incl_vat|cost_numeric/i.test(text),customerPriceExposed:/\bR\s?\d{1,3}(?:,\d{3})*(?:\.\d{2})\b/.test(text)}});
            if(hostedPlanet.rows!==68||hostedPlanet.imageSources!==9||!hostedPlanet.officialImageSources||!hostedPlanet.hasManufacturerLinks||!hostedPlanet.datedDisclosure||!hostedPlanet.priceOnRequest||!hostedPlanet.availabilityUnconfirmed||hostedPlanet.dealerCostExposed||hostedPlanet.customerPriceExposed)throw new Error('Hosted Planetworld manufacturer-reference audit failed: '+JSON.stringify(hostedPlanet));
            await hosted.waitForFunction(()=>{const imgs=[...document.querySelectorAll('#grid .card img')];return imgs.length===9&&imgs.every(img=>img.complete&&img.naturalWidth>0);},{timeout:30000});
            const hostedPlanetWidth=await hosted.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(hostedPlanetWidth.scrollWidth>hostedPlanetWidth.innerWidth+1)throw new Error('Hosted Planetworld mobile overflow: '+JSON.stringify(hostedPlanetWidth));
            await hosted.setViewportSize({width:1280,height:900});
            const hostedPlanetDesktop=await hosted.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(hostedPlanetDesktop.scrollWidth>hostedPlanetDesktop.innerWidth+1)throw new Error('Hosted Planetworld desktop overflow: '+JSON.stringify(hostedPlanetDesktop));
            console.log('HOSTED_PLANETWORLD_PREVIEW_PASS '+JSON.stringify({...hostedPlanet,mobileWidth:hostedPlanetWidth,desktopWidth:hostedPlanetDesktop}));
            await hosted.close();
            } else {
              console.log('HOSTED_QA_SKIPPED_ON_PULL_REQUEST: hosted checks run only after exact-SHA preview deployment');
            }
            const checkoutPreview=await browser.newPage({viewport:{width:390,height:844}});
            await checkoutPreview.goto('http://127.0.0.1:4173/preview-checkout.html',{waitUntil:'domcontentloaded'});
            await checkoutPreview.locator('#paymentMethod').selectOption({label:'Instant EFT (manual — details confirmed after quote)'});
            await checkoutPreview.locator('#customerName').fill('Preview Tester');
            await checkoutPreview.locator('#simulate').click();
            const checkoutHref=await checkoutPreview.locator('#whatsapp').getAttribute('href');
            const checkoutText=new URL(checkoutHref).searchParams.get('text')||'';
            if(!checkoutText.includes('Payment preference: Instant EFT (manual; instructions supplied after confirmation)'))throw new Error('Instant EFT preview preference was not included in the WhatsApp draft: '+checkoutText);
            if(!await checkoutPreview.locator('#status').innerText().then(t=>t.includes('No order was placed and no payment was taken.')))throw new Error('Preview checkout did not clearly confirm that no payment was taken');
            if(!checkoutHref.startsWith('https://wa.me/27744884234?text=')||await checkoutPreview.locator('input#accountNumber,input[name="accountNumber"]').count())throw new Error('Preview checkout exposed a live payment route or bank-account input');
            console.log('INSTANT_EFT_PREVIEW_ONLY_PASS: manual preference is carried into WhatsApp; no order/payment is submitted');
            await checkoutPreview.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Publish exact-head populated browser QA status
        if: ${{ always() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GW_JOB_STATUS: ${{ job.status }}
          GW_EXPECTED_PREVIEW_SHA: ${{ github.sha }}
        run: |
          if [[ "$GW_JOB_STATUS" == "success" ]]; then
            state=success
            description="Exact-head populated browser QA passed"
          else
            state=failure
            description="Exact-head populated browser QA failed; inspect run"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GW_EXPECTED_PREVIEW_SHA" \
            -f state="$state" \
            -f context="gw-populated-browser-qa" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
