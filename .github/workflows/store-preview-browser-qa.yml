name: Populated Store Preview Browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'preview-store.html'
      - 'preview-category.html'
      - 'preview-products.html'
      - 'preview-product.html'
      - 'assets/**'
      - '.github/workflows/store-preview-browser-qa.yml'

permissions:
  contents: read

jobs:
  populated-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run read-only populated preview browser checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/gw-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          for (const route of ['preview-store.html','preview-category.html','preview-products.html','preview-product.html']) {
            const source = fs.readFileSync(route, 'utf8');
            const directives = [...source.matchAll(/<meta\s+name=[\"']robots[\"']\s+content=[\"']([^\"']+)[\"']/gi)].map(m => m[1].trim().toLowerCase());
            if (directives.length !== 1 || directives[0] !== 'noindex,nofollow') throw new Error('Preview route robots policy mismatch for '+route+': '+JSON.stringify(directives));
          }
          const ASC_PUBLIC_SKUS = [
            'GW-09D1B7AD','GW-1C87D5E5','GW-1CE86A57','GW-1ED91C25','GW-269894FE',
            'GW-2A7A9F1E','GW-2AE829B0','GW-2C508DE3','GW-2C792975','GW-31FC9859',
            'GW-334E3E01','GW-39D7BE90','GW-3EEEC849','GW-43EDB928','GW-4B57D263',
            'GW-4EE1C0D7','GW-4FE9F254','GW-55138BB7','GW-558D6CCF','GW-5EEF5729',
            'GW-63A2C0A3','GW-8923C055','GW-8B85BE3E','GW-94FB6A20','GW-957F1BB1',
            'GW-A792D62B','GW-ACBAADC3','GW-B068547C','GW-B1E343ED','GW-D1CCE3E1',
            'GW-D8CB9050','GW-DA4281C8','GW-EC20B1E8','GW-F5FAD5A5','GW-F856C85B',
            'GW-FA6341C4'
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const pageErrors=[];
            const pageConsoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')pageConsoleErrors.push(m.text())});
            // Use the actual hosted branch preview for all populated-data assertions.
          const hosted=await browser.newPage({viewport:{width:390,height:844}});
            const hostedErrors=[];
            hosted.on('pageerror',e=>hostedErrors.push(e.message));
            await hosted.goto('https://gw-store-preview-1030.get-wired-autoworx-store.pages.dev/preview-store.html',{waitUntil:'domcontentloaded',timeout:60000});
            const robots=await hosted.locator('head meta[name="robots"]').evaluateAll(nodes=>nodes.map(n=>(n.content||'').trim().toLowerCase()));
            if(robots.length!==1||robots[0]!=='noindex,nofollow')throw new Error('Preview robots policy must contain exactly one noindex,nofollow directive: '+JSON.stringify(robots));
            await hosted.waitForFunction(()=>document.querySelectorAll('#categoryGrid .catWrap:not(.findPartCategoryTile)').length>=1,{timeout:60000});
            await hosted.waitForFunction(()=>Array.isArray(window.gwProducts)&&window.gwProducts.length>0,{timeout:60000});
          const initialHtml=await hosted.content();
          if(!/PLANETWORLD — AUDIO & ENTERTAINMENT CATALOGUE/i.test(initialHtml))throw new Error('Planetworld category navigation branding is missing from the hosted store');
          if(/Dealer Price|Dealer Cost|accessoriesspares\.co\.za/i.test(initialHtml))throw new Error('Dealer pricing or private supplier source reference exposed in hosted storefront HTML');
          await hosted.waitForFunction(()=>document.querySelectorAll('#planetworldCategoryNav [data-pw-collection]').length===8&&document.getElementById('pwCount')?.innerText.startsWith('674 catalogue items'),{timeout:60000});
          const pwTargets=[['Car Audio & Video',674],['Home Entertainment',461],['Band & Live Sound',792],['DJ',15],['Studio Equipment',62],['Marine Audio',28],['Installed AV',435],['Musical Instruments',850]];
          for(const [collection,expected] of pwTargets){
            await hosted.locator('#planetworldCategoryNav [data-pw-collection="'+collection+'"]').click();
            await hosted.waitForFunction(expectedCount=>document.getElementById('pwCount')?.innerText.startsWith(expectedCount+' catalogue items'),expected,{timeout:15000});
          }
          await hosted.locator('#planetworldCategoryNav [data-pw-collection="Car Audio & Video"]').click();
          await hosted.waitForFunction(()=>[...document.querySelectorAll('#gwVerifiedGrid .gwVerifiedMedia img')].every(img=>img.complete),{timeout:30000});
            const verifiedCatalogue=await hosted.evaluate(()=>({count:document.querySelectorAll('#gwVerifiedGrid .gwVerifiedCard').length,withImagePlaceholder:document.querySelectorAll('#gwVerifiedGrid .gwVerifiedMedia[role="img"]').length,withImage:document.querySelectorAll('#gwVerifiedGrid .gwVerifiedMedia img').length,loadedImages:[...document.querySelectorAll('#gwVerifiedGrid .gwVerifiedMedia img')].filter(img=>img.complete&&img.naturalWidth>0).length,quoteOnly:[...document.querySelectorAll('#gwVerifiedGrid .gwVerifiedStatus')].every(el=>/Price & availability on request/i.test(el.innerText)),whatsapp:[...document.querySelectorAll('#gwVerifiedGrid a[href*="wa.me"]')].length,supplierLeak:/Planetworld|Dealer Price|supplier catalogue|accessoriesspares\.co\.za/i.test(document.getElementById('gwVerifiedCatalogue')?.innerText||'')}));
            if(verifiedCatalogue.count!==68||verifiedCatalogue.withImage!==11||verifiedCatalogue.loadedImages!==11||verifiedCatalogue.withImagePlaceholder!==57||!verifiedCatalogue.quoteOnly||verifiedCatalogue.whatsapp!==68||verifiedCatalogue.supplierLeak)throw new Error('GW catalogue integration audit failed: '+JSON.stringify(verifiedCatalogue));
            await hosted.locator('#gwVerifiedSearch').fill('Alpine');
            const alpineCount=await hosted.locator('#gwVerifiedGrid .gwVerifiedCard').count();
            if(alpineCount<1||alpineCount>=68)throw new Error('GW catalogue search filter failed: '+alpineCount);
            await hosted.locator('#gwVerifiedSearch').fill('');
            const hostedAudit=await hosted.evaluate(skus=>{
              const rows=window.gwProducts||[],asc=rows.filter(p=>skus.includes(p.public_sku));
              return {
                products:rows.length,
                categories:document.querySelectorAll('#categoryGrid .catWrap:not(.findPartCategoryTile)').length,
                ascMatched:asc.length,
                ascPositiveStock:asc.filter(p=>Number(p.stock_quantity||0)>0).length,
                ascZeroStock:asc.filter(p=>Number(p.stock_quantity||0)===0).length,
                previewNotice:document.getElementById('gwPreviewNotice')?.innerText||'',
                visibleCheckout:[...document.querySelectorAll('a[href*="checkout"],.checkoutNow')].some(el=>getComputedStyle(el).display!=='none'&&el.getClientRects().length>0)
              };
            },ASC_PUBLIC_SKUS);
            if(hostedAudit.products<1||hostedAudit.ascMatched!==34||hostedAudit.ascPositiveStock!==0||hostedAudit.ascZeroStock!==34)throw new Error('Hosted ASC stock check failed: '+JSON.stringify(hostedAudit));
            if(!hostedAudit.previewNotice.includes('ASC STOCK REMOVED')||hostedAudit.visibleCheckout)throw new Error('Hosted preview safety check failed: '+JSON.stringify(hostedAudit));
            if(/Wattlebrook|Brookdale Crescent/i.test(await hosted.locator('body').innerText()))throw new Error('Hosted preview exposed private street address');
            const hostedCategory=hosted.locator('#categoryGrid .catWrap:not(.findPartCategoryTile) button.catBtn').first();
            await hostedCategory.click();
            await hosted.locator('#shop').waitFor({state:'visible',timeout:20000});
            await hosted.waitForFunction(()=>document.querySelectorAll('#allProductsGrid .product').length>0,{timeout:30000});
          const firstCard=hosted.locator('#allProductsGrid .product').first();
          const cardGeometry=await firstCard.evaluate(el=>{const img=el.querySelector('.prodImg,.productImage,.productImagePlaceholder');const card=el.getBoundingClientRect();const media=img?.getBoundingClientRect();return {cardHeight:card.height,mediaHeight:media?.height||0,mediaBottom:media?.bottom||0,cardBottom:card.bottom,overlap:!!media&&media.bottom>card.bottom-1,descriptionPosition:el.querySelector('h3')?.getBoundingClientRect().top||0};});
          if(!cardGeometry.mediaHeight||cardGeometry.overlap||cardGeometry.descriptionPosition<cardGeometry.mediaBottom-1)throw new Error('Product image/description layout overlaps: '+JSON.stringify(cardGeometry));
            await hosted.locator('#allProductsGrid .product').first().click();
            await hosted.locator('#productModal.open').waitFor({state:'visible',timeout:15000});
            await hosted.locator('#modalClose').click();
            await hosted.locator('#productModal').waitFor({state:'hidden',timeout:10000});
            await hosted.locator('.headerPartSearch').click();
            await hosted.locator('#partSearchDialog.open').waitFor({state:'visible',timeout:10000});
            const hostedSearchCopy=await hosted.locator('#partSearchDialog').innerText();
            if(!hostedSearchCopy.includes('NO AI CREDITS NEEDED'))throw new Error('Hosted no-AI photo-request fallback is missing');
            await hosted.locator('#partSearchDialog button.pictureSearchBtn').first().click();
            await hosted.locator('#sourcePart').waitFor({state:'visible',timeout:10000});
            await hosted.evaluate(()=>window.closePartRequest());
            await hosted.locator('#sourcePart').waitFor({state:'hidden',timeout:10000});
            await hosted.goto('https://gw-store-preview-1030.get-wired-autoworx-store.pages.dev/preview-category.html?id=5ab55c53-eee3-41ce-ad48-04ad6df85181',{waitUntil:'domcontentloaded',timeout:60000});
            const categoryRobots=await hosted.locator('head meta[name="robots"]').evaluateAll(nodes=>nodes.map(n=>(n.content||'').trim().toLowerCase()));
            if(categoryRobots.length!==1||categoryRobots[0]!=='noindex,nofollow')throw new Error('Hosted category preview robots policy mismatch: '+JSON.stringify(categoryRobots));
            await hosted.waitForFunction(()=>document.querySelectorAll('#grid .card').length>=3,{timeout:30000});
            const hostedAudioAreas=await hosted.locator('#grid').innerText();
            for(const label of ['Car Audio & Video','Home Entertainment','Studio Equipment'])if(!hostedAudioAreas.includes(label))throw new Error('Hosted audio area navigation missing '+label);
            await hosted.locator('#grid .card').filter({hasText:'Car Audio & Video'}).click();
            await hosted.waitForURL(/audio_area=car/,{timeout:15000});
            await hosted.waitForFunction(()=>document.getElementById('heading')?.innerText.includes('Car Audio & Video'),{timeout:15000});
            const hostedWidth=await hosted.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(hostedWidth.scrollWidth>hostedWidth.innerWidth+1)throw new Error('Hosted mobile horizontal overflow: '+JSON.stringify(hostedWidth));
            if(hostedErrors.length)throw new Error('Hosted browser page errors: '+hostedErrors.join(' | '));
            console.log('HOSTED_PREVIEW_PASS '+JSON.stringify({...hostedAudit,mobileWidth:hostedWidth,productModal:true,pageErrors:hostedErrors}));
            const hostedBody=await hosted.locator('body').innerText();
            if(/Dealer Price|Dealer Cost|accessoriesspares\.co\.za/i.test(hostedBody))throw new Error('Dealer pricing or private supplier source reference exposed in hosted storefront');
            await hosted.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
