name: Owner Preview Mobile and Desktop Browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'index-new.html'
      - 'owner-preview.html'
      - 'trailer-towing.html'
      - 'assets/trailer-towing-catalogue.json'
      - 'preview-audio*.html'
      - 'assets/category-tree.json'
      - 'assets/*catalogue-preview.json'
      - 'assets/auto-electrical-owner-preview.json'
      - 'tests/owner-preview-browser-qa.cjs'
      - 'scripts/build-cloudflare-pages-public.py'
      - 'HANDOVER_CURRENT.md'
      - '.github/workflows/store-preview-browser-qa.yml'
      - '.github/workflows/cloudflare-public-pages-build-qa.yml'
  push:
    branches: [main]
    paths:
      - 'index-new.html'
      - 'owner-preview.html'
      - 'trailer-towing.html'
      - 'assets/trailer-towing-catalogue.json'
      - 'preview-audio*.html'
      - 'assets/category-tree.json'
      - 'assets/*catalogue-preview.json'
      - 'assets/auto-electrical-owner-preview.json'
      - 'tests/owner-preview-browser-qa.cjs'
      - 'scripts/build-cloudflare-pages-public.py'
      - 'HANDOVER_CURRENT.md'
      - '.github/workflows/store-preview-browser-qa.yml'
permissions:
  contents: read
  issues: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static preview server
        run: |
          python3 -m http.server 4173 >/tmp/gw-preview-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/owner-preview.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/gw-preview-server.log
          exit 1
      - name: Verify mobile and desktop owner preview and audio product route
        run: node tests/owner-preview-browser-qa.cjs
      - name: Wait for Cloudflare Pages preview of exact PR head
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const expectedSha = context.payload.pull_request.head.sha;
            const expectedShort = expectedSha.slice(0, 7);
            const expectedBranch = context.payload.pull_request.head.ref;
            const deadline = Date.now() + 180000;
            while (Date.now() < deadline) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100
              });
              const deploy = comments.find(comment => comment.body &&
                comment.body.includes('Deploying get-wired-autoworx-store with') &&
                comment.body.includes('Cloudflare Pages'));
              const body = deploy?.body || '';
              const latest = body.match(/Latest commit:[\s\S]*?<code>([0-9a-f]{7,40})<\/code>/i);
              const branchUrl = body.match(/Branch Preview URL:[\s\S]*?href='([^']+)'/i);
              let deploymentMatches = false;
              let deploymentNote = '';
              if (latest && /Deploy successful!/i.test(body) && branchUrl) {
                if (expectedSha.startsWith(latest[1])) {
                  deploymentMatches = true;
                  deploymentNote = 'exact PR head';
                } else {
                  try {
                    const deployed = await github.rest.repos.getCommit({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: latest[1]
                    });
                    const comparison = await github.rest.repos.compareCommits({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      base: deployed.data.sha,
                      head: expectedSha
                    });
                    const laterFiles = comparison.data.files || [];
                    const qaOnly = laterFiles.length > 0 && laterFiles.every(file =>
                      /^(tests\\/|\\.github\\/workflows\\/|HANDOVER_CURRENT\\.md$)/.test(file.filename)
                    );
                    if (comparison.data.status === 'ahead' && qaOnly) {
                      deploymentMatches = true;
                      deploymentNote = 'same customer content; later commits change QA/workflow/handover files only';
                    }
                  } catch (error) {
                    core.info('Waiting for exact Pages deployment metadata: ' + error.message);
                  }
                }
              }
              if (deploymentMatches) {
                core.exportVariable('GW_PREVIEW_BASE_URL', branchUrl[1]);
                core.exportVariable('GW_EXPECTED_PREVIEW_SHA', expectedSha);
                core.exportVariable('GW_EXPECTED_PREVIEW_BRANCH', expectedBranch);
                core.info('Cloudflare Pages deployment matches ' + deploymentNote + ' for PR head ' + expectedShort + ': ' + branchUrl[1]);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Cloudflare Pages did not report a successful deployment for exact PR head ' + expectedShort);
      - name: Verify hosted Cloudflare Pages preview for exact PR head
        if: github.event_name == 'pull_request'
        run: node tests/owner-preview-browser-qa.cjs
