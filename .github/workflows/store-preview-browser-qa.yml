name: Owner Store Preview Browser QA

on:
  workflow_dispatch:
  push:
    branches:
      - integration/three-category-catalogue-preview-final-2026-11-03
      - repair/pr-168-storefront-category-audio-2026-11-04
      - fix/mobile-audio-subcategory-grid-2026-11-04

permissions:
  contents: read
  checks: read

jobs:
  owner-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run read-only owner preview checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/gw-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/owner-preview.html',{waitUntil:'domcontentloaded'});
            if(!(await page.locator('.preview-banner').innerText()).includes('NON-PRODUCTION'))throw new Error('Owner preview warning banner missing');
            const frame=page.frameLocator('#store');
            await frame.locator('#categoryGrid > .catWrap:not(.findPartCategoryTile)').first().waitFor({state:'visible',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#store').contentWindow.__GW_PREVIEW_WRITE_BLOCKED===true,{timeout:15000});
            const roots=await frame.locator('#categoryGrid > .catWrap:not(.findPartCategoryTile) > .catBtn > .catContent > b').allTextContents();
            const expected=['Audio, Entertainment & Music','Auto Electrical Parts & Spares','Car Care & Accessories'];
            if(JSON.stringify(roots)!==JSON.stringify(expected))throw new Error('Three approved category roots mismatch: '+JSON.stringify(roots));
            const checkoutSafe=await frame.locator('a[href*="checkout"],.checkoutNow,#checkout').evaluateAll(els=>els.every(el=>getComputedStyle(el).display==='none'||!el.getClientRects().length));
            if(!checkoutSafe)throw new Error('Checkout control is visible in owner preview');
            const carAudioArt=frame.locator('.audioFourTile img[alt="Sony XM-5ES car audio amplifier"]');
            await carAudioArt.waitFor({state:'visible',timeout:15000});
            const carAudioArtLoaded=await carAudioArt.evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,10000)});return img.complete&&img.naturalWidth>0});
            if(!carAudioArtLoaded)throw new Error('Homepage Car Audio & Video product image did not load');
            await frame.getByRole('button',{name:/Audio, Entertainment & Music/}).click();
            const childCarAudioImage=frame.locator('.catWrap[data-filter="e3d19d20-fb46-426c-9f64-221d863add0b"] > .catBtn img.catPhoto');
            await childCarAudioImage.waitFor({state:'visible',timeout:15000});
            const childCarAudioImageLoaded=await childCarAudioImage.evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,10000)});return img.complete&&img.naturalWidth>0});
            if(!childCarAudioImageLoaded)throw new Error('Car Audio & Video child category product image did not load');
            const departmentArtChecks=[
              ['gw-audio-home','home entertainment television'],
              ['862605ef-5223-4525-aad6-ee17c2c6f9e7','band equipment'],
              ['83ea8ae6-a464-40a2-a503-272792f70be8','dj mixer'],
              ['76aee522-bf0e-4e7e-809c-e5c31afd3f6b','musical instruments']
            ];
            for(const [id,expectedAlt] of departmentArtChecks){
              const routeNeedle=id==='gw-audio-home'?'Home%20Entertainment':id==='862605ef-5223-4525-aad6-ee17c2c6f9e7'?'Band%20%26%20Live%20Sound':id==='83ea8ae6-a464-40a2-a503-272792f70be8'?'department=DJ':'Musical%20Instruments';
              const art=frame.locator('.catWrap.catalogueWrap a[href*="'+routeNeedle+'"] img.catPhoto');
              await art.waitFor({state:'visible',timeout:15000});
              await art.scrollIntoViewIfNeeded();
              const info=await art.evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,10000)});return {src:img.currentSrc||img.src,alt:img.alt,loaded:img.complete&&img.naturalWidth>0}});
              if(!info.loaded||info.src.includes('car-audio-video-category.svg')||!info.alt.toLowerCase().includes(expectedAlt))throw new Error('Wrong or unloaded audio department artwork for '+id+': '+JSON.stringify(info));
            }
            await frame.locator('.catBtn[data-filter="e3d19d20-fb46-426c-9f64-221d863add0b"]').click();
            await frame.getByRole('link',{name:/Car Audio & Video/}).evaluate(el=>el.click());
            await page.waitForFunction(()=>document.querySelector('#store').contentWindow.location.pathname.endsWith('/preview-audio.html'),{timeout:15000});
            const carAudioDepartmentImage=frame.locator('.audioTile button').filter({hasText:/Car Audio & Video/}).locator('img.departmentImage');
            await carAudioDepartmentImage.waitFor({state:'visible',timeout:15000});
            const carAudioDepartmentImageLoaded=await carAudioDepartmentImage.evaluate(img=>img.complete&&img.naturalWidth>0);
            if(!carAudioDepartmentImageLoaded)throw new Error('Car Audio & Video department product image did not load');
            await frame.locator('#brands button[aria-label="Sony"]').waitFor({state:'visible',timeout:30000});
            const carAudioSummary=await frame.locator('#audioResultCount').innerText();
            const carAudioRecordCount=Number(carAudioSummary.split(' ')[0]||0);
            if(carAudioRecordCount<700)throw new Error('Car Audio department is missing Planetworld catalogue rows: '+carAudioSummary);
            const logoBrands=['One','Amplified','Kicker','Audison','Alpine','Sony','Starsound','JVC Car Audio','Kenwood Car Audio','Focal Car Audio','Pioneer Car Audio','Hertz'];
            const checkedLogos=[];
            for(const name of logoBrands){
              const logoButton=frame.locator('#brands button[aria-label="'+name+'"]');
              if(await logoButton.count()){
                const info=await logoButton.evaluate(async b=>{
                  const img=b.querySelector('img');
                  if(!img)return {loaded:false,src:null,naturalWidth:0};
                  if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});});
                  return {loaded:img.complete&&img.naturalWidth>0,src:img.src,naturalWidth:img.naturalWidth};
                });
                if(!info.loaded)throw new Error('Required Car Audio brand logo failed to load: '+name+' '+JSON.stringify(info));
                checkedLogos.push({name,naturalWidth:info.naturalWidth});
              }
            }
            if(checkedLogos.length<5)throw new Error('Expected at least five mapped Car Audio brand logos, verified '+checkedLogos.length);
            if(!checkedLogos.some(x=>x.name==='Starsound'))throw new Error('Starsound brand logo was not verified');
            if(await frame.locator('#products').isVisible())throw new Error('Department landing page must hide product stock before brand selection');
            await frame.locator('#brands button[aria-label="Starsound"]').click();
            await page.waitForFunction(()=>new URL(document.querySelector('#store').contentWindow.location.href).searchParams.get('brand')==='Starsound',{timeout:15000});
            await frame.locator('#components button').filter({hasText:'SVC Subwoofers'}).first().waitFor({state:'visible',timeout:30000});
            if(await frame.locator('#products').isVisible())throw new Error('Starsound brand landing page exposed stock before component selection');
            await frame.locator('#components button').filter({hasText:'SVC Subwoofers'}).first().click();
            await frame.locator('#products .audioProduct').first().waitFor({state:'visible',timeout:30000});
            const starsoundProducts=await frame.locator('#products .audioProduct').count();
            if(starsoundProducts!==3)throw new Error('Starsound SVC Subwoofers route expected 3 products, got '+starsoundProducts);
            if(!(await frame.locator('#products').innerText()).includes('Starsound'))throw new Error('Starsound route returned another brand');
            await frame.locator('#brands button').filter({hasText:'All brands'}).click();
            await page.waitForFunction(()=>new URL(document.querySelector('#store').contentWindow.location.href).searchParams.get('brand')==='All brands',{timeout:15000});
            await frame.locator('#brands button[aria-label="Sony"]').waitFor({state:'visible',timeout:30000});
            await frame.locator('#brands button[aria-label="Sony"]').click();
            await frame.locator('#components button').first().waitFor({state:'visible',timeout:30000});
            if(await frame.locator('#products').isVisible())throw new Error('Brand landing page must hide product stock before component selection');
            await frame.locator('#components button').filter({hasText:'Amplifiers'}).first().click();
            await frame.locator('#products .audioProduct').first().waitFor({state:'visible',timeout:30000});
            const audioText=await frame.locator('#products').innerText();
            if(!audioText.includes('Sony')||!audioText.includes('Amplifiers'))throw new Error('Sony amplifier filter did not return selected products: '+audioText.slice(0,500));
            const xmCard=frame.locator('#products .audioProduct').filter({hasText:'XM-5ES'}).first();
            await xmCard.waitFor({state:'visible',timeout:30000});
            await xmCard.locator('img').scrollIntoViewIfNeeded();
            const xmImage=await xmCard.locator('img').evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,10000)});return {loaded:img.complete&&img.naturalWidth>0,src:img.currentSrc||img.src,naturalWidth:img.naturalWidth}});
            if(!xmImage.loaded)throw new Error('Owner-authorized Sony XM-5ES product image failed to load: '+JSON.stringify(xmImage));
            await frame.locator('#components button').filter({hasText:'Subwoofers'}).first().click();
            const xsCard=frame.locator('#products .audioProduct').filter({hasText:'XS-W104ES'}).first();
            await xsCard.waitFor({state:'visible',timeout:30000});
            const xsImageCount=await xsCard.locator('img').count();
            if(xsImageCount!==0)throw new Error('XS-W104ES image must remain withheld until an exact-model source renders; broken or substituted artwork is not acceptable');

            await page.goto('http://127.0.0.1:4173/preview-audio.html?department=Studio%20Equipment',{waitUntil:'domcontentloaded'});
            const jblButton=page.locator('#brands button[aria-label="JBL"]');
            await jblButton.waitFor({state:'visible',timeout:30000});
            const jblLoaded=await jblButton.locator('img').evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,10000)});return img.complete&&img.naturalWidth>0;});
            if(!jblLoaded)throw new Error('JBL logo failed to load in Studio Equipment');
            await jblButton.click();
            await page.waitForURL(url=>new URL(url).searchParams.get('brand')==='JBL',{timeout:15000});
            await page.locator('#components button').first().click();
            await page.locator('#products .audioProduct').first().waitFor({state:'visible',timeout:30000});
            if(!(await page.locator('#products').innerText()).includes('JBL'))throw new Error('JBL brand route did not filter to JBL products');
            await page.goto('http://127.0.0.1:4173/preview-audio.html?department=DJ',{waitUntil:'domcontentloaded'});
            const denonButton=page.locator('#brands button[aria-label="Denon DJ"]');
            await denonButton.waitFor({state:'visible',timeout:30000});
            const denonLoaded=await denonButton.locator('img').evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,10000)});return img.complete&&img.naturalWidth>0;});
            if(!denonLoaded)throw new Error('Denon DJ logo failed to load in DJ Equipment');
            await denonButton.click();
            await page.waitForURL(url=>new URL(url).searchParams.get('brand')==='Denon DJ',{timeout:15000});
            await page.locator('#components button').first().click();
            await page.locator('#products .audioProduct').first().waitFor({state:'visible',timeout:30000});
            if(!(await page.locator('#products').innerText()).includes('Denon DJ'))throw new Error('Denon DJ brand route did not filter to Denon DJ products');
            if(errors.length)throw new Error('Browser JavaScript errors: '+JSON.stringify(errors));
            await page.goto('http://127.0.0.1:4173/category.html?id=8d3c2e91-8b57-4b2c-9a7d-3f0f6a2b4c11',{waitUntil:'domcontentloaded'});
            await page.getByRole('link',{name:/Aerials/}).waitFor({state:'visible',timeout:15000});
            await page.getByRole('link',{name:/Trims & Harnesses/}).waitFor({state:'visible',timeout:15000});
            await page.getByRole('link',{name:/Trims & Harnesses/}).click();
            await page.waitForFunction(()=>location.pathname.endsWith('/preview-audio.html'),{timeout:15000});
            await page.locator('#products .audioProduct').first().waitFor({state:'visible',timeout:30000});
            const fitmentCount=await page.locator('#products .audioProduct').count();
            if(fitmentCount!==47)throw new Error('Trims & Harnesses route should show 47 dedicated Planetworld rows, got '+fitmentCount);
            await page.goto('http://127.0.0.1:4173/category.html?id=8d3c2e91-8b57-4b2c-9a7d-3f0f6a2b4c11',{waitUntil:'domcontentloaded'});
            await page.getByRole('link',{name:/Aerials/}).click();
            await page.waitForFunction(()=>location.pathname.endsWith('/preview-audio.html'),{timeout:15000});
            if(new URL(page.url()).searchParams.get('search')!=='Aerials')throw new Error('Aerials button did not open its own filtered route');
            await page.setViewportSize({width:1280,height:900});
            const widths=await page.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(widths.scrollWidth>widths.innerWidth+1)throw new Error('Category/audio route has horizontal overflow: '+JSON.stringify(widths));
            console.log('OWNER_PREVIEW_BROWSER_QA_PASS',JSON.stringify({roots,sonyAmplifierProductsVisible:true,departmentAndBrandStockHidden:true,sonyProductImages:{XM5ES:xmImage.loaded,XS_W104ES:xsImage.loaded},trimFitmentRows:fitmentCount,aerialsOwnRoute:true,checkoutHidden:true,supabaseWritesBlocked:true}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Inspect the deployed non-production Cloudflare preview on mobile and desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              const expectedSha=process.env.GITHUB_SHA;
              const previewBase='https://repair-pr-168-storefront-cat.get-wired-autoworx-store.pages.dev';
              let deployedBuild=null;
              for(let attempt=0;attempt<36;attempt++){
                const response=await page.request.get(previewBase+'/qa-build-result.json',{headers:{'cache-control':'no-cache'}});
                if(response.ok()){
                  try { deployedBuild=await response.json(); } catch {}
                  if(deployedBuild&&deployedBuild.commit===expectedSha) break;
                }
                if(attempt%6===0)console.log('WAITING_FOR_EXACT_PR168_STAGING_DEPLOY',JSON.stringify({attempt,expectedSha,found:deployedBuild}));
                await page.waitForTimeout(5000);
              }
              console.log('EXACT_PR168_STAGING_PREVIEW',JSON.stringify({expectedSha,previewBase,deployedBuild}));
              for (const asset of ['jbl.svg','denon.svg','hertz.svg']) {
                const response = await page.request.get(previewBase+'/assets/brand-logos/'+asset, {headers:{'cache-control':'no-cache'}});
                const body = await response.text().catch(()=> '');
                console.log('HOSTED_BRAND_ASSET_HTTP', JSON.stringify({asset,status:response.status(),contentType:response.headers()['content-type']||null,bodyStart:body.slice(0,120)}));
                if(!response.ok())throw new Error('Staging preview is missing required brand logo asset '+asset+' (HTTP '+response.status()+')');
              }
              if(!deployedBuild||deployedBuild.commit!==expectedSha) throw new Error('Hosted preview did not deploy exact workflow commit '+expectedSha+'; found '+JSON.stringify(deployedBuild));
              for (const asset of ['jbl.svg','denon.svg','hertz.svg']) {
                const response = await page.request.get(previewBase+'/assets/brand-logos/'+asset, {headers:{'cache-control':'no-cache'}});
                const body = await response.text().catch(()=> '');
                console.log('HOSTED_BRAND_ASSET_HTTP', JSON.stringify({asset,status:response.status(),contentType:response.headers()['content-type']||null,bodyStart:body.slice(0,120)}));
              }
              await page.goto(previewBase+'/owner-preview.html',{waitUntil:'domcontentloaded',timeout:60000});
              if(!(await page.locator('.preview-banner').innerText()).includes('NON-PRODUCTION')) throw new Error('Hosted preview warning banner missing');
              const frame=page.frameLocator('#store');
              await frame.locator('#categoryGrid > .catWrap:not(.findPartCategoryTile)').first().waitFor({state:'visible',timeout:60000});
              await page.waitForFunction(()=>document.querySelector('#store').contentWindow.__GW_PREVIEW_WRITE_BLOCKED===true,{timeout:30000});
              const rootStateBefore=await frame.locator('#categoryGrid > .catWrap').first().evaluate(el=>({className:el.className,childCount:el.querySelector('.children')?.children.length||0,childrenText:el.querySelector('.children')?.innerText||'',html:el.innerHTML.slice(0,3000)}));
              console.log('HOSTED_ROOT_STATE_BEFORE_CLICK',JSON.stringify(rootStateBefore));
              if(rootStateBefore.childCount<1)throw new Error('Hosted category snapshot rendered the Audio root without its subcategory nodes: '+JSON.stringify(rootStateBefore));
              const roots=await frame.locator('#categoryGrid > .catWrap:not(.findPartCategoryTile) > .catBtn > .catContent > b').allTextContents();
              const expected=['Audio, Entertainment & Music','Auto Electrical Parts & Spares','Car Care & Accessories'];
              if(JSON.stringify(roots)!==JSON.stringify(expected)) throw new Error('Hosted preview category roots mismatch: '+JSON.stringify(roots));
              const checkoutSafe=await frame.locator('a[href*="checkout"],.checkoutNow,#checkout').evaluateAll(els=>els.every(el=>getComputedStyle(el).display==='none'||!el.getClientRects().length));
              if(!checkoutSafe) throw new Error('Checkout is visible in hosted owner preview');
              const hostedCarAudioArt=frame.locator('.audioFourTile img[alt="Sony XM-5ES car audio amplifier"]');
              await hostedCarAudioArt.waitFor({state:'visible',timeout:15000});
              const hostedCarAudioArtLoaded=await hostedCarAudioArt.evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,10000)});return img.complete&&img.naturalWidth>0});
              if(!hostedCarAudioArtLoaded)throw new Error('Hosted homepage Car Audio & Video product image did not load');
              await frame.getByRole('button',{name:/Audio, Entertainment & Music/}).click();
              const hostedChildCarAudioImage=frame.locator('.catWrap[data-filter="e3d19d20-fb46-426c-9f64-221d863add0b"] > .catBtn img.catPhoto');
              await hostedChildCarAudioImage.waitFor({state:'visible',timeout:15000});
              const hostedChildCarAudioImageLoaded=await hostedChildCarAudioImage.evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,10000)});return img.complete&&img.naturalWidth>0});
              if(!hostedChildCarAudioImageLoaded)throw new Error('Hosted Car Audio & Video child category product image did not load');
              const hostedDepartmentArtChecks=[
                ['gw-audio-home','home entertainment television'],
                ['862605ef-5223-4525-aad6-ee17c2c6f9e7','band equipment'],
                ['83ea8ae6-a464-40a2-a503-272792f70be8','dj mixer'],
                ['76aee522-bf0e-4e7e-809c-e5c31afd3f6b','musical instruments']
              ];
              for(const [id,expectedAlt] of hostedDepartmentArtChecks){
                const routeNeedle=id==='gw-audio-home'?'Home%20Entertainment':id==='862605ef-5223-4525-aad6-ee17c2c6f9e7'?'Band%20%26%20Live%20Sound':id==='83ea8ae6-a464-40a2-a503-272792f70be8'?'department=DJ':'Musical%20Instruments';
                const art=frame.locator('.catWrap.catalogueWrap a[href*="'+routeNeedle+'"] img.catPhoto');
                await art.waitFor({state:'visible',timeout:15000});
                await art.scrollIntoViewIfNeeded();
                const info=await art.evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,10000)});return {src:img.currentSrc||img.src,alt:img.alt,loaded:img.complete&&img.naturalWidth>0}});
                if(!info.loaded||info.src.includes('car-audio-video-category.svg')||!info.alt.toLowerCase().includes(expectedAlt))throw new Error('Hosted wrong or unloaded audio department artwork for '+id+': '+JSON.stringify(info));
              }
              try {
                await page.waitForFunction(()=>{const f=document.querySelector('#store');const w=f?.contentDocument?.querySelector('#categoryGrid > .catWrap');return !!w?.classList.contains('open')},{timeout:10000});
              } catch(error) {
                const state=await frame.locator('#categoryGrid > .catWrap').first().evaluate(el=>({className:el.className,childCount:el.querySelector('.children')?.children.length||0,buttonText:el.querySelector('.catBtn')?.innerText||'',html:el.innerHTML.slice(0,4000)}));
                console.error('HOSTED_ROOT_CLICK_DIAGNOSTIC',JSON.stringify({state,jsErrors:errors}));
                throw error;
              }
              console.log('HOSTED_AFTER_AUDIO_ROOT',JSON.stringify({text:await frame.locator('#categoryGrid').innerText()}));
              await frame.locator('.catBtn[data-filter="e3d19d20-fb46-426c-9f64-221d863add0b"]').click();
              const hostedCategoryGrid=frame.locator('#categoryGrid');
              const hostedAudioLinks=hostedCategoryGrid.locator('a.catalogueLink[href*="preview-audio.html"]');
              const hostedAudioLinkCount=await hostedAudioLinks.count();
              const hostedCategoryText=await hostedCategoryGrid.innerText();
              console.log('HOSTED_AFTER_CAR_AUDIO',JSON.stringify({audioLinkCount:hostedAudioLinkCount,text:hostedCategoryText,html:(await hostedCategoryGrid.innerHTML()).slice(0,12000)}));
              const audioLink=hostedAudioLinks.filter({hasText:/Car Audio & Video/}).first();
              try { await audioLink.waitFor({state:'visible',timeout:10000}); }
              catch(error) { console.error('HOSTED_AUDIO_LINK_DIAGNOSTIC',JSON.stringify({audioLinkCount:hostedAudioLinkCount,categoryText:hostedCategoryText,jsErrors:errors})); throw error; }
              const audioHref=await audioLink.getAttribute('href');
              if(!audioHref||!audioHref.includes('preview-audio.html')) throw new Error('Hosted Car Audio & Video link has no dedicated preview route: '+audioHref);
              const routeUrl=new URL(audioHref,new URL('preview-store.html',page.url())).href;
              await page.goto(routeUrl,{waitUntil:'domcontentloaded',timeout:60000});
              await page.locator('#brands button[aria-label="Sony"]').waitFor({state:'visible',timeout:30000});
              const hostedLogoBrands=['One','Amplified','Kicker','Audison','Alpine','Sony','Starsound','JVC Car Audio','Kenwood Car Audio','Focal Car Audio','Pioneer Car Audio','Hertz'];
              const hostedCheckedLogos=[];
              for(const name of hostedLogoBrands){
                const logoButton=page.locator('#brands button[aria-label="'+name+'"]');
                if(await logoButton.count()){
                  const info=await logoButton.evaluate(async b=>{
                    const img=b.querySelector('img');
                    if(!img)return {loaded:false,src:null,naturalWidth:0};
                    if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});});
                    return {loaded:img.complete&&img.naturalWidth>0,src:img.src,naturalWidth:img.naturalWidth};
                  });
                  if(!info.loaded)throw new Error('Hosted Car Audio brand logo failed to load: '+name+' '+JSON.stringify(info));
                  hostedCheckedLogos.push({name,naturalWidth:info.naturalWidth});
                }
              }
              if(hostedCheckedLogos.length<5)throw new Error('Hosted preview verified fewer than five brand logos: '+JSON.stringify(hostedCheckedLogos));
              if(!hostedCheckedLogos.some(x=>x.name==='Starsound'))throw new Error('Hosted Starsound brand logo was not verified');
              if(await page.locator('#products').isVisible()) throw new Error('Hosted department page exposed stock before brand selection');
              const hostedCarAudioSummary=await page.locator('#audioResultCount').innerText();
              const hostedCarAudioCount=Number(hostedCarAudioSummary.split(' ')[0]||0);
              if(hostedCarAudioCount<700)throw new Error('Hosted Car Audio department is missing Planetworld catalogue rows: '+hostedCarAudioSummary);
              await page.locator('#brands button[aria-label="Starsound"]').click();
              await page.waitForURL(url=>new URL(url).searchParams.get('brand')==='Starsound',{timeout:15000});
