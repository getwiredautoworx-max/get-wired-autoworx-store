name: Sony Mobile ES Official Product Image Browser Audit

on:
  workflow_dispatch:
  push:
    branches:
      - catalogue/ingest-review-2026-10-30
    paths:
      - "scripts/sony_browser_image_audit.js"
      - ".github/workflows/sony-browser-image-audit.yml"

permissions:
  contents: write
concurrency:
  group: catalogue-review-branch-write
  cancel-in-progress: false

jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalogue/ingest-review-2026-10-30
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render official Sony product pages and inspect image candidates
        run: node scripts/sony_browser_image_audit.js
      - name: Commit browser image candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push -u -m "generated Sony browser image candidates"
          git fetch origin catalogue/ingest-review-2026-10-30
          git checkout -B catalogue/ingest-review-2026-10-30 origin/catalogue/ingest-review-2026-10-30
          git stash pop
          git add catalogue-review/sony-browser-image-audit.csv catalogue-review/sony-browser-image-audit-summary.json catalogue-review/sony-browser-image-candidates/
          if git diff --cached --quiet; then echo "No browser image candidates found."; exit 0; fi
          git commit -m "[skip ci] Record Sony browser image audit candidates"
          git push origin HEAD:catalogue/ingest-review-2026-10-30
