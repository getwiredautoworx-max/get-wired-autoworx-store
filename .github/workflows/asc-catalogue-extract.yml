name: ASC Catalogue Text Extraction Review
on:
  push:
    branches: [main]
    paths:
      - 'suppliers/ASC/*.pdf'
      - 'suppliers/ASC/README.md'
      - 'scripts/asc_catalogue_extract.py'
      - '.github/workflows/asc-catalogue-extract.yml'
permissions:
  contents: write
jobs:
  extract-review-text:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extraction library
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Extract source-page text into review-only files
        run: python scripts/asc_catalogue_extract.py
      - name: Commit review-only extraction output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue-review/asc-catalogue-extraction
          if git diff --cached --quiet; then
            echo "No extraction changes to commit."
          else
            git commit -m "Extract ASC catalogue source-page text for review"
            git push
          fi
