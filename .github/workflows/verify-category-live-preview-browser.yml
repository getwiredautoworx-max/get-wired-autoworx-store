name: Verify deployed category live-data preview in browser
on:
  push:
    branches:
      - finaltest/category-live-preview-2026-10-20
    paths:
      - '.github/workflows/verify-category-live-preview-browser.yml'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finaltest/category-live-preview-2026-10-20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Open exact deployed preview and click live categories
        env:
          PREVIEW_URL: https://category-live-review-2026-10.get-wired-autoworx-store.pages.dev
        run: |
          cat > /tmp/category-preview-smoke.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            const badResponses = [];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
            page.on('response', response => {
              if (response.url().includes('/rest/v1/') && response.status() >= 400) badResponses.push(response.status() + ' ' + response.url());
            });
            try {
              await page.goto(process.env.PREVIEW_URL + '/category.html', { waitUntil: 'networkidle', timeout: 60000 });
              await page.locator('#grid .card').first().waitFor({ timeout: 30000 });
              const rootInfo = await page.locator('#grid').evaluate(el => ({debug: el.dataset.debug || '', cards: [...el.querySelectorAll('.card h2')].map(x => x.innerText.trim())}));
              const debug = JSON.parse(rootInfo.debug || '{}');
              if (debug.source !== 'live-supabase') throw new Error('Root category page did not confirm live Supabase data');
              if (!Array.isArray(debug.rootChecks) || debug.rootChecks.length !== 8 || debug.rootChecks.some(x => !x.found)) throw new Error('One or more of the eight approved root categories are missing: ' + JSON.stringify(debug.rootChecks));
              if (rootInfo.cards.length < 6) throw new Error('Too few root category cards: ' + rootInfo.cards.length);
              const initialUrl = page.url();
              await page.getByRole('link', { name: /Auto Electrical Spares/ }).first().click();
              await page.waitForFunction(() => location.search.includes('id=') || location.pathname.endsWith('/products.html'), null, { timeout: 30000 });
              await page.waitForLoadState('networkidle');
              await page.locator('#grid .card, #grid .empty, #grid .error').first().waitFor({ timeout: 30000 }).catch(() => {});
              const categoryHeading = await page.locator('#heading').count() ? await page.locator('#heading').innerText() : '';
              if (!page.url().includes('id=') && !page.url().includes('products.html')) throw new Error('Root click did not navigate to a category or products route');
              if (page.url().includes('category.html?id=')) {
                const subcats = page.locator('#grid .card');
                const n = await subcats.count();
                if (n < 1) throw new Error('Root click opened category page without populated subcategory/product options');
                const label = (await subcats.first().locator('h2').innerText()).trim();
                await subcats.first().click();
                await page.waitForLoadState('networkidle');
                if (page.url().includes('category.html?id=')) {
                  await page.locator('#grid .card, #grid .empty, #grid .error').first().waitFor({ timeout: 30000 }).catch(() => {});
                  const cards = page.locator('#grid .card');
                  const count = await cards.count();
                  if (count > 0) {
                    await cards.first().click();
                    await page.waitForLoadState('networkidle');
                  }
                }
                console.log('Root click-through category: ' + categoryHeading + '; first subcategory: ' + label);
              }
              const final = { url: page.url(), title: await page.title(), heading: await page.locator('h1').first().innerText().catch(() => ''), rootCards: rootInfo.cards, activeCategories: debug.activeCategories, activeProducts: debug.activeProducts, rootChecks: debug.rootChecks, errors, badResponses };
              console.log(JSON.stringify(final, null, 2));
              if (page.url() === initialUrl) throw new Error('Click-through did not change the URL');
              if (badResponses.length) throw new Error('Live Supabase API errors: ' + badResponses.join('; '));
              if (errors.length) throw new Error('Browser console/page errors: ' + errors.join('; '));
              if (final.heading.toLowerCase().includes('unavailable') || final.heading.toLowerCase().includes('error')) throw new Error('Category click-through ended on an error state: ' + final.heading);
            } finally { await browser.close(); }
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          node /tmp/category-preview-smoke.cjs
