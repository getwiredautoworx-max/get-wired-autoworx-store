name: Import full verified catalogue
on:
  push:
    paths:
      - 'Get_Wired_AutoWorx_4186_CATALOG_IMPORT.sql'
      - '.github/workflows/import-full-catalog.yml'
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import 4,186 verified SKUs into Supabase
        run: |
          curl --fail-with-body --retry 3 --max-time 300 -X POST \
            -H 'Content-Type: text/plain' \
            -H 'x-import-token: GW-CATALOG-IMPORT-2026' \
            --data-binary @Get_Wired_AutoWorx_4186_CATALOG_IMPORT.sql \
            'https://ojytykqpvonxvepprgbh.supabase.co/functions/v1/execute_catalog_import'
