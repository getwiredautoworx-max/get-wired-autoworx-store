name: ASC full catalogue read-only crawl
on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Pages to crawl (0 = all supplier pages; push-triggered safety trial uses 1)"
        required: true
        default: "0"
        type: string
      delay_seconds:
        description: "Minimum delay between page requests (seconds; clamped to 0.8)"
        required: true
        default: "1.0"
        type: string
  push:
    branches: [audit/asc-catalogue-cleanup]
    paths:
      - ".github/workflows/asc-full-catalogue-crawl.yml"
permissions:
  contents: read
  actions: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cancel superseded slow serial crawl
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: gh run cancel 39017530629 --repo "$GH_REPOSITORY" || true
      - name: Install read-only crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Crawl public ASC catalogue respectfully
        run: >-
          python scripts/crawl_asc_catalogue.py
          --output-dir asc-catalogue-output
          --max-pages "${{ inputs.max_pages || '0' }}"
          --delay "${{ inputs.delay_seconds || '1.0' }}"
      - name: Upload catalogue CSV and crawl report
        if: always() && hashFiles('asc-catalogue-output/crawl_summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: asc-catalogue-readonly-${{ github.run_id }}
          path: asc-catalogue-output/
          retention-days: 7
