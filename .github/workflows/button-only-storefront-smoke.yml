name: Button-Only Storefront Smoke Test
on:
  pull_request:
    branches: [main]
    paths:
      - 'index-new.html'
      - 'button-only.html'
      - '.github/workflows/button-only-storefront-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index-new.html'
      - 'button-only.html'
      - '.github/workflows/button-only-storefront-smoke.yml'
jobs:
  detect-mode:
    runs-on: ubuntu-latest
    outputs:
      button_only: ${{ steps.mode.outputs.button_only }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        shell: bash
        run: |
          if grep -q 'data-storefront-mode="buttons-only"' index-new.html 2>/dev/null || grep -q 'data-storefront-mode="buttons-only"' button-only.html 2>/dev/null; then
            echo "button_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "button_only=false" >> "$GITHUB_OUTPUT"
          fi
  button-only-smoke:
    needs: detect-mode
    if: needs.detect-mode.outputs.button_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/button-only-storefront.test.cjs
