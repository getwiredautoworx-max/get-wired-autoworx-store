name: Button-Only Storefront Smoke Test
on:
  push:
    branches: [main]
    paths:
      - 'index-new.html'
      - 'index.html'
      - '.github/workflows/button-only-storefront-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index-new.html'
      - 'index.html'
      - '.github/workflows/button-only-storefront-smoke.yml'
  workflow_dispatch:
jobs:
  button-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify buttons-only storefront at mobile and desktop widths
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/store-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              for (const width of [360,390,768,1280]) {
                const page = await browser.newPage({viewport:{width,height:900}});
                const errors = [];
                page.on('pageerror', e => errors.push(e.message));
                await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
                await page.locator('#categoryGrid').waitFor();
                const roots = page.locator('#categoryGrid a.category');
                const rootCount = await roots.count();
                if (rootCount !== 8) throw new Error(width+'px: expected 8 approved category links; got '+rootCount);
                const expected = ['Auto Electrical Spares','Vehicle Security','Car Audio & Entertainment','Automotive Accessories','Marine Spares & Accessories','Tools, Hardware & Consumables','Camping, Leisure & Outdoors','Trailer & Canopy'];
                const labels = await roots.locator('strong').allTextContents();
                if (JSON.stringify(labels) !== JSON.stringify(expected)) throw new Error(width+'px: root category labels/order mismatch '+JSON.stringify(labels));
                for (let i=0;i<rootCount;i++) {
                  const href = await roots.nth(i).getAttribute('href');
                  if (!href || !href.startsWith('preview-category.html?id=')) throw new Error(width+'px: invalid category route at '+i);
                }
                const body = await page.locator('body').evaluate(el => ({scrollWidth:el.scrollWidth,clientWidth:el.clientWidth}));
                if (body.scrollWidth > width + 1) throw new Error(width+'px: horizontal overflow '+JSON.stringify(body));
                const search = page.locator('#categorySearch');
                await search.fill('marine');
                if (await roots.nth(4).isHidden()) throw new Error(width+'px: category search hid the Marine category');
                if (!(await roots.nth(0).isHidden())) throw new Error(width+'px: category search did not filter unrelated categories');
                await search.clear();
                if ((await roots.count()) !== 8) throw new Error(width+'px: clearing search did not restore all categories');
                if (errors.length) throw new Error(width+'px: browser errors '+errors.join('; '));
                console.log('STOREFRONT_PASS '+width+'px: 8 approved root categories in order, valid preview routes, category search, no horizontal overflow');
                await page.close();
              }
            } finally { await browser.close(); }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
