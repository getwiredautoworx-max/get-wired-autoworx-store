name: Background Task Controller

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: get-wired-background-task-controller
  cancel-in-progress: false

jobs:
  monitor-and-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build task checkpoint from queue and recent workflow results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/background_task_controller.py

      - name: Publish checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: background-task-checkpoint-${{ github.run_number }}
          path: background-task-checkpoint/
          if-no-files-found: warn
          retention-days: 90
