name: Background Task Controller

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - ASC Exact-SKU Image Sync (Bounded)
      - Catalogue Image Audit
      - Public SKU Exposure Audit
      - Refresh Category Snapshot
      - Store Production QA
      - Storefront Smoke Test
      - Prepare Axxess upload package
      - Public URL HTTP Verification
      - Live Release Gates
      - pages build and deployment
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: get-wired-background-task-controller
  cancel-in-progress: false

jobs:
  monitor-and-checkpoint:
    # workflow_run gives event-driven checks when monitored workflows finish.
    # A 15-minute schedule catches events that were missed or delayed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate controller syntax
        run: python -m py_compile scripts/background_task_controller.py

      - name: Build task checkpoint from queue and recent workflow results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/background_task_controller.py

      - name: Prune expired background checkpoint artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 24 * 60 * 60 * 1000;
            let page = 1;
            let deleted = 0;
            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                ...context.repo, per_page: 100, page
              });
              if (!data.artifacts.length) break;
              for (const artifact of data.artifacts) {
                if (
                  artifact.name.startsWith('background-task-checkpoint-') &&
                  new Date(artifact.created_at).getTime() < cutoff
                ) {
                  await github.rest.actions.deleteArtifact({
                    ...context.repo, artifact_id: artifact.id
                  });
                  deleted++;
                }
              }
              if (data.artifacts.length < 100) break;
              page++;
            }
            core.info(`Deleted ${deleted} background checkpoint artifacts older than 24 hours.`);

      - name: Publish checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: background-task-checkpoint-${{ github.run_number }}
          path: background-task-checkpoint/
          if-no-files-found: warn
          # This controller runs every 15 minutes and also after monitored workflows.
          # Checkpoints are short-lived diagnostics, not permanent records.
          retention-days: 1
