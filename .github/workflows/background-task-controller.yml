name: Background Task Controller

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/background-task-controller.yml'
      - 'scripts/background_task_controller.py'
      - 'automation/task-queue.json'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - ASC Exact-SKU Image Sync (Bounded)
      - Catalogue Image Audit
      - Public SKU Exposure Audit
      - Refresh Category Snapshot
      - Store Production QA
      - Storefront Smoke Test
      - Prepare Axxess upload package
      - Public URL HTTP Verification
      - Live Release Gates
      - pages build and deployment
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: get-wired-background-task-controller
  cancel-in-progress: false

jobs:
  monitor-and-checkpoint:
    # workflow_run gives event-driven checks when monitored workflows finish.
    # A 15-minute schedule catches events that were missed or delayed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate controller syntax
        run: python -m py_compile scripts/background_task_controller.py

      - name: Build task checkpoint from queue and recent workflow results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/background_task_controller.py

      - name: Prune obsolete generated artifacts before checkpoint upload
        uses: actions/github-script@v7
        with:
          script: |
            const now = Date.now();
            const checkpointCutoff = now - 24 * 60 * 60 * 1000;
            const staleBuildCutoff = now - 24 * 60 * 60 * 1000;
            const staleQaCutoff = now - 3 * 24 * 60 * 60 * 1000;
            let page = 1;
            let deletedCheckpoints = 0;
            let deletedApks = 0;
            let deletedOldPackages = 0;
            let deletedOldQa = 0;
            const artifacts = [];
            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                ...context.repo, per_page: 100, page
              });
              artifacts.push(...data.artifacts);
              if (data.artifacts.length < 100) break;
              page++;
            }
            const totalBytes = artifacts.reduce((sum, a) => sum + Number(a.size_in_bytes || 0), 0);
            core.info(`ARTIFACT_INVENTORY count=${artifacts.length} total_bytes=${totalBytes} total_MiB=${(totalBytes / 1048576).toFixed(2)}`);
            for (const a of [...artifacts].sort((x, y) => Number(y.size_in_bytes || 0) - Number(x.size_in_bytes || 0)).slice(0, 25)) {
              core.info(`ARTIFACT_INVENTORY_ITEM id=${a.id} name=${a.name} bytes=${a.size_in_bytes} created=${a.created_at} expired=${a.expired}`);
            }
            // Keep the newest Axxess storefront ZIP as the rollback/recovery candidate.
            const packages = artifacts
              .filter(a => /^(axxess-storefront-upload(?:-ready)?|storefront-upload(?:-ready)?)$/i.test(a.name))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const newestPackageId = packages[0]?.id;
            for (const artifact of artifacts) {
              const created = new Date(artifact.created_at).getTime();
              let reason = null;
              if (artifact.name.startsWith('background-task-checkpoint-') && created < checkpointCutoff) {
                reason = 'expired checkpoint';
              } else if (/\.apk$|\b(apk|android-build|owner-apk|store-apk)\b/i.test(artifact.name) && created < staleBuildCutoff) {
                reason = 'obsolete APK/build artifact older than 7 days';
              } else if (/^(axxess-storefront-upload(?:-ready)?|storefront-upload(?:-ready)?)$/i.test(artifact.name) && artifact.id !== newestPackageId) {
                reason = 'duplicate storefront package; preserve newest recovery candidate';
              } else if (/qa|screenshot|evidence/i.test(artifact.name) && created < staleQaCutoff) {
                reason = 'stale QA/screenshot/evidence artifact older than 3 days';
              }
              if (!reason) continue;
              core.info(`Deleting artifact id=${artifact.id} name=${artifact.name} size=${artifact.size_in_bytes} reason=${reason}`);
              await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: artifact.id });
              if (reason === 'expired checkpoint') deletedCheckpoints++;
              else if (reason.startsWith('obsolete APK')) deletedApks++;
              else if (reason.startsWith('older duplicate') || reason.startsWith('duplicate storefront')) deletedOldPackages++;
              else deletedOldQa++;
            }
            core.info(`Cleanup totals: checkpoints=${deletedCheckpoints}, obsolete APK/build artifacts=${deletedApks}, old duplicate storefront packages=${deletedOldPackages}, stale QA/screenshot/evidence artifacts=${deletedOldQa}.`);

      - name: Publish checkpoint artifact
        # Temporarily disabled while GitHub's Actions storage quota recalculates after cleanup.
        # Re-enable only after storage usage is confirmed available.
        if: github.event_name == 'workflow_dispatch' && vars.ENABLE_CHECKPOINT_ARTIFACT_UPLOAD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: background-task-checkpoint-${{ github.run_number }}
          path: background-task-checkpoint/
          if-no-files-found: warn
          # This controller runs every 15 minutes and also after monitored workflows.
          # Checkpoints are short-lived diagnostics, not permanent records.
          retention-days: 1
