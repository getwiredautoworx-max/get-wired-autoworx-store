name: Background Task Controller

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/background-task-controller.yml'
      - 'scripts/background_task_controller.py'
      - 'automation/task-queue.json'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Staging Category Navigation Chromium Acceptance
      - Extract Buyer Guide PDF Text (Staging Only)
      - ASC Exact-SKU Image Sync (Bounded)
      - Catalogue Image Audit
      - Public SKU Exposure Audit
      - ASC Catalogue Preview Browser QA
      - Populated Store Preview Browser QA
      - Cloudflare Pages Public Package QA
      - Planetworld Workbook Audit (Read Only)
      - Delivery Quote Security Tests
      - Category Snapshot Config Regression
      - Refresh Category Snapshot
      - Store Production QA
      - Storefront Smoke Test
      - Prepare Axxess upload package
      - Public URL HTTP Verification
      - Deploy Store to Cloudflare Pages
      - Live Release Gates
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: get-wired-background-task-controller
  cancel-in-progress: false

jobs:
  monitor-and-checkpoint:
    # workflow_run gives event-driven checks when monitored workflows finish.
    # An hourly schedule catches missed events; workflow_run remains event-driven.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate controller syntax
        run: python -m py_compile scripts/background_task_controller.py

      - name: Build task checkpoint from queue and recent workflow results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/background_task_controller.py

      - name: Inventory retained Actions artifacts (read-only; no deletion)
        uses: actions/github-script@v7
        with:
          script: |
            let page = 1;
            const artifacts = [];
            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                ...context.repo, per_page: 100, page
              });
              artifacts.push(...data.artifacts);
              if (data.artifacts.length < 100) break;
              page++;
            }
            const totalBytes = artifacts.reduce((sum, a) => sum + Number(a.size_in_bytes || 0), 0);
            core.info(`ARTIFACT_INVENTORY count=${artifacts.length} total_bytes=${totalBytes} total_MiB=${(totalBytes / 1048576).toFixed(2)}`);
            for (const a of [...artifacts].sort((x, y) => Number(y.size_in_bytes || 0) - Number(x.size_in_bytes || 0)).slice(0, 25)) {
              core.info(`ARTIFACT_INVENTORY_ITEM id=${a.id} name=${a.name} bytes=${a.size_in_bytes} created=${a.created_at} expired=${a.expired}`);
            }
            core.notice('Inventory only: no artifacts were deleted. Destructive cleanup requires explicit owner approval.');

      - name: Publish checkpoint artifact
        # Temporarily disabled while GitHub's Actions storage quota recalculates after cleanup.
        # Re-enable only after storage usage is confirmed available.
        if: github.event_name == 'workflow_dispatch' && vars.ENABLE_CHECKPOINT_ARTIFACT_UPLOAD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: background-task-checkpoint-${{ github.run_number }}
          path: background-task-checkpoint/
          if-no-files-found: warn
          # This controller runs every 15 minutes and also after monitored workflows.
          # Checkpoints are short-lived diagnostics, not permanent records.
          retention-days: 1
