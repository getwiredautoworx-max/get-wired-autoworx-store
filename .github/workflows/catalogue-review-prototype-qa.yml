name: ASC Six-Catalogue Review QA
on:
  pull_request:
    branches: [main]
    paths:
      - "catalogue-review/asc-catalogue-extraction/**"
      - "staging/asc-staged-catalogue-products-do-not-import.csv"
      - "tests/test_asc_reload_validation.py"
      - ".github/workflows/catalogue-review-prototype-qa.yml"
permissions:
  contents: read
jobs:
  asc-review-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate 978-row register, staging gate and 50-product pilot
        run: python3 tests/test_asc_reload_validation.py
