name: Catalogue & Supplier Routing Review — QA

on:
  pull_request:
    branches: [main]
    paths:
      - "catalogue-review/**"
      - "scripts/catalogue-review-prototype.spec.js"
      - "scripts/asc_render_source_review.py"
      - "scripts/asc_extract_product_cards_review.py"
      - "suppliers/ASC/*.pdf"
      - "scripts/supplier-routing.test.mjs"
      - "scripts/supplier-quote-routing-static.test.mjs"
      - "scripts/supplier-gw-crosswalk.test.mjs"
      - "supabase/functions/supplier-quote/index.ts"
      - "supabase/functions/_shared/supplier-routing.mjs"
      - "android-owner-app/app/src/main/assets/admin_app.html"
      - ".github/workflows/catalogue-review-prototype-qa.yml"
  workflow_dispatch:
  push:
    branches:
      - integration/catalogue-supplier-routing-current-main-2026-10-30
    paths:
      - "catalogue-review/car-audio-navigation-prototype.html"
      - "catalogue-review/car-audio-navigation-tree-review.json"
      - "catalogue-review/kicker-manufacturer-product-review.json"
      - "scripts/catalogue-review-prototype.spec.js"
      - "supabase/functions/supplier-quote/index.ts"
      - "supabase/functions/_shared/supplier-routing.mjs"
      - "scripts/supplier-routing.test.mjs"
      - "scripts/supplier-quote-routing-static.test.mjs"
      - "android-owner-app/app/src/main/assets/admin_app.html"
      - ".github/workflows/catalogue-review-prototype-qa.yml"

permissions:
  contents: read

jobs:
  responsive-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run supplier routing unit and static tests
        run: |
          node scripts/supplier-routing.test.mjs
          node scripts/supplier-quote-routing-static.test.mjs
          node scripts/supplier-gw-crosswalk.test.mjs
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check supplier quote Edge Function
        run: deno check --no-lock supabase/functions/supplier-quote/index.ts
      - name: Run responsive review checks
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/review-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node scripts/catalogue-review-prototype.spec.js

  asc-source-page-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF rendering and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --disable-pip-version-check pymupdf pillow opencv-python-headless numpy
      - name: Render all six source catalogues and extract every product card
        run: python scripts/asc_extract_product_cards_review.py
      - name: Upload source page contact sheets for visual verification
        uses: actions/upload-artifact@v4
        with:
          name: asc-source-page-and-product-card-review
          path: artifacts/asc-source-page-review/
          if-no-files-found: error
          retention-days: 7
