name: Publish Isolated Populated Store Preview
on:
  push:
    branches:
      - approved-storefront-preview-trigger
    paths:
      - .preview-deploy-trigger
permissions:
  contents: read
  deployments: write
concurrency:
  group: approved-storefront-preview
  cancel-in-progress: false
jobs:
  publish-approved-baseline:
    name: Deploy preview routes to non-production Pages branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current restored main storefront source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python for public-only Pages package
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build customer-only Pages directory with isolated preview routes
        env:
          GW_INCLUDE_PREVIEW_ROUTES: "1"
        run: python scripts/build-cloudflare-pages-public.py

      - name: Publish isolated Cloudflare Pages preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages-public --project-name=get-wired-autoworx-store --branch=populated-store-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
