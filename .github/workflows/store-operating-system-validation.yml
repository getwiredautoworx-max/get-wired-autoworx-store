name: Store Operating System Reconciliation QA

on:
  pull_request:
    branches: [main]
    paths:
      - "AI_HANDOVER_OWNER_DIRECTIVES_2026-11-05.md"
      - "HANDOVER_CURRENT.md"
      - "index-new.html"
      - "category.html"
      - "category-navigation.js"
      - "CATALOGUE_IMPORT_RULES.md"
      - "QA_RUNBOOK.md"
      - "CATEGORY_MAPPING_REVIEW_2026-10-09.md"
      - "PROPOSED_FINAL_CATEGORY_TREE_AND_MAPPING_PLAN_2026-10-11.md"
      - "catalogue-audits/SUPPLIER_TO_STORE_PROFIT_PLAN_2026-10-27.md"
      - "tests/test_three_department_roots.cjs"
      - "scripts/build-cloudflare-pages-public.py"
      - ".github/workflows/cloudflare-public-pages-build-qa.yml"
      - "tests/test_store_policy_reconciliation.cjs"
      - ".github/workflows/catalogue-image-audit.yml"
      - "GEMINI_EXECUTION_BRIEF.md"
      - "catalogue-review/approved-root-coverage-review-only-2026-11-01.md"
      - "LIVE_CATEGORY_AUDIT_2026-11-01.md"
      - "HANDOVER_CURRENT_ADDENDUM_2026-11-06_AUDIO_PROGRESS.md"
      - ".github/workflows/store-preview-browser-qa.yml"
      - ".github/workflows/planetworld-workbook-audit.yml"
      - ".github/workflows/storefront-smoke.yml"
      - ".github/workflows/button-only-storefront-smoke.yml"
      - "automation/task-queue.json"
      - "automation/24x7-worker-operating-contract.md"
      - "scripts/background_task_controller.py"
      - "scripts/task_queue_utils.py"
      - "scripts/validate_automation_queue.py"
      - "tests/test_task_queue_utils.py"
      - ".github/workflows/store-operating-system-validation.yml"
      - ".github/workflows/background-task-controller.yml"
      - ".github/workflows/catalogue-review-prototype-qa.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile automation modules
        run: python -m py_compile scripts/background_task_controller.py scripts/task_queue_utils.py scripts/validate_automation_queue.py
      - name: Run task queue regression tests
        run: python -m unittest discover -s tests -p 'test_task_queue_utils.py' -v
      - name: Verify exactly three approved homepage departments and matching root labels
        run: node tests/test_three_department_roots.cjs
      - name: Verify public supplier-data and preview safety guards
        run: node tests/test_store_policy_reconciliation.cjs
      - name: Validate authoritative task queue
        run: python scripts/validate_automation_queue.py
