name: Public Preview Data Exposure Guard

on:
  push:
    branches:
      - fix/approved-bright-shell-category-product-ux-2026-11-01-v3
    paths:
      - '_redirects'
      - '.assetsignore'
      - 'wrangler.toml'
      - 'functions/**'
      - 'scripts/build-cloudflare-pages-public.py'
  workflow_run:
    workflows:
      - Deploy Planetworld Audio Preview
    types:
      - completed
    branches:
      - fix/approved-bright-shell-category-product-ux-2026-11-01-v3
  pull_request:
    branches:
      - main
      - integration/current-main-refresh-2026-11-01
    paths:
      - '.assetsignore'
      - 'wrangler.toml'
      - 'functions/**'
      - '.github/workflows/public-preview-data-exposure-guard.yml'

permissions:
  contents: read

jobs:
  deployed-preview-privacy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for the branch Pages preview to respond
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fix-approved-bright-shell-ca-yf6k.get-wired-autoworx-store.pages.dev'
          ready=0
          for attempt in $(seq 1 24); do
            code=$(curl -L --max-redirs 5 --connect-timeout 5 --max-time 10 -sS -o /tmp/store.html -w '%{http_code}' "$BASE/store.html" || true)
            if [ "$code" = '200' ] && grep -qi 'Get Wired AutoWorx' /tmp/store.html; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != '1' ]; then
            echo "Branch preview did not become ready; last HTTP status: ${code:-none}"
            exit 1
          fi
          preview_code=$(curl -L --max-redirs 5 --connect-timeout 5 --max-time 10 -sS -o /tmp/preview-store.html -w '%{http_code}' "$BASE/preview-store.html")
          test "$preview_code" = '200' || { echo "Preview storefront route returned $preview_code"; exit 1; }
          echo "PAGES_BRANCH_PREVIEW_RESPONDS_PASS"

      - name: Wait until the new deployment blocks the raw supplier catalogue dataset
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fix-approved-bright-shell-ca-yf6k.get-wired-autoworx-store.pages.dev'
          ready=0
          for attempt in $(seq 1 24); do
            curl -L --max-redirs 5 --connect-timeout 5 --max-time 10 -sS "$BASE/assets/planetworld-catalogue-preview.json" -o /tmp/guard-planetworld.json
            if ! grep -aEqi 'sourceWorkbooks|indicativePrice|hasStock' /tmp/guard-planetworld.json; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = '1' || { echo "New Pages deployment has not yet blocked raw supplier catalogue data"; exit 1; }
          echo "DEPLOYED_PREVIEW_SUPPLIER_DATA_BLOCKED_PASS"

      - name: Verify supplier source, pricing and handover files are not publicly served
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fix-approved-bright-shell-ca-yf6k.get-wired-autoworx-store.pages.dev'
          check_absent() {
            path="$1"
            marker="$2"
            curl -L --max-redirs 5 --connect-timeout 5 --max-time 10 -sS --path-as-is "$BASE$path" -o /tmp/guard-body -D /tmp/guard-headers
            if grep -aEqi "$marker" /tmp/guard-body; then
              echo "PUBLIC_DATA_EXPOSURE: $path contains blocked marker $marker"
              exit 1
            fi
            echo "BLOCKED_OR_NOT_PUBLISHED_PASS $path"
          }
          check_absent '/assets/planetworld-catalogue-preview.json' 'sourceWorkbooks|indicativePrice|hasStock'
          check_absent '/assets/audio-connections-catalogue-preview.json' 'indicativePrice|sourceFile|dealer'
          check_absent '/assets/asc-catalogue-pilot-preview.json' 'source_file|internal_sku|source_image_pairing'
          check_absent '/preview-planetworld.html' 'Planetworld Catalogue Preview'
          check_absent '/HANDOVER_CURRENT.md' 'Current Execution Handover'
          check_absent '/suppliers/Audio%20Connections/Sony%20Mobile%20ES%20Dealer%20Price%20List%20Sept%2026.pdf' '%PDF-'
          check_absent '/ASC-%20Aerials%20(1).pdf' '%PDF-'
          echo "PUBLIC_PREVIEW_DATA_EXPOSURE_GUARD_PASS_SANITIZED_PACKAGE_V3"
