name: Planetworld technical specification research
on:
  push:
    branches: [main]
    paths: ['.github/workflows/planetworld-specification-research.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5 beautifulsoup4
      - uses: actions/download-artifact@v4
        with:
          name: planetworld-image-evidence
          path: /tmp
          run-id: 45587115485
          github-token: ${{ github.token }}
      - run: python scripts/build-cloudflare-pages-public.py
        env:
          GW_INCLUDE_PREVIEW_ROUTES: '1'
      - run: python scripts/build-kicker-owner-preview.py
      - run: python scripts/stage-planetworld-batch.py
        env:
          GW_BATCH_OWNER_REVIEW: '1'
      - run: python scripts/enrich-planetworld-specifications.py
      - uses: actions/download-artifact@v4
        with:
          name: planetworld-model-spec-evidence
          path: /tmp/prior-specs
          run-id: 45592367894
          github-token: ${{ github.token }}
      - run: cp /tmp/prior-specs/planetworld-spec-evidence.json /tmp/prior-planetworld-spec-evidence.json
      - name: Validate updated Hertz model matching
        run: |
          python - <<'PY'
          import runpy,re
          m=runpy.run_path('scripts/collect-planetworld-model-specs.py')
          a=m['model_alias']
          assert a({'brand':'Hertz','modelNumber':'78000059','title':'Hertz Cento Series CK 130 5inch 2 Way'})=='CK 130'
          assert a({'brand':'Hertz','modelNumber':'78242000','title':'CP 1.700 - D-CLASS MONO AMPLIFIER'})=='CP 1.700'
          assert not a({'brand':'Hertz','modelNumber':'78000133','title':'Hertz Dieci Series DSK130.30 5inch 120W'})
          print('HERTZ_ALIAS_REGRESSION_PASS')
          PY
      - run: python -u scripts/collect-planetworld-model-specs.py
      - name: Prepare coverage summary and missing model list
        run: |
          python - <<'PY'
          import json,collections
          from pathlib import Path
          evidence=json.load(open('/tmp/planetworld-spec-evidence.json'))
          records=json.load(open('pages-public/assets/audio-catalogue-primary-preview.json'))['records']
          counts=collections.defaultdict(collections.Counter)
          missing=[]
          for p in records:
              key=p.get('getWiredSku') or ('Kicker:'+p['modelNumber'])
              e=evidence[key]
              counts[p['brand']]['total']+=1
              counts[p['brand']]['source_recovered']+=bool(e['facts'])
              if not e['facts']: missing.append({'brand':p['brand'],'sku':p['modelNumber'],'title':p['title'],'component':p['component']})
          print('BRAND_SPEC_COVERAGE',json.dumps(counts))
          Path('/tmp/planetworld-missing-spec-models.json').write_text(json.dumps(missing,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: planetworld-missing-spec-models
          path: /tmp/planetworld-missing-spec-models.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: planetworld-model-spec-evidence
          path: /tmp/planetworld-spec-evidence.json
          retention-days: 7
