name: Install verified catalogue product images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[catalogue-image-upgrade]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install only exact SKU-matched catalogue images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/products
          echo '' | base64 -d > /dev/null
          echo 'BASE64_PLACEHOLDER' > /dev/null
      - name: Stop placeholder workflow safely
        run: exit 1
