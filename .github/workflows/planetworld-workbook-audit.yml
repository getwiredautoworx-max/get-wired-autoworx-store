name: Planetworld Workbook Audit — BLOCKED Pending Private Data Boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-boundary-required:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed before reading supplier source files
        run: |
          echo "::error::Planetworld workbook audit is disabled in this public repository. Do not read or process confidential supplier source files on public runners. Establish and verify a private owner-controlled source, runner, logs and artifact boundary first."
          exit 1
