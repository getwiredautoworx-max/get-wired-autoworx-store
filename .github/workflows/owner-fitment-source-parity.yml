name: Owner fitment source parity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-fitment-source-parity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5
      - run: python scripts/verify-owner-fitment-source.py
