name: ASC 50-Image Owner-Authorised Treatment Pilot
on:
  push:
    branches:
      - work/asc-image-pilot-2026-11-09
    paths:
      - 'scripts/reconcile_asc_review_data.py'
      - 'scripts/process_asc_image_pilot.py'
      - 'tests/test_asc_reload_validation.py'
      - 'tests/test_asc_image_pilot.py'
      - '.github/workflows/asc-image-treatment-pilot.yml'
permissions:
  contents: write
concurrency:
  group: asc-image-pilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  process-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: workspace
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: integration/three-category-catalogue-preview-final-2026-11-03
          path: source-assets
          sparse-checkout: assets/asc-catalogue-pilot
      - uses: actions/checkout@v4
        with:
          ref: main
          path: reference-assets
          sparse-checkout: assets/gw-logo.png
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-processing dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Reconcile ASC owner price, stock and image rules
        working-directory: workspace
        run: python3 scripts/reconcile_asc_review_data.py
      - name: Generate the 50-image ASC treatment sample
        working-directory: workspace
        run: |
          python3 scripts/process_asc_image_pilot.py \
            --source-root ../source-assets \
            --logo ../reference-assets/assets/gw-logo.png \
            --output staging/asc-image-treatment-pilot
      - name: Validate catalogue and treatment outputs
        working-directory: workspace
        run: |
          python3 tests/test_asc_reload_validation.py
          python3 tests/test_asc_image_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: asc-50-image-treatment-pilot
          path: workspace/staging/asc-image-treatment-pilot/
          if-no-files-found: error
          retention-days: 14
      - name: Commit review-only data and processed image sample to working branch
        working-directory: workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue-review/asc-catalogue-extraction/ staging/asc-staged-catalogue-products-do-not-import.csv staging/asc-image-treatment-pilot/
          if ! git diff --cached --quiet; then
            git commit -m "artifacts(asc): add owner-authorised 50-image treatment pilot"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
