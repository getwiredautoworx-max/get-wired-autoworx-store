name: Catalogue Image Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit active SKU image mapping
        env:
          SUPABASE_URL: https://ojytykqpvonxvepprgbh.supabase.co
          SUPABASE_KEY: sb_publishable_rSKAEYQqheFAljUmro6uGA_MmBm-l3w
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.request import Request, urlopen

          url=os.environ["SUPABASE_URL"]+"/rest/v1/products?select=public_sku,image_url,active&active=eq.true&limit=10000"
          req=Request(url,headers={"apikey":os.environ["SUPABASE_KEY"],"Authorization":"Bearer "+os.environ["SUPABASE_KEY"]})
          with urlopen(req,timeout=30) as r:
              products=json.load(r)

          root=Path("assets/products")
          files={p.stem:p.name for p in root.iterdir() if p.is_file() and p.suffix.lower() in {".jpg",".jpeg",".png",".webp"} } if root.exists() else {}

          def norm(s):
              return re.sub(r"[^a-z0-9]+","",str(s).lower())

          exact_missing=[]
          normalized_matches=[]
          bad_refs=[]
          for p in products:
              sku=(p.get("public_sku") or "").strip()
              img=(p.get("image_url") or "").strip()
              if not sku:
                  continue
              if not img:
                  bad_refs.append({"sku":sku,"reason":"missing_image_url"})
                  continue
              stem=Path(img.split("?")[0]).stem
              if stem == sku:
                  continue
              if norm(stem)==norm(sku):
                  normalized_matches.append({"sku":sku,"filename":Path(img.split("?")[0]).name})
              else:
                  exact_missing.append({"sku":sku,"image_url":img,"filename":Path(img.split("?")[0]).name})

          active_skus={p.get("public_sku","").strip() for p in products if p.get("public_sku")}
          orphan=[name for stem,name in files.items() if norm(stem) not in {norm(s) for s in active_skus}]

          report={
            "active_products":len(products),
            "repo_product_image_files":len(files),
            "missing_image_url":bad_refs,
            "exact_sku_image_mismatches":exact_missing,
            "normalized_only_matches":normalized_matches,
            "orphan_image_files":orphan
          }
          Path("catalogue-image-audit.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps({k:(len(v) if isinstance(v,list) else v) for k,v in report.items()},indent=2))
          if bad_refs or exact_missing:
              raise SystemExit("Catalogue image audit found unresolved exact-SKU image references; see catalogue-image-audit.json")
          PY

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-image-audit
          path: catalogue-image-audit.json
