name: Catalogue Image Audit

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.json'
      - 'scripts/public-sku-audit.py'
      - 'assets/products/**'
      - '.github/workflows/catalogue-image-audit.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit active SKU image mapping
        env:
          SUPABASE_URL: https://ojytykqpvonxvepprgbh.supabase.co
          # Supabase publishable keys are intentionally safe for source/GitHub Actions;
          # they are low-privilege and RLS-scoped. No secret/service key is used here.
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_rSKAEYqQheFAljUmro6uGA_MmBm-l3w
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.request import Request, urlopen

          base=os.environ["SUPABASE_URL"]
          key=os.environ["SUPABASE_PUBLISHABLE_KEY"]
          url=base+"/rest/v1/products?select=public_sku,image_url,active&active=eq.true&limit=10000"
          req=Request(url,headers={"apikey":key})
          with urlopen(req,timeout=30) as r:
              products=json.load(r)

          bad=[]
          proxy=[]
          placeholder=[]
          public_sku_re=re.compile(r"^GW-[A-Z0-9]{8}$")
          proxy_re=re.compile(r"^"+re.escape(base)+r"/functions/v1/product-image\?sku=(GW-[A-Z0-9]{8})$")

          for p in products:
              sku=(p.get("public_sku") or "").strip().upper()
              img=(p.get("image_url") or "").strip()
              if not sku or not public_sku_re.fullmatch(sku):
                  bad.append({"sku":sku,"reason":"invalid_public_sku"})
                  continue
              if not img:
                  bad.append({"sku":sku,"reason":"missing_image_url"})
                  continue
              if img == "/assets/product-placeholder.svg":
                  placeholder.append(sku)
                  continue
              m=proxy_re.fullmatch(img)
              if not m:
                  bad.append({"sku":sku,"reason":"non_public_image_reference","image_url":img})
              elif m.group(1) != sku:
                  bad.append({"sku":sku,"reason":"image_url_sku_mismatch","image_url":img})
              else:
                  proxy.append(sku)

          # Source assets are internal supplier-keyed inputs for the server-side image proxy.
          # They are not public product references and therefore are not audited as public SKU files.
          source_root=Path("assets/products")
          source_files=[p.name for p in source_root.iterdir() if p.is_file() and p.suffix.lower() in {".jpg",".jpeg",".png",".webp"}] if source_root.exists() else []

          report={
            "active_products":len(products),
            "public_proxy_image_references":len(proxy),
            "placeholder_image_urls":len(placeholder),
            "invalid_or_mismatched_public_image_refs":bad,
            "internal_source_image_files":len(source_files)
          }
          Path("catalogue-image-audit.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps({
            "active_products":len(products),
            "public_proxy_image_references":len(proxy),
            "placeholder_image_urls":len(placeholder),
            "invalid_or_mismatched_public_image_refs":len(bad),
            "internal_source_image_files":len(source_files)
          },indent=2))
          if bad:
              raise SystemExit("Public product-image audit found invalid or mismatched image references; see catalogue-image-audit.json")
          PY

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-image-audit
          path: catalogue-image-audit.json
