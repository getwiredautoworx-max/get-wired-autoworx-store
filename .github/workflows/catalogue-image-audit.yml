name: Catalogue Image Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/catalogue-image-audit.yml'
      - 'supabase/functions/product-image/**'
      - 'assets/products/**'
      - 'assets/products_webp/**'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.json'
      - 'scripts/public-sku-audit.py'
      - 'assets/products/**'
      - 'assets/products_webp/**'
      - 'supabase/functions/product-image/**'
      - '.github/workflows/catalogue-image-audit.yml'
  workflow_run:
    workflows: ["ASC Exact-SKU Image Sync (Bounded)"]
    types: [completed]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit active SKU image mapping
        env:
          SUPABASE_URL: https://ojytykqpvonxvepprgbh.supabase.co
          # Supabase publishable keys are intentionally safe for source/GitHub Actions;
          # they are low-privilege and RLS-scoped. No secret/service key is used here.
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_rSKAEYqQheFAljUmro6uGA_MmBm-l3w
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.request import Request, urlopen

          base=os.environ["SUPABASE_URL"]
          key=os.environ["SUPABASE_PUBLISHABLE_KEY"]
          # PostgREST caps responses at 1,000 rows by default. Explicitly page
          # through the whole active catalogue instead of silently auditing only
          # the first batch.
          products=[]
          offset=0
          page_size=1000
          while True:
              url=base+"/rest/v1/products?select=public_sku,image_url,active&active=eq.true&order=public_sku.asc&limit="+str(page_size)+"&offset="+str(offset)
              req=Request(url,headers={"apikey":key})
              with urlopen(req,timeout=30) as r:
                  batch=json.load(r)
              if not isinstance(batch,list):
                  raise SystemExit("Unexpected catalogue response during paged image audit")
              products.extend(batch)
              if len(batch)<page_size:
                  break
              offset += page_size

          bad=[]
          proxy=[]
          placeholder=[]
          public_sku_re=re.compile(r"^GW-[A-Z0-9]{8}$")
          proxy_re=re.compile(r"^"+re.escape(base)+r"/functions/v1/product-image\?sku=(GW-[A-Z0-9]{8})$")
          direct_re=re.compile(r"^/assets/products_webp/(GW-[A-Z0-9]{8})\.webp$")
          webp_root=Path("assets/products_webp")
          webp_skus={p.stem.upper() for p in webp_root.glob("*.webp") if public_sku_re.fullmatch(p.stem.upper())} if webp_root.exists() else set()
          direct_webp=[]

          for p in products:
              sku=(p.get("public_sku") or "").strip().upper()
              img=(p.get("image_url") or "").strip()
              if not sku or not public_sku_re.fullmatch(sku):
                  bad.append({"sku":sku,"reason":"invalid_public_sku"})
                  continue
              if not img:
                  bad.append({"sku":sku,"reason":"missing_image_url"})
                  continue
              if img == "/assets/product-placeholder.svg":
                  placeholder.append(sku)
                  continue
              m=proxy_re.fullmatch(img)
              if m:
                  if m.group(1) != sku:
                      bad.append({"sku":sku,"reason":"image_url_sku_mismatch","image_url":img})
                  else:
                      proxy.append(sku)
                  continue
              direct=direct_re.fullmatch(img)
              if direct:
                  if direct.group(1) != sku:
                      bad.append({"sku":sku,"reason":"direct_image_sku_mismatch","image_url":img})
                  elif sku not in webp_skus:
                      bad.append({"sku":sku,"reason":"direct_image_asset_missing","image_url":img})
                  else:
                      direct_webp.append(sku)
                  continue
              bad.append({"sku":sku,"reason":"non_public_image_reference","image_url":img})

          # Source assets are internal supplier-keyed inputs for the server-side image proxy.
          # They are not public product references and therefore are not audited as public SKU files.
          source_root=Path("assets/products")
          source_files=[p.name for p in source_root.iterdir() if p.is_file() and p.suffix.lower() in {".jpg",".jpeg",".png",".webp"}] if source_root.exists() else []
          active_webp_skus=sorted({(p.get('public_sku') or '').strip().upper() for p in products if (p.get('public_sku') or '').strip().upper() in webp_skus})
          placeholder_skus=set(placeholder)
          proxy_skus=set(proxy)
          direct_webp_skus=set(direct_webp)
          placeholder_with_webp=placeholder_skus & webp_skus
          effective_image_skus=proxy_skus | webp_skus

          report={
            "active_products":len(products),
            "public_proxy_image_references":len(proxy),
            "direct_public_webp_image_references":len(direct_webp),
            "placeholder_image_urls":len(placeholder),
            "public_sku_webp_assets":len(webp_skus),
            "placeholder_products_with_webp_asset":len(placeholder_with_webp),
            "effective_known_image_coverage":len(effective_image_skus),
            "placeholder_products_without_known_webp_asset":len(placeholder_skus-webp_skus),
            "placeholder_skus":sorted(placeholder_skus),
            "placeholder_products_with_webp_skus":sorted(placeholder_with_webp),
            "placeholder_products_without_known_webp_skus":sorted(placeholder_skus-webp_skus),
            "invalid_or_mismatched_public_image_refs":bad,
            "internal_source_image_files":len(source_files),
            "active_skus_with_webp_sample":active_webp_skus[:10]
          }
          Path("catalogue-image-audit.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps({
            "active_products":len(products),
            "public_proxy_image_references":len(proxy),
            "direct_public_webp_image_references":len(direct_webp),
            "placeholder_image_urls":len(placeholder),
            "public_sku_webp_assets":len(webp_skus),
            "placeholder_products_with_webp_asset":len(placeholder_with_webp),
            "effective_known_image_coverage":len(effective_image_skus),
            "placeholder_products_without_known_webp_asset":len(placeholder_skus-webp_skus),
            "invalid_or_mismatched_public_image_refs":len(bad),
            "internal_source_image_files":len(source_files)
          },indent=2))
          if bad:
              raise SystemExit("Public product-image audit found invalid or mismatched image references; see catalogue-image-audit.json")
          if placeholder_with_webp:
              raise SystemExit(
                  f"{len(placeholder_with_webp)} active products still use a placeholder despite an exact-public-SKU WebP asset; "
                  "promote only verified exact-SKU assets before release."
              )
          PY

      - name: Verify server-side slash normalisation for private supplier image filenames
        run: |
          set -euo pipefail
          # Legacy probe SKUs include quarantined/out-of-scope items and may correctly
          # return 404 when no active public mapping exists. Do not require those rows
          # to be published just to test filename normalisation.
          grep -F 'String(mapping.supplier_sku).replace(/[\\/]/g, "_")' supabase/functions/product-image/index.ts
          echo "SERVER_SIDE_SUPPLIER_FILENAME_NORMALISATION_PASS"

      - name: Verify public Cloudflare image asset origin for private repository
        shell: bash
        run: |
          set -euo pipefail
          base="https://approved-storefront-preview.get-wired-autoworx-store.pages.dev"
          grep -F 'const ASSET_ORIGIN = "https://approved-storefront-preview.get-wired-autoworx-store.pages.dev";' supabase/functions/product-image/index.ts
          if grep -Eq 'raw.githubusercontent.com|cdn.jsdelivr.net/gh' supabase/functions/product-image/index.ts; then
            echo "ERROR: private GitHub image origins must not be used by the deployed proxy"
            exit 1
          fi
          for path in preview-store.html assets/products_webp/GW-000174D6.webp assets/products/C5-018-2.jpg; do
            status="$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' "${base}/${path}")"
            if [ "$status" != "200" ]; then
              echo "ERROR: allowlisted Cloudflare asset returned HTTP ${status}: ${path}"
              exit 1
            fi
            echo "CLOUDFLARE_ASSET_ORIGIN_PASS ${path}"
          done
          planetworld_status="$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' "${base}/preview-planetworld.html")"
          if [ "$planetworld_status" != "404" ]; then
            echo "ERROR: supplier-specific Planetworld preview must not be publicly served (HTTP ${planetworld_status})"
            exit 1
          fi
          echo "SUPPLIER_PREVIEW_PRIVATE_ROUTE_BLOCKED_PASS"

      - name: Smoke test deployed product-image function when owner-approved
        shell: bash
        env:
          GW_PRODUCT_IMAGE_FUNCTION_CDN_DEPLOYED: ${{ vars.GW_PRODUCT_IMAGE_FUNCTION_CDN_DEPLOYED }}
        run: |
          set -euo pipefail
          if [ "${GW_PRODUCT_IMAGE_FUNCTION_CDN_DEPLOYED:-false}" != "true" ]; then
            echo "PRODUCT_IMAGE_FUNCTION_SMOKE_SKIPPED: source is prepared; Supabase deployment still requires explicit owner approval."
            exit 0
          fi
          mapfile -t skus < <(python - <<'PY'
          import json
          report=json.load(open("catalogue-image-audit.json",encoding="utf-8"))
          for sku in report.get("active_skus_with_webp_sample",[]):
              print(sku)
          PY
          )
          for sku in "${skus[@]}"; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "https://ojytykqpvonxvepprgbh.supabase.co/functions/v1/product-image?sku=${sku}")"
            if [ "$status" = "200" ]; then
              echo "ACTIVE_PUBLIC_WEBP_PROXY_PASS: ${sku}"
              exit 0
            fi
          done
          echo "ERROR: deployed product-image function returned no HTTP 200 for active WebP samples"
          exit 1

      - name: Upload audit report
        if: always() && vars.ENABLE_CATALOGUE_IMAGE_AUDIT_ARTIFACT_UPLOAD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-image-audit
          path: catalogue-image-audit.json
