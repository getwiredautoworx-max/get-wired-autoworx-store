name: 24x7 Public-Safe Catalogue Worker

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "automation/task-queue.json"
      - "scripts/run_24x7_public_safe_worker.py"
      - "scripts/asc_catalogue_extract.py"
      - "scripts/validate_automation_queue.py"
      - "suppliers/ASC/**"
      - ".github/workflows/store-24x7-catalogue-worker.yml"

permissions:
  contents: write

concurrency:
  group: get-wired-public-safe-catalogue-worker
  cancel-in-progress: false

jobs:
  public-safe-asc-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare persistent extraction checkpoint branch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main
          git fetch origin automation/catalogue-extraction-checkpoints
          git checkout -B automation/catalogue-extraction-checkpoints origin/automation/catalogue-extraction-checkpoints
          git merge --no-edit origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR and PDF extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          python -m pip install --disable-pip-version-check pymupdf

      - name: Validate current owner-directed task queue
        run: python scripts/validate_automation_queue.py

      - name: Run bounded ASC catalogue extraction
        run: python scripts/run_24x7_public_safe_worker.py

      - name: Add checkpoint to this workflow run summary
        if: always()
        run: |
          if [ -f background-task-checkpoint/PUBLIC_SAFE_WORKER_STATUS.md ]; then
            cat background-task-checkpoint/PUBLIC_SAFE_WORKER_STATUS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No worker checkpoint was produced; inspect the job logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit changed review-only extraction outputs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue-review/asc-catalogue-extraction
          if git diff --cached --quiet; then
            echo "No source extraction changes; no checkpoint commit required."
          else
            git commit -m "automation: refresh ASC catalogue OCR review evidence"
            git push origin HEAD:automation/catalogue-extraction-checkpoints
          fi

      - name: Explain PR validation mode
        if: github.event_name == 'pull_request'
        run: |
          echo "PR validation ran the public-safe ASC extraction and task-queue checks." >> "$GITHUB_STEP_SUMMARY"
          echo "PR jobs do not commit generated outputs or alter any branch." >> "$GITHUB_STEP_SUMMARY"
