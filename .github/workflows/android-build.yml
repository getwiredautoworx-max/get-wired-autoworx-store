name: Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
    branches: [main]

jobs:
  build-apk:
    name: Build preview APK with Expo EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Setup EAS CLI
        run: npm install --global eas-cli
      - name: Check required EAS project configuration
        run: |
          node -e "const c=require('./app.json').expo; if(!c.extra?.eas?.projectId) { console.error('BLOCKED: Link this app to an Expo EAS project first. Run npx eas init in android-app, then commit the generated projectId in app.json.'); process.exit(1) }"
      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "BLOCKED: Add EXPO_TOKEN in GitHub repository Settings > Secrets and variables > Actions." && exit 1)
          eas build --platform android --profile preview --non-interactive --wait
