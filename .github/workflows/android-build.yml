name: Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
    branches: [main]

jobs:
  build-apk:
    name: Build preview APK with Expo EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Setup EAS CLI
        run: npm install --global eas-cli
      - name: Verify EAS project link
        run: test -f eas.json && test -n "$(node -e "try { console.log(require('./app.json').expo.extra.eas.projectId || '') } catch { process.exit(0) }")" || echo "EAS project ID must be linked before first build via npx eas init"
      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "Missing EXPO_TOKEN repository secret" && exit 1)
          eas build --platform android --profile preview --non-interactive --wait
