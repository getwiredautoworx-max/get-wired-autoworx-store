name: Kicker isolated catalogue preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kicker-isolated-preview.yml', 'scripts/build-kicker-owner-preview.py']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5
      - run: python scripts/build-cloudflare-pages-public.py
        env:
          GW_INCLUDE_PREVIEW_ROUTES: '1'
      - run: python scripts/build-kicker-owner-preview.py
      - name: Keep supplier workbook outside public deployment
        run: |
          mkdir -p private-qa
          mv pages-public/kicker-*.xlsx private-qa/
      - uses: actions/upload-artifact@v4
        with:
          name: kicker-catalogue-private-review
          path: private-qa/
      - name: Confirm production branch and automatic deployment safety
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/get-wired-autoworx-store" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["success"]; p=d["result"]; assert p["production_branch"]=="main"; assert p["source"]["config"]["production_deployments_enabled"] is False'
      - uses: cloudflare/wrangler-action@v4
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages-public --project-name=get-wired-autoworx-store --branch=kicker-owner-review --commit-hash=${{ github.sha }}
      - name: Verify isolated deployment and hosted catalogue
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/get-wired-autoworx-store/deployments" > /tmp/deployments.json
          python -c 'import json,os; d=json.load(open("/tmp/deployments.json")); assert any(x["environment"]=="preview" and x["url"].rstrip("/")==os.environ["URL"].rstrip("/") for x in d["result"])'
          curl -fsS "$URL/assets/audio-catalogue-primary-preview.json" > /tmp/hosted.json
          python -c 'import json; assert json.load(open("/tmp/hosted.json"))==json.load(open("pages-public/assets/audio-catalogue-primary-preview.json"))'
          echo "KICKER_PREVIEW_URL=$URL/owner-preview.html"

      - name: Browser acceptance tests
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
            const page=await browser.newPage({viewport});
            const base=process.env.URL;
            await page.goto(base+'/owner-preview.html');
            const frame=page.frameLocator('iframe').first();
            await frame.getByText('Car Audio & Security',{exact:true}).first().waitFor({timeout:30000});
            await page.goto(base+'/preview-category.html?id=e3d19d20-fb46-426c-9f64-221d863add0b');
            await page.getByText('Vehicle Security',{exact:true}).first().waitFor();
            await page.getByText('Car Audio & Video',{exact:true}).first().click();
            await page.getByText('Kicker',{exact:true}).first().waitFor({timeout:30000});
            await page.goto(base+'/preview-audio-products.html?department=Car%20Audio&brand=Kicker&component=Amplifiers');
            await page.getByText(/46CXA4001/).first().waitFor({timeout:30000});
            await page.getByText(/47KEY5001/).first().waitFor();
            const data=await (await page.request.get(base+'/assets/audio-catalogue-primary-preview.json')).json();
            assert.equal(data.records.length,172);
            for(const sku of ['46CXA4001','47KEY5001']){
              const item=data.records.find(x=>x.modelNumber===sku);
              assert(item.imageUrl.startsWith('assets/kicker-'));
              assert((await page.request.get(base+'/'+item.imageUrl)).ok());
            }
            assert.equal(data.records.find(x=>x.modelNumber==='46KIYFM').component,'Wiring Kits');
            assert.equal((await page.request.get(base+'/kicker-catalogue-image-repaired.xlsx')).headers()['content-type']?.includes('spreadsheet'),false);
            await page.close();
            console.log('BROWSER_ACCEPTANCE_OK',viewport.width);
          }
          await browser.close();
          JS
