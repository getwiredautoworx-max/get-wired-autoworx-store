name: Current Branch Runner Recovery Check
on:
  workflow_dispatch:
  push:
    branches:
      - integration/three-category-catalogue-preview-final-2026-11-03
      - fix/mobile-audio-subcategory-grid-2026-11-04
  pull_request:
    branches:
      - main
      - integration/three-category-catalogue-preview-final-2026-11-03
permissions:
  contents: read
jobs:
  runner-and-catalogue-structure:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm runner is alive and inspect catalogue invariants
        run: |
          set -eu
          echo "GW_RUNNER_DIAGNOSTIC_STARTED"
          python - <<'PY'
          import json
          from pathlib import Path
          tree = json.loads(Path('assets/category-tree.json').read_text())
          categories = tree.get('categories', tree) if isinstance(tree, dict) else tree
          roots = [x for x in categories if not (x.get('parent_id') or x.get('parentId')) and x.get('active', True)]
          names = [x.get('name') or x.get('title') for x in roots]
          print('active_top_level_roots:', names)
          assert len(roots) == 3, f'Expected 3 active roots, got {len(roots)}'
          for f, expected in (
              ('assets/planetworld-catalogue-preview.json', 3317),
              ('assets/audio-connections-catalogue-preview.json', 66),
          ):
              data = json.loads(Path(f).read_text())
              rows = data if isinstance(data, list) else data.get('records', data.get('products', data.get('items', [])))
              assert len(rows) == expected, f'{f}: expected {expected} rows, got {len(rows)}'
              print(f, 'rows=', len(rows))
          print('GW_CATALOGUE_STRUCTURE_PASS')
          # Planetworld manual-review invariant: no keyword-only "manual review" rows remain.
          preview = json.loads(Path('assets/planetworld-catalogue-preview.json').read_text())
          car = [x for x in preview['records'] if x.get('division') == 'Car Audio']
          held = [x for x in car if x.get('component') == 'Unclassified — owner/source confirmation']
          assert len(held) == 0, f'Expected all Planetworld Car Audio rows classified, got {len(held)} held'
          assert not any(x.get('component') == 'Unclassified – manual review' for x in car), 'stale manual-review labels remain'
          assert next(x for x in car if x.get('id') == 'pw-2088')['component'] == 'Car Audio Accessories'
          assert next(x for x in car if x.get('id') == 'pw-2172')['component'] == 'Fascia & Fitting Kits'
          assert sum(x.get('component') == 'Excluded — Non-Audio Merchandise' for x in car) == 1
          print('GW_PLANETWORLD_MANUAL_REVIEW_PASS')
          PY
      - name: Build isolated preview package and run full storefront regression suite
        env:
          GW_INCLUDE_PREVIEW_ROUTES: "1"
        run: |
          set -eu
          python scripts/build-cloudflare-pages-public.py
          node tests/audio-catalogue-preview.test.cjs
          node tests/three-category-storefront-structure.test.cjs
          python3 scripts/public-sku-audit.py
          echo "GW_FULL_STOREFRONT_REGRESSION_PASS"
          echo "GW_RUNNER_DIAGNOSTIC_PASS"
