name: Current Branch Runner Recovery Check
on:
  push:
    branches:
      - integration/three-category-catalogue-preview-final-2026-11-03
    paths:
      - '.github/workflows/runner-diagnostic-current-branch.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-diagnostic-current-branch.yml'
permissions:
  contents: read
jobs:
  runner-and-catalogue-structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm runner is alive and inspect catalogue invariants
        run: |
          set -eu
          echo "GW_RUNNER_DIAGNOSTIC_STARTED"
          python - <<'PY'
          import json
          from pathlib import Path
          tree = json.loads(Path('assets/category-tree.json').read_text())
          roots = [x for x in tree if not x.get('parentId') and x.get('active', True)]
          print('active_top_level_roots:', [x.get('name') or x.get('title') for x in roots])
          assert len(roots) == 3, f'Expected 3 active roots, got {len(roots)}'
          for f in ('assets/planetworld-catalogue-preview.json', 'assets/audio-connections-catalogue-preview.json'):
              data = json.loads(Path(f).read_text())
              rows = data if isinstance(data, list) else data.get('products', data.get('items', []))
              assert rows, f'No catalogue rows parsed from {f}'
              print(f, 'rows=', len(rows))
          print('GW_CATALOGUE_STRUCTURE_PASS')
          PY
          echo "GW_RUNNER_DIAGNOSTIC_PASS"
