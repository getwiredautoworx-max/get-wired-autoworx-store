name: Current Branch Runner Recovery Check
on:
  workflow_dispatch:
  push:
    branches:
      - integration/three-category-catalogue-preview-final-2026-11-03
      - supplier-standard-planetworld-audio-connections-2026-11-03
  pull_request:
    branches: [main]
permissions:
  contents: read
  deployments: write
jobs:
  runner-and-catalogue-structure:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Confirm runner is alive and inspect catalogue invariants
        run: |
          set -eu
          node --version
          python3 --version
          echo "GW_RUNNER_DIAGNOSTIC_STARTED"
          python - <<'PY'
          import json
          from pathlib import Path
          tree = json.loads(Path('assets/category-tree.json').read_text())
          categories = tree.get('categories', tree) if isinstance(tree, dict) else tree
          roots = [x for x in categories if not (x.get('parent_id') or x.get('parentId')) and x.get('active', True)]
          names = [x.get('name') or x.get('title') for x in roots]
          print('active_top_level_roots:', names)
          assert len(roots) == 3, f'Expected 3 active roots, got {len(roots)}'
          for f, expected in (
              ('assets/planetworld-catalogue-preview.json', 3317),
              ('assets/audio-connections-catalogue-preview.json', 66),
          ):
              data = json.loads(Path(f).read_text())
              rows = data if isinstance(data, list) else data.get('records', data.get('products', data.get('items', [])))
              assert len(rows) == expected, f'{f}: expected {expected} rows, got {len(rows)}'
              print(f, 'rows=', len(rows))
          print('GW_CATALOGUE_STRUCTURE_PASS')
          PY
          echo "GW_RUNNER_DIAGNOSTIC_PASS"
      - name: Build isolated non-production preview package and run storefront regression
        env:
          GW_INCLUDE_PREVIEW_ROUTES: "1"
        run: python3 scripts/build-cloudflare-pages-public.py
      - name: Stamp exact source SHA into preview package
        shell: bash
        run: |
          set -euo pipefail
          printf '{"sha":"%s","branch":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > pages-public/deployment-manifest.json
          test -s pages-public/deployment-manifest.json
      - name: Confirm deferred ASC source material is excluded from the supplier pilot preview
        shell: bash
        run: |
          set -euo pipefail
          test ! -d pages-public/assets/asc-catalogue-source
          test ! -d pages-public/suppliers
          echo "ASC_DEFERRED_SOURCE_EXCLUSION_PASS"
      - name: Run Planetworld and Audio Connections regression
        run: node tests/audio-catalogue-preview.test.cjs
      - name: Run public SKU exposure audit
        run: python3 scripts/public-sku-audit.py
      - name: Verify preview-only allowlist
        shell: bash
        run: |
          set -euo pipefail
          test -s pages-public/owner-preview.html
          test -s pages-public/preview-audio.html
          test -s pages-public/asc-catalogue-preview.html
          test -s pages-public/assets/planetworld-catalogue-preview.json
          test -s pages-public/assets/audio-connections-catalogue-preview.json
          test ! -d pages-public/suppliers
          test ! -d pages-public/catalogue-review
          test ! -d pages-public/supabase
          test ! -d pages-public/assets/asc-catalogue-source
          if find pages-public -type f -iname '*.pdf' -print -quit | grep -q .; then
            echo "Supplier PDF leaked into preview package"
            exit 1
          fi
          echo "SUPPLIER_PREVIEW_ALLOWLIST_PASS"
      - name: Run read-only mobile and desktop owner-preview browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          (cd pages-public && python3 -m http.server 4173 --bind 127.0.0.1) >/tmp/gw-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/owner-preview.html -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/owner-preview.html -o /dev/null
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/owner-preview.html',{waitUntil:'domcontentloaded'});
            if(!(await page.locator('.preview-banner').innerText()).includes('NON-PRODUCTION')) throw new Error('Missing non-production warning');
            const frame=page.frameLocator('#store');
            await frame.locator('#categoryGrid > .catWrap:not(.findPartCategoryTile)').first().waitFor({state:'visible',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#store').contentWindow.__GW_PREVIEW_WRITE_BLOCKED===true,{timeout:15000});
            const roots=await frame.locator('#categoryGrid > .catWrap:not(.findPartCategoryTile) > .catBtn > .catContent > b').allTextContents();
            const expected=['Car Audio / Home Entertainment / Lifestyle','Auto Electrical Parts & Spares','Car Care & Accessories'];
            if(JSON.stringify(roots)!==JSON.stringify(expected)) throw new Error('Approved roots mismatch: '+JSON.stringify(roots));
            const checkoutHidden=await frame.locator('a[href*="checkout"],.checkoutNow,#checkout').evaluateAll(els=>els.every(el=>getComputedStyle(el).display==='none'||!el.getClientRects().length));
            if(!checkoutHidden) throw new Error('Checkout control visible');
            const collagePanels=await frame.locator('.audioCategoryCollage .audioCollagePanel').count();
            if(collagePanels!==4) throw new Error('Audio category artwork must show four product families; found '+collagePanels);
            const storeFrame=page.frames().find(f=>f.url().includes('/index-new.html'));
            if(!storeFrame) throw new Error('Hosted store iframe not found before audio navigation: '+JSON.stringify(page.frames().map(f=>f.url())));
            await frame.locator('#categoryGrid > .catWrap a[href^="/preview-audio.html"]').click();
            await storeFrame.waitForURL(/\/preview-audio\.html(?:\?|$)/,{timeout:30000}).catch(async error=>{
              console.error('HOSTED_FRAME_NAV_DIAG',JSON.stringify({frameUrls:page.frames().map(f=>f.url()),audioLink:await frame.locator('#categoryGrid > .catWrap a[href^="/preview-audio.html"]').getAttribute('href')}));
              throw error;
            });
            await frame.getByRole('button',{name:'Car Audio & Video',exact:true}).waitFor({state:'visible',timeout:15000});
            await frame.getByRole('button',{name:'Car Audio & Video',exact:true}).click();
            await frame.locator('#brands button').first().waitFor({state:'visible',timeout:15000});
            await frame.locator('#components button').first().waitFor({state:'visible',timeout:15000});
            await frame.locator('#products .audioProduct').first().waitFor({state:'visible',timeout:30000});
            await frame.locator('#audioSearch').fill('SSW8');
            await frame.locator('#products .audioProduct').first().waitFor({state:'visible',timeout:15000});
            const specialOrderText=await frame.locator('#products').innerText();
            if(!specialOrderText.includes('Special-order item — price is subject to currency exchange rates and supplier confirmation.')) throw new Error('Special-order exchange-rate disclosure missing from Price on Request item');
            const text=await frame.locator('body').innerText();
            if(/Planetworld|Audio Connections/i.test(text)) throw new Error('Supplier identity visible');
            if(errors.length) throw new Error('Browser errors: '+JSON.stringify(errors));
            await page.setViewportSize({width:1280,height:900});
            const widths=await page.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            if(widths.scrollWidth>widths.innerWidth+1) throw new Error('Desktop horizontal overflow: '+JSON.stringify(widths));
            console.log('SUPPLIER_PILOT_BROWSER_QA_PASS',JSON.stringify({roots,checkoutHidden,collagePanels,specialOrderDisclosure:true,supabaseWritesBlocked:true,audioProductsVisible:true}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Deploy exact tested branch to isolated Cloudflare Pages preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages-public --project-name=get-wired-autoworx-store --branch=supplier-pilot-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify hosted preview exact SHA and customer-facing routes
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://supplier-pilot-preview.get-wired-autoworx-store.pages.dev"
          for attempt in $(seq 1 12); do
            if curl -fsS "$BASE_URL/deployment-manifest.json" -o /tmp/gw-deployment-manifest.json && test -s /tmp/gw-deployment-manifest.json; then break; fi
            sleep 5
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest=json.loads(Path('/tmp/gw-deployment-manifest.json').read_text())
          expected=os.environ['GITHUB_SHA']
          assert manifest.get('sha')==expected, f"Hosted preview SHA mismatch: {manifest.get('sha')} != {expected}"
          print('HOSTED_PREVIEW_EXACT_SHA_PASS', manifest)
          PY
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const base='https://supplier-pilot-preview.get-wired-autoworx-store.pages.dev';
            await page.goto(base+'/owner-preview.html',{waitUntil:'domcontentloaded'});
            if(!(await page.locator('.preview-banner').innerText()).includes('NON-PRODUCTION')) throw new Error('Hosted preview warning missing');
            const frame=page.frameLocator('#store');
            await frame.locator('#categoryGrid > .catWrap:not(.findPartCategoryTile)').first().waitFor({state:'visible',timeout:30000});
            const roots=await frame.locator('#categoryGrid > .catWrap:not(.findPartCategoryTile) > .catBtn > .catContent > b').allTextContents();
            const expected=['Car Audio / Home Entertainment / Lifestyle','Auto Electrical Parts & Spares','Car Care & Accessories'];
            if(JSON.stringify(roots)!==JSON.stringify(expected)) throw new Error('Hosted roots mismatch: '+JSON.stringify(roots));
            if(await frame.locator('.audioCategoryCollage .audioCollagePanel').count()!==4) throw new Error('Hosted audio collage incomplete');
            await frame.locator('#categoryGrid > .catWrap a[href^="/preview-audio.html"]').click();
            await frame.locator('#audioSearch').waitFor({state:'visible',timeout:30000});
            const audioPath=await frame.locator('body').evaluate(el=>el.ownerDocument.location.pathname);
            if(!audioPath.endsWith('/preview-audio.html')) throw new Error('Hosted audio route mismatch: '+audioPath);
            await frame.getByRole('button',{name:'Car Audio & Video',exact:true}).click();
            await frame.locator('#products .audioProduct').first().waitFor({state:'visible',timeout:30000});
            await frame.locator('#audioSearch').fill('SSW8');
            const card=frame.locator('#products .audioProduct').first();
            await card.waitFor({state:'visible',timeout:15000});
            if(!(await card.innerText()).includes('Special-order item — price is subject to currency exchange rates and supplier confirmation.')) throw new Error('Hosted special-order price disclosure missing');
            if(errors.length) throw new Error('Hosted browser errors: '+JSON.stringify(errors));
            console.log('HOSTED_SUPPLIER_PREVIEW_QA_PASS',JSON.stringify({roots,collagePanels:4,specialOrderDisclosure:true}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
