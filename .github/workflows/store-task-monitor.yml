name: Get Wired Read-Only Task Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "45 6 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: get-wired-readonly-task-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture workflow and evidence status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const repo = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              ...repo, per_page: 100
            });
            const latest = new Map();
            for (const run of data.workflow_runs) {
              if (!latest.has(run.name)) latest.set(run.name, {
                name: run.name,
                id: run.id,
                status: run.status,
                conclusion: run.conclusion,
                event: run.event,
                created_at: run.created_at,
                html_url: run.html_url,
                head_sha: run.head_sha
              });
            }
            const expectedEvidence = [
              'staging/source-extracts/PRICE_RECONCILIATION_EFFECTIVE_STATUS_2026-10-14.csv',
              'staging/source-extracts/CATEGORY_QUEUE_EXACT_SKU_SOURCE_OCR_CROSSCHECK_2026-10-14.csv',
              'staging/source-extracts/CATEGORY_REVIEW_CANDIDATE_SUGGESTIONS_2026-10-14.csv'
            ];
            const evidenceRef = 'audit/buyer-guide-extraction';
            const evidence = [];
            for (const path of expectedEvidence) {
              try {
                const r = await github.rest.repos.getContent({ ...repo, path, ref: evidenceRef });
                evidence.push({ path, found: true, type: r.data.type, sha: r.data.sha });
              } catch (e) {
                evidence.push({ path, found: false, status: e.status || null });
              }
            }
            const report = {
              generated_at: new Date().toISOString(),
              repository: repo,
              monitor_run_id: process.env.GITHUB_RUN_ID,
              monitor_commit: context.sha,
              note: 'Read-only scheduled monitor; does not change production data or restart/deploy workflows.',
              latest_workflow_runs: [...latest.values()],
              expected_evidence_ref: evidenceRef,
              expected_source_evidence: evidence,
              missing_expected_evidence_count: evidence.filter(x => !x.found).length
            };
            fs.mkdirSync('monitor-evidence', { recursive: true });
            fs.writeFileSync('monitor-evidence/status.json', JSON.stringify(report, null, 2));
            fs.writeFileSync('monitor-evidence/status.md',
              '# Get Wired Read-Only Task Monitor\n\n' +
              '- Generated: ' + report.generated_at + '\n' +
              '- Repository: ' + repo.owner + '/' + repo.repo + '\n' +
              '- Monitor run: ' + report.monitor_run_id + '\n' +
              '- Missing expected source evidence files: ' + report.missing_expected_evidence_count + '\n\n' +
              '## Latest workflow runs\n' +
              [...latest.values()].map(x => '- [' + x.name + '](' + x.html_url + '): ' + x.status + ' / ' + (x.conclusion || 'no conclusion yet') + ', run ' + x.id + ', commit ' + x.head_sha).join('\n') +
              '\n\n## Expected source evidence\n' +
              evidence.map(x => '- ' + x.path + ': ' + (x.found ? 'FOUND (' + x.sha + ')' : 'MISSING/NOT ACCESSIBLE (HTTP ' + x.status + ')')).join('\n') +
              '\n\nThis monitor is scheduled/on-demand, not a continuously running worker. Missing evidence is a blocker, not permission to reconstruct data from guesses.\n');
      - name: Upload monitoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: get-wired-task-monitor-${{ github.run_id }}
          path: monitor-evidence/
          if-no-files-found: error
          retention-days: 14
