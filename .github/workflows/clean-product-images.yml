name: Clean Product Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with latest main before generating images
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Extract source catalogue
        run: |
          rm -rf /tmp/store-src
          mkdir -p /tmp/store-src
          unzip -q Get_Wired_AutoWorx_STORE_WITH_WATERMARKED_PRODUCT_IMAGES.zip -d /tmp/store-src
          mkdir -p assets/products

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --quiet pillow opencv-python-headless pytesseract

      - name: Create clean ecommerce product images
        run: |
          python <<'PY'
          from pathlib import Path
          import cv2, numpy as np, pytesseract
          from PIL import Image, ImageChops, ImageOps, ImageEnhance, ImageFilter, ImageDraw, ImageFont

          root = Path('/tmp/store-src')
          out = Path('assets/products')
          out.mkdir(parents=True, exist_ok=True)
          exts = {'.jpg','.jpeg','.png','.webp','.bmp'}
          files = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in exts]
          product_files = [p for p in files if 'product' in str(p).lower()]
          files = product_files or files

          def trim_border(im):
              im = im.convert('RGB')
              w, h = im.size
              arr = np.array(im)
              edge = np.concatenate([arr[:max(1,h//40)], arr[-max(1,h//40):], arr[:,:max(1,w//40)], arr[:,-max(1,w//40):]], axis=None)
              bg = tuple(np.median(edge.reshape(-1,3), axis=0).astype(np.uint8))
              bgim = Image.new('RGB', im.size, bg)
              diff = ImageOps.grayscale(ImageChops.difference(im, bgim))
              mask = diff.point(lambda x: 255 if x > 18 else 0)
              bbox = mask.getbbox()
              if not bbox: return im
              x0,y0,x1,y1 = bbox
              pad = max(8, int(min(w,h)*0.02))
              x0=max(0,x0-pad); y0=max(0,y0-pad); x1=min(w,x1+pad); y1=min(h,y1+pad)
              if x0 <= 3 and y0 <= 3 and x1 >= w-3 and y1 >= h-3: return im
              return im.crop((x0,y0,x1,y1))

          def remove_outer_text(im):
              arr = cv2.cvtColor(np.array(im), cv2.COLOR_RGB2BGR)
              h,w = arr.shape[:2]
              if min(h,w) < 220: return im
              mask = np.zeros((h,w), np.uint8)
              data = pytesseract.image_to_data(arr, output_type=pytesseract.Output.DICT, config='--psm 11')
              for i,t in enumerate(data['text']):
                  t=(t or '').strip()
                  try: conf=float(data['conf'][i])
                  except: conf=-1
                  if not t or conf < 55: continue
                  x,y,ww,hh=[int(data[k][i]) for k in ('left','top','width','height')]
                  area=ww*hh
                  if ww<6 or hh<5 or area > .025*w*h: continue
                  outside = x < .16*w or x+ww > .84*w or y < .12*h or y+hh > .88*h
                  if outside:
                      cv2.rectangle(mask,(max(0,x-4),max(0,y-4)),(min(w,x+ww+4),min(h,y+hh+4)),255,-1)
              if mask.max()==0: return im
              mask=cv2.dilate(mask,np.ones((3,3),np.uint8),iterations=1)
              cleaned=cv2.inpaint(arr,mask,3,cv2.INPAINT_TELEA)
              return Image.fromarray(cv2.cvtColor(cleaned,cv2.COLOR_BGR2RGB))

          def prepare(im):
              im = trim_border(im)
              im = remove_outer_text(im)
              im = ImageOps.exif_transpose(im).convert('RGB')
              im = ImageOps.autocontrast(im, cutoff=0.5)
              im = ImageEnhance.Color(im).enhance(1.04)
              im = ImageEnhance.Contrast(im).enhance(1.03)
              target = 1000
              scale = target / max(1, min(im.size))
              if scale > 1.0:
                  im = im.resize((int(im.width*scale), int(im.height*scale)), Image.Resampling.LANCZOS)
              im.thumbnail((1100,1100), Image.Resampling.LANCZOS)
              im = im.filter(ImageFilter.UnsharpMask(radius=1.2, percent=115, threshold=3))
              canvas = Image.new('RGB',(1600,1600),(248,248,248))
              im.thumbnail((1480,1480), Image.Resampling.LANCZOS)
              x=(1600-im.width)//2; y=(1600-im.height)//2
              canvas.paste(im,(x,y))

              # Permanent Get Wired AutoWorx ownership watermark.
              overlay = Image.new('RGBA', canvas.size, (0,0,0,0))
              draw = ImageDraw.Draw(overlay)
              try:
                  font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 42)
              except Exception:
                  font = ImageFont.load_default()
              text = 'GET WIRED AUTOWORX'
              bbox = draw.textbbox((0,0), text, font=font)
              tw, th = bbox[2]-bbox[0], bbox[3]-bbox[1]
              tile = Image.new('RGBA',(tw+90,th+60),(0,0,0,0))
              td = ImageDraw.Draw(tile)
              td.rounded_rectangle((2,2,tile.width-3,tile.height-3), radius=18,
                                   fill=(255,255,255,42), outline=(20,35,70,105), width=2)
              td.text(((tile.width-tw)//2,(tile.height-th)//2-2), text, font=font,
                      fill=(20,35,70,105), stroke_width=1, stroke_fill=(255,255,255,75))
              tile = tile.rotate(18, expand=True, resample=Image.Resampling.BICUBIC)
              tx=(1600-tile.width)//2; ty=(1600-tile.height)//2
              overlay.alpha_composite(tile,(tx,ty))
              corner_font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 24)
              corner='GET WIRED AUTOWORX'
              cb=draw.textbbox((0,0),corner,font=corner_font)
              cw,ch=cb[2]-cb[0],cb[3]-cb[1]
              draw.rounded_rectangle((1600-cw-44,1600-ch-34,1598,1598),radius=10,
                                     fill=(255,255,255,155),outline=(20,35,70,190),width=2)
              draw.text((1600-cw-22,1600-ch-22),corner,font=corner_font,
                        fill=(20,35,70,220),anchor='mm')
              return Image.alpha_composite(canvas.convert('RGBA'), overlay).convert('RGB')

          count=0
          for src in files:
              dst=out/(src.stem+'.jpg')
              try:
                  result=prepare(Image.open(src))
                  result.save(dst,'JPEG',quality=98,subsampling=0,optimize=True,progressive=True,dpi=(300,300))
                  count+=1
              except Exception as e:
                  print('SKIP',src,e)
          print('CLEANED_IMAGES=',count)\n          print('OUTPUT_SIZE=1600x1600 JPEG quality=98 4:4:4 progressive 300dpi')
          if count < 700:
              raise SystemExit(f'Only cleaned {count} images; refusing to publish an incomplete catalogue.')
          PY

      - name: Commit cleaned catalogue images
        run: |
          git config user.name "Get Wired AutoWorx Image Cleaner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git add assets/products
          if git diff --cached --quiet; then
            echo "No image changes to commit"
            exit 0
          fi
          git commit -m "Improve ecommerce product image presentation"
          git push origin HEAD:main

# Produces clean, consistent 1600x1600 ecommerce images with Get Wired AutoWorx watermark. No Netlify or Cloudflare credits are used.
# Continuation fix verified 16 Sep 2026: synchronize with current main before image generation/push.
# Relaunch trigger: 16 Sep 2026 continuation after prior image-cleanup run failed at push.
# 16 Sep 2026: manual continuation trigger issued from verified current main.
\n# 2 Oct 2026: upgraded output to 1600x1600 JPEG quality 98, 4:4:4, progressive, 300dpi, with Get Wired AutoWorx watermark on every generated image.\n