name: Clean Product Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source catalogue
        run: |
          rm -rf /tmp/store-src
          mkdir -p /tmp/store-src
          unzip -q Get_Wired_AutoWorx_STORE_WITH_WATERMARKED_PRODUCT_IMAGES.zip -d /tmp/store-src
          mkdir -p assets/products

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --quiet pillow opencv-python-headless pytesseract

      - name: Create clean ecommerce product images
        run: |
          python <<'PY'
          from pathlib import Path
          import cv2, numpy as np, pytesseract
          from PIL import Image, ImageChops, ImageOps, ImageEnhance, ImageFilter

          root = Path('/tmp/store-src')
          out = Path('assets/products')
          out.mkdir(parents=True, exist_ok=True)
          exts = {'.jpg','.jpeg','.png','.webp','.bmp'}
          files = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in exts]
          product_files = [p for p in files if 'product' in str(p).lower()]
          files = product_files or files

          def trim_border(im):
              im = im.convert('RGB')
              w, h = im.size
              arr = np.array(im)
              edge = np.concatenate([arr[:max(1,h//40)], arr[-max(1,h//40):], arr[:,:max(1,w//40)], arr[:,-max(1,w//40):]], axis=None)
              bg = tuple(np.median(edge.reshape(-1,3), axis=0).astype(np.uint8))
              bgim = Image.new('RGB', im.size, bg)
              diff = ImageOps.grayscale(ImageChops.difference(im, bgim))
              mask = diff.point(lambda x: 255 if x > 18 else 0)
              bbox = mask.getbbox()
              if not bbox: return im
              x0,y0,x1,y1 = bbox
              pad = max(8, int(min(w,h)*0.02))
              x0=max(0,x0-pad); y0=max(0,y0-pad); x1=min(w,x1+pad); y1=min(h,y1+pad)
              if x0 <= 3 and y0 <= 3 and x1 >= w-3 and y1 >= h-3: return im
              return im.crop((x0,y0,x1,y1))

          def remove_outer_text(im):
              arr = cv2.cvtColor(np.array(im), cv2.COLOR_RGB2BGR)
              h,w = arr.shape[:2]
              if min(h,w) < 220: return im
              mask = np.zeros((h,w), np.uint8)
              data = pytesseract.image_to_data(arr, output_type=pytesseract.Output.DICT, config='--psm 11')
              for i,t in enumerate(data['text']):
                  t=(t or '').strip()
                  try: conf=float(data['conf'][i])
                  except: conf=-1
                  if not t or conf < 55: continue
                  x,y,ww,hh=[int(data[k][i]) for k in ('left','top','width','height')]
                  area=ww*hh
                  if ww<6 or hh<5 or area > .025*w*h: continue
                  outside = x < .16*w or x+ww > .84*w or y < .12*h or y+hh > .88*h
                  if outside:
                      cv2.rectangle(mask,(max(0,x-4),max(0,y-4)),(min(w,x+ww+4),min(h,y+hh+4)),255,-1)
              if mask.max()==0: return im
              mask=cv2.dilate(mask,np.ones((3,3),np.uint8),iterations=1)
              cleaned=cv2.inpaint(arr,mask,3,cv2.INPAINT_TELEA)
              return Image.fromarray(cv2.cvtColor(cleaned,cv2.COLOR_BGR2RGB))

          def prepare(im):
              im = trim_border(im)
              im = remove_outer_text(im)
              im = ImageOps.exif_transpose(im).convert('RGB')
              im = ImageOps.autocontrast(im, cutoff=0.5)
              im = ImageEnhance.Color(im).enhance(1.04)
              im = ImageEnhance.Contrast(im).enhance(1.03)
              target = 1000
              scale = target / max(1, min(im.size))
              if scale > 1.0:
                  im = im.resize((int(im.width*scale), int(im.height*scale)), Image.Resampling.LANCZOS)
              im.thumbnail((1100,1100), Image.Resampling.LANCZOS)
              im = im.filter(ImageFilter.UnsharpMask(radius=1.2, percent=115, threshold=3))
              canvas = Image.new('RGB',(1200,1200),(248,248,248))
              im.thumbnail((1080,1080), Image.Resampling.LANCZOS)
              x=(1200-im.width)//2; y=(1200-im.height)//2
              canvas.paste(im,(x,y))
              return canvas

          count=0
          for src in files:
              dst=out/(src.stem+'.jpg')
              try:
                  result=prepare(Image.open(src))
                  result.save(dst,'JPEG',quality=95,optimize=True,progressive=True)
                  count+=1
              except Exception as e:
                  print('SKIP',src,e)
          print('CLEANED_IMAGES=',count)
          if count < 700:
              raise SystemExit(f'Only cleaned {count} images; refusing to publish an incomplete catalogue.')
          PY

      - name: Commit cleaned catalogue images
        run: |
          git config user.name "Get Wired AutoWorx Image Cleaner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add assets/products
          if git diff --cached --quiet; then
            echo "No image changes to commit"
            exit 0
          fi
          git commit -m "Improve ecommerce product image presentation"
          git push origin HEAD:main

# Produces clean, consistent 1200x1200 ecommerce images without adding a watermark. No Netlify or Cloudflare credits are used.
