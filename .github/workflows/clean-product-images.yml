name: Clean Product Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source catalogue
        run: |
          rm -rf /tmp/store-src
          mkdir -p /tmp/store-src
          unzip -q Get_Wired_AutoWorx_STORE_WITH_WATERMARKED_PRODUCT_IMAGES.zip -d /tmp/store-src
          mkdir -p assets/products

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --quiet pillow opencv-python-headless pytesseract

      - name: Clean catalogue images and add restrained watermark
        run: |
          python <<'PY'
          from pathlib import Path
          import cv2, numpy as np, pytesseract
          from PIL import Image, ImageChops, ImageOps, ImageDraw, ImageFont

          root=Path('/tmp/store-src'); out=Path('assets/products'); out.mkdir(parents=True,exist_ok=True)
          exts={'.jpg','.jpeg','.png','.webp','.bmp'}
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in exts]
          files=[p for p in files if 'product' in str(p).lower()] or files

          def trim_border(im):
              rgb=im.convert('RGB'); w,h=rgb.size
              bg=Image.new('RGB',rgb.size,rgb.getpixel((0,0)))
              diff=ImageOps.grayscale(ImageChops.difference(rgb,bg))
              bbox=diff.point(lambda x:255 if x>12 else 0).getbbox()
              if not bbox:return rgb
              x0,y0,x1,y1=bbox; pad=max(3,int(min(w,h)*.008))
              x0=max(0,x0-pad); y0=max(0,y0-pad); x1=min(w,x1+pad); y1=min(h,y1+pad)
              return rgb.crop((x0,y0,x1,y1)) if (x0>0 or y0>0 or x1<w or y1<h) else rgb

          def ocr_boxes(arr,angle):
              h,w=arr.shape[:2]
              if angle:
                  c=(w/2,h/2); M=cv2.getRotationMatrix2D(c,angle,1.0)
                  rot=cv2.warpAffine(arr,M,(w,h),borderMode=cv2.BORDER_REPLICATE)
              else: rot=arr; M=None
              data=pytesseract.image_to_data(rot,output_type=pytesseract.Output.DICT,config='--psm 11')
              boxes=[]
              for i,t in enumerate(data['text']):
                  t=(t or '').strip()
                  try: conf=float(data['conf'][i])
                  except: conf=-1
                  if not t or conf<42: continue
                  x,y,ww,hh=[int(data[k][i]) for k in ('left','top','width','height')]
                  if ww<3 or hh<3 or ww*hh>.08*w*h: continue
                  pts=np.float32([[x,y],[x+ww,y],[x+ww,y+hh],[x,y+hh]]).reshape(-1,1,2)
                  if M is not None:
                      Mi=cv2.invertAffineTransform(M); pts=cv2.transform(pts,Mi)
                  pts=np.int32(pts.reshape(-1,2)); boxes.append(pts)
              return boxes

          def clean_text(im):
              arr=cv2.cvtColor(np.array(im),cv2.COLOR_RGB2BGR); h,w=arr.shape[:2]
              if min(h,w)<160:return im
              mask=np.zeros((h,w),np.uint8)
              # Horizontal supplier text near the outside edges.
              for pts in ocr_boxes(arr,0):
                  x0,y0=pts.min(axis=0); x1,y1=pts.max(axis=0)
                  if x0<.20*w or x1>.80*w or y0<.18*h or y1>.82*h:
                      cv2.fillPoly(mask,[pts],255)
              # Diagonal/rotated watermarks: only remove text detected away from the central product area.
              for ang in (-45,-30,-20,20,30,45):
                  for pts in ocr_boxes(arr,ang):
                      x0,y0=pts.min(axis=0); x1,y1=pts.max(axis=0)
                      cx=(x0+x1)/2; cy=(y0+y1)/2
                      if cx<.90*w and cy<.90*h and not (.25*w<cx<.75*w and .25*h<cy<.75*h):
                          cv2.fillPoly(mask,[pts],255)
              if mask.max()==0:return im
              mask=cv2.dilate(mask,np.ones((5,5),np.uint8),iterations=1)
              cleaned=cv2.inpaint(arr,mask,5,cv2.INPAINT_TELEA)
              return Image.fromarray(cv2.cvtColor(cleaned,cv2.COLOR_BGR2RGB))

          def watermark(im):
              im=im.convert('RGBA'); w,h=im.size
              layer=Image.new('RGBA',im.size,(0,0,0,0)); d=ImageDraw.Draw(layer)
              text='GET WIRED AUTOWORX'
              size=max(12,int(min(w,h)*.025))
              try: font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',size)
              except: font=ImageFont.load_default()
              box=d.textbbox((0,0),text,font=font); tw=box[2]-box[0]; th=box[3]-box[1]
              x=max(8,w-tw-16); y=max(8,h-th-12)
              d.text((x+1,y+1),text,font=font,fill=(0,0,0,75))
              d.text((x,y),text,font=font,fill=(255,255,255,115))
              return Image.alpha_composite(im,layer).convert('RGB')

          count=0
          for src in files:
              dst=out/(src.stem+'.jpg')
              try:
                  im=Image.open(src).convert('RGB')
                  im=trim_border(im)
                  im=clean_text(im)
                  im.thumbnail((1600,1600),Image.Resampling.LANCZOS)
                  im=watermark(im)
                  im.save(dst,'JPEG',quality=94,optimize=True)
                  count+=1
              except Exception as e: print('SKIP',src,e)
          print('CLEANED_IMAGES=',count)
          if count<700: raise SystemExit(f'Only cleaned {count} images; refusing to publish an incomplete catalogue.')
          PY

      - name: Commit cleaned catalogue images
        run: |
          git config user.name "Get Wired AutoWorx Image Cleaner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products
          git commit -m "Improve catalogue image cleanup and watermark" || echo "No image changes to commit"
          git push

# Full-catalogue cleanup: removes detected supplier overlays/borders, preserves product content, and adds a restrained Get Wired watermark.
