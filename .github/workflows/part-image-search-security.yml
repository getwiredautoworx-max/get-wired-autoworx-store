name: Part Image Search Security Tests

on:
  push:
    branches:
      - "fix/part-image-search-durable-abuse-controls-2026-11-02"
    paths:
      - "supabase/functions/part-image-search/**"
      - "supabase/migrations/*part_image_search_rate_limit.sql"
      - "tests/part-image-search-security.test.mjs"
      - "tests/part-image-search-rate-limit.integration.sql"
      - "tests/part-image-search-rate-limit-concurrency.sh"
      - ".github/workflows/part-image-search-security.yml"
  pull_request:
    paths:
      - "supabase/functions/part-image-search/**"
      - "supabase/migrations/*part_image_search_rate_limit.sql"
      - "tests/part-image-search-security.test.mjs"
      - "tests/part-image-search-rate-limit.integration.sql"
      - "tests/part-image-search-rate-limit-concurrency.sh"
      - ".github/workflows/part-image-search-security.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-default-type=module --test tests/part-image-search-security.test.mjs
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare isolated database roles and private schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA gw_private;
          GRANT USAGE ON SCHEMA gw_private TO service_role;
          SQL
      - name: Apply migration to disposable CI PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102160000_part_image_search_rate_limit.sql
      - name: Verify RPC permissions, thresholds, expiry and cleanup
        run: psql -v ON_ERROR_STOP=1 -f tests/part-image-search-rate-limit.integration.sql
      - name: Verify atomic concurrent request cap
        run: bash tests/part-image-search-rate-limit-concurrency.sh
