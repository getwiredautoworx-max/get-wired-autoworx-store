name: Build and Validate Get Wired AutoWorx Owner APK
# Triggered by repository push for APK validation recovery.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-owner-app/**'
      - '.github/workflows/build-owner-apk.yml'
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle storefront into Owner APK test assets
        shell: bash
        run: |
          rm -rf android-owner-app/app/src/main/assets/store
          mkdir -p android-owner-app/app/src/main/assets/store
          cp store.html index-new.html checkout-v2.html index.html admin.html category-navigation.js android-owner-app/app/src/main/assets/store/
          cp -R assets android-owner-app/app/src/main/assets/store/assets
      - name: Build debug APK
        working-directory: android-owner-app
        run: gradle :app:assembleDebug
      - name: Preserve built Owner APK artifact before emulator validation
        uses: actions/upload-artifact@v4
        with:
          name: get-wired-autoworx-owner-debug-apk
          path: android-owner-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Start Android emulator and validate APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -wipe-data
          disable-animations: true
          script: |
            set -e
            adb wait-for-device
            for i in $(seq 1 12); do
              if adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'; then
                break
              fi
              sleep 5
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell settings put global package_verifier_enable 0 || true
            sleep 15

            APK="android-owner-app/app/build/outputs/apk/debug/app-debug.apk"
            installed=0
            for attempt in 1 2 3 4; do
              echo "Installing APK, attempt $attempt"
              adb shell cmd package list packages >/dev/null 2>&1 || true
              adb shell cmd package bg-dexopt-job >/dev/null 2>&1 || true
              rm -f /tmp/app-debug.apk
              if adb push "$APK" /data/local/tmp/app-debug.apk && adb shell pm install -r /data/local/tmp/app-debug.apk; then
                installed=1
                break
              fi
              echo "APK install failed; restarting adb/package service and retrying..."
              adb kill-server || true
              sleep 3
              adb start-server || true
              adb wait-for-device
              sleep 10
            done
            test "$installed" = "1"

            adb shell am start -n za.co.getwiredautoworx.owner/.MainActivity
            sleep 8
            adb shell dumpsys activity activities | grep -q 'za.co.getwiredautoworx.owner/.MainActivity'
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/owner-window.xml >/dev/null
            grep -q 'GET WIRED AUTOWORX' /tmp/owner-window.xml
            grep -q 'Owner Login' /tmp/owner-window.xml

            adb shell am force-stop za.co.getwiredautoworx.owner
            adb shell am start -n za.co.getwiredautoworx.owner/.MainActivity --es screen store
            sleep 10
            adb shell uiautomator dump /sdcard/store-window.xml >/dev/null
            adb pull /sdcard/store-window.xml /tmp/store-window.xml >/dev/null
            grep -q 'CHECKOUT' /tmp/store-window.xml

            adb shell am force-stop za.co.getwiredautoworx.owner
            adb shell am start -n za.co.getwiredautoworx.owner/.MainActivity --es screen checkout
            sleep 5
            adb shell uiautomator dump /sdcard/checkout-window.xml >/dev/null
            adb pull /sdcard/checkout-window.xml /tmp/checkout-window.xml >/dev/null
            grep -qi 'delivery\|pickup\|checkout' /tmp/checkout-window.xml

