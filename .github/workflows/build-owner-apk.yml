name: Build and Validate Get Wired AutoWorx Owner APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-owner-app/**'
      - '.github/workflows/build-owner-apk.yml'
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-owner-app
        run: gradle :app:assembleDebug
      - name: Start Android emulator and validate APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r android-owner-app/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n za.co.getwiredautoworx.owner/.MainActivity
            sleep 8
            adb shell dumpsys activity activities | grep -q 'za.co.getwiredautoworx.owner/.MainActivity'
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/owner-window.xml >/dev/null
            grep -q 'GET WIRED AUTOWORX' /tmp/owner-window.xml
            grep -q 'Owner Login' /tmp/owner-window.xml
      - uses: actions/upload-artifact@v4
        with:
          name: get-wired-autoworx-owner-debug-apk
          path: android-owner-app/app/build/outputs/apk/debug/app-debug.apk
