name: Build and Validate Get Wired AutoWorx Owner APK
# Triggered by repository push for APK validation recovery.
# Validation refresh: 7 Oct 2026
# Emulator recovery rerun: 7 Oct 2026
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-owner-app/**'
      - '.github/workflows/build-owner-apk.yml'
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Confirm cloud storefront mode
        shell: bash
        run: |
          grep -q 'https://www.getwiredauto.co.za/' android-owner-app/app/src/main/java/za/co/getwiredautoworx/owner/MainActivity.java
          echo 'Storefront will be loaded from the live cloud-hosted domain; catalogue images are not bundled in the APK.'
      - name: Build debug install-test APK
        working-directory: android-owner-app
        run: gradle :app:assembleDebug
      - name: Enforce lightweight APK size budget
        shell: bash
        run: |
          APK=android-owner-app/app/build/outputs/apk/debug/app-debug.apk
          BYTES=$(stat -c%s "$APK")
          echo "Owner APK size: $((BYTES / 1024 / 1024)) MiB ($BYTES bytes)"
          test "$BYTES" -le 15728640 || { echo 'APK exceeds 15 MiB budget; do not publish this artifact.'; exit 1; }
      - name: Preserve built Owner APK artifact before emulator validation
        uses: actions/upload-artifact@v4
        with:
          name: get-wired-autoworx-owner-install-test-apk
          path: android-owner-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Start Android emulator and validate APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save
          disable-animations: true
          script: |
            adb wait-for-device
            adb start-server
            adb devices
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb push android-owner-app/app/build/outputs/apk/debug/app-debug.apk /data/local/tmp/get-wired-owner-test.apk
            adb shell pm install -r /data/local/tmp/get-wired-owner-test.apk
            adb shell monkey -p za.co.getwiredautoworx.owner.test 1
            sleep 8
            adb shell dumpsys activity activities | grep -q za.co.getwiredautoworx.owner.test
            echo "APK install and launch check passed"
