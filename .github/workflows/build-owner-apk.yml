name: Build Get Wired AutoWorx Owner APK
# Execution marker: 2026-09-28
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-owner-app/**'
      - '.github/workflows/build-owner-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-owner-app
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: get-wired-autoworx-owner-debug-apk
          path: android-owner-app/app/build/outputs/apk/debug/app-debug.apk
