name: Build and Validate Get Wired AutoWorx Owner APK
# Triggered by repository push for APK validation recovery.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-owner-app/**'
      - '.github/workflows/build-owner-apk.yml'
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle storefront into Owner APK test assets
        shell: bash
        run: |
          rm -rf android-owner-app/app/src/main/assets/store
          mkdir -p android-owner-app/app/src/main/assets/store
          cp store.html index-new.html checkout-v2.html index.html admin.html category-navigation.js android-owner-app/app/src/main/assets/store/
          cp -R assets android-owner-app/app/src/main/assets/store/assets
      - name: Build debug install-test APK
        working-directory: android-owner-app
        run: gradle :app:assembleDebug
      - name: Preserve built Owner APK artifact before emulator validation
        uses: actions/upload-artifact@v4
        with:
          name: get-wired-autoworx-owner-install-test-apk
          path: android-owner-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Start Android emulator and validate APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          startup-timeout: 240
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb wait-for-device
            adb start-server
            adb devices
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb push android-owner-app/app/build/outputs/apk/debug/app-debug.apk /data/local/tmp/get-wired-owner-test.apk
            adb shell pm install -r /data/local/tmp/get-wired-owner-test.apk
            adb shell monkey -p za.co.getwiredautoworx.owner.test 1
            sleep 8
            adb shell dumpsys activity activities | grep -q za.co.getwiredautoworx.owner.test
            echo "APK install and launch check passed"
