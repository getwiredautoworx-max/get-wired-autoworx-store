name: Build and Validate Get Wired AutoWorx Owner APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-owner-app/**'
      - '.github/workflows/build-owner-apk.yml'
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assert clean-install package and cloud mode
        shell: bash
        run: |
          grep -q "applicationId 'com.getwired.autoworx.owner'" android-owner-app/app/build.gradle
          ! grep -q 'applicationIdSuffix' android-owner-app/app/build.gradle
          grep -q 'https://www.getwiredauto.co.za/' android-owner-app/app/src/main/java/za/co/getwiredautoworx/owner/MainActivity.java
          echo 'Using a fresh owner-specific application ID to avoid collisions with earlier test/Expo packages.'
      - name: Build lightweight install-test APK
        working-directory: android-owner-app
        run: gradle :app:assembleDebug
      - name: Verify APK package metadata and size
        shell: bash
        run: |
          APK=android-owner-app/app/build/outputs/apk/debug/app-debug.apk
          BYTES=$(stat -c%s "$APK")
          echo "Owner APK size: $((BYTES / 1024)) KiB ($BYTES bytes)"
          test "$BYTES" -le 15728640 || { echo 'APK exceeds 15 MiB budget.'; exit 1; }
          AAPT=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.getwired.autoworx.owner'"
      - name: Preserve built APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: get-wired-autoworx-owner-install-test-apk
          path: android-owner-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install and launch on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r android-owner-app/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.getwired.autoworx.owner
            adb shell monkey -p com.getwired.autoworx.owner 1
            sleep 8
            adb shell dumpsys activity activities | grep -q com.getwired.autoworx.owner
            echo "Android 13 clean-install and launch check passed"
