name: Public SKU Exposure Audit
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.json'
      - 'scripts/public-sku-audit.py'
      - '.github/workflows/public-sku-exposure-audit.yml'
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.json'
      - 'scripts/public-sku-audit.py'
      - '.github/workflows/public-sku-exposure-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit customer-facing source
        run: python3 scripts/public-sku-audit.py
