name: Owner Preview — Exact SHA Deploy and Browser QA

# Manual-only to avoid automatic Cloudflare credit use. Run only after explicit owner approval.
on:
  push:
    branches:
      - review/asc-trailer-towing-owner-preview-2026-11-15
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: owner-preview-single-active
  cancel-in-progress: true

jobs:
  deploy-staging-preview:
    if: github.ref == 'refs/heads/review/asc-trailer-towing-owner-preview-2026-11-15' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/integration/owner-preview-single-task-2026-11-05')
    name: Build and deploy the single active owner preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js for exact-head regression checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build customer-only Pages package with isolated review routes
        env:
          GW_INCLUDE_PREVIEW_ROUTES: "1"
          CF_PAGES_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          python scripts/build-cloudflare-pages-public.py
          test -f pages-public/owner-preview.html
          test -f pages-public/preview-audio.html
          test -f pages-public/preview-category.html
          test -f pages-public/preview-audio-brand.html
          test -f pages-public/preview-audio-products.html
          test -f pages-public/preview-asc-trailer-towing.html
          test -f pages-public/assets/asc-trailer-towing-owner-preview.json
          python3 -c 'import json; d=json.load(open("pages-public/assets/asc-trailer-towing-owner-preview.json")); assert len(d["records"]) == 165; assert all(r.get("price") is None and r.get("stock_quantity") == 0 for r in d["records"]); assert all("supplierCode" not in r and "sku" not in r for r in d["records"])'
          echo "GW_PR208_ASC_TRAILER_TOWING_PREVIEW_PACKAGE_PASS"
          echo "DEPLOYED_SOURCE_SHA=$(git rev-parse HEAD)"

      - name: Set up Node.js for exact-head regression checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact-head catalogue, category, package and SKU invariants
        run: |
          set -euo pipefail
          node tests/audio-catalogue-preview.test.cjs
          node tests/three-category-storefront-structure.test.cjs
          python3 scripts/public-sku-audit.py
          echo "GW_EXACT_HEAD_REGRESSION_AND_SKU_AUDIT_PASS"
      - name: Deploy to dedicated non-production Cloudflare Pages branch
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages-public --project-name=get-wired-autoworx-store --branch=owner-preview --commit-hash=${{ github.event.pull_request.head.sha || github.sha }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the exact deployed SHA and reject stale aliases
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          aliases=(
            "https://owner-preview.get-wired-autoworx-store.pages.dev"
          )
          matched=""
          for attempt in $(seq 1 24); do
            for base in "${aliases[@]}"; do
              body="$(curl -fsS --max-time 5 "$base/qa-build-result.json" 2>/dev/null || true)"
              if [ -n "$body" ] && printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("result")=="PASS" and d.get("preview_only") is True and d.get("commit")==sys.argv[1] else 1)' "$EXPECTED_SHA"; then
                matched="$base"
                break
              fi
            done
            [ -n "$matched" ] && break
            sleep 5
          done
          if [ -z "$matched" ]; then
            echo "No known staging alias published the exact triggering SHA $EXPECTED_SHA"
            exit 1
          fi
          echo "GW_EXACT_SHA_PREVIEW_URL=$matched" >> "$GITHUB_ENV"
          echo "GW_EXACT_SHA_PREVIEW_PASS url=$matched sha=$EXPECTED_SHA"
      - name: Install Playwright Chromium for hosted preview checks
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Verify deployed owner preview on phone and desktop viewports
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const errors=[];
            try {
              const page = await browser.newPage({viewport:{width:390,height:844}});
              page.on('pageerror', e => errors.push(String(e)));

              // Confirm the non-production owner shell is published.
              await page.goto(process.env.GW_EXACT_SHA_PREVIEW_URL+'/owner-preview.html',{waitUntil:'domcontentloaded'});
              if(!(await page.locator('.preview-banner').innerText()).includes('NON-PRODUCTION')) throw new Error('Non-production preview banner missing');
              if(await page.locator('#store').count()!==1) throw new Error('Owner preview storefront frame missing');

              // Verify the separate ASC root and its seven child categories.
              await page.goto(process.env.GW_EXACT_SHA_PREVIEW_URL+'/preview-category.html?id=a1000000-0000-4000-8000-000000000000',{waitUntil:'domcontentloaded'});
              await page.locator('#grid > .card').first().waitFor({state:'visible',timeout:30000});
              const subcategories=(await page.locator('#grid > .card h2').allTextContents()).map(x=>x.trim()).sort();
              const expected=['Accessories','Adhesive Tapes','Canopy Spares','Lamps','Measuring Tools','Towing','Trailer'].sort();
              if(JSON.stringify(subcategories)!==JSON.stringify(expected)) throw new Error('ASC root subcategories mismatch: '+JSON.stringify(subcategories));
              const trailer=page.locator('#grid > .card').filter({hasText:'Trailer'}).first();
              const trailerHref=await trailer.getAttribute('href');
              if(!trailerHref||!trailerHref.includes('preview-category.html?id=a1000000-0000-4000-8000-000000000002')) throw new Error('Trailer subcategory does not link to its owner-preview category route: '+trailerHref);
              await trailer.click();
              await page.waitForFunction(()=>location.pathname.endsWith('/preview-asc-trailer-towing.html'),{timeout:30000});
              if(new URLSearchParams(location.search).get('subcategory')!=='Trailer') throw new Error('Trailer child route did not preserve its selected subcategory');

              // Verify all 165 records, subcategory filter, POR label and responsive layout.
              await page.goto(process.env.GW_EXACT_SHA_PREVIEW_URL+'/preview-asc-trailer-towing.html',{waitUntil:'domcontentloaded'});
              await page.locator('.card').first().waitFor({state:'visible',timeout:30000});
              const total=await page.locator('.card').count();
              const summary=await page.locator('#summary').innerText();
              if(total!==165||!summary.includes('165 review-only listings')) throw new Error('ASC preview expected 165 cards; got '+total+' summary='+summary);
              const select=page.locator('#category');
              const options=await select.locator('option').evaluateAll(opts=>opts.map(o=>o.value).filter(Boolean));
              if(options.length!==7) throw new Error('Expected seven ASC filters: '+JSON.stringify(options));
              await select.selectOption('Trailer');
              const trailerCount=await page.locator('.card').count();
              if(trailerCount!==70) throw new Error('Trailer filter expected 70 records, got '+trailerCount);
              const price=await page.locator('.card .price').first().innerText();
              if(price!=='Price On Request Due to Stock Availability') throw new Error('ASC price label mismatch: '+price);
              await select.selectOption('');
              if(await page.locator('.card').count()!==165) throw new Error('Resetting the filter did not restore all 165 records');
              const mobile=await page.locator('#products').evaluate(el=>({width:Math.round(el.getBoundingClientRect().width),scroll:el.scrollWidth,client:el.clientWidth}));
              if(mobile.scroll>mobile.client+2) throw new Error('Mobile product grid horizontal overflow: '+JSON.stringify(mobile));
              await page.setViewportSize({width:1365,height:900});
              const desktop=await page.evaluate(()=>({width:document.documentElement.clientWidth,scroll:document.documentElement.scrollWidth}));
              if(desktop.scroll>desktop.width+2) throw new Error('Desktop horizontal overflow: '+JSON.stringify(desktop));
              if(errors.length) throw new Error('Hosted JavaScript errors: '+JSON.stringify(errors));
              console.log('GW_PR208_ASC_HOSTED_MOBILE_DESKTOP_QA_PASS',JSON.stringify({url:process.env.GW_EXACT_SHA_PREVIEW_URL,total,subcategories,trailerCount,price,mobile,desktop,jsErrors:errors.length}));
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
