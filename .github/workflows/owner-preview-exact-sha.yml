name: Owner Preview — Exact SHA Deploy and Browser QA

# Manual-only to avoid automatic Cloudflare credit use.
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: owner-preview-single-active
  cancel-in-progress: true

jobs:
  deploy-staging-preview:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.ref == 'integration/storefront-current-main-2026-11-09'
    name: Build and deploy the single active owner preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js for exact-head regression checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build customer-only Pages package with isolated review routes
        env:
          GW_INCLUDE_PREVIEW_ROUTES: "1"
          CF_PAGES_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          python scripts/build-cloudflare-pages-public.py
          test -f pages-public/owner-preview.html
          test -f pages-public/preview-audio.html
          test -f pages-public/preview-category.html
          test -f pages-public/preview-audio-brand.html
          test -f pages-public/preview-audio-products.html
          echo "GW_PR168_PUBLIC_PREVIEW_PACKAGE_PASS"
          echo "DEPLOYED_SOURCE_SHA=$(git rev-parse HEAD)"

      - name: Verify exact-head catalogue, category, package and SKU invariants
        run: |
          set -euo pipefail
          node tests/pricing-display-policy.test.cjs
          node tests/onenav-source-audit.test.cjs
          node tests/three-category-storefront-structure.test.cjs
          python3 scripts/public-sku-audit.py
          echo "GW_EXACT_HEAD_REGRESSION_AND_SKU_AUDIT_PASS"
      - name: Deploy to dedicated non-production Cloudflare Pages branch
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages-public --project-name=get-wired-autoworx-store --branch=owner-preview --commit-hash=${{ github.event.pull_request.head.sha || github.sha }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the exact deployed SHA and reject stale aliases
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          WRANGLER_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t command_urls < <(printf '%s' "$WRANGLER_OUTPUT" | grep -Eo 'https://[A-Za-z0-9.-]+\.get-wired-autoworx-store\.pages\.dev' | sort -u || true)
          aliases=()
          for candidate in "$DEPLOYMENT_URL" "$DEPLOYMENT_ALIAS_URL" "${command_urls[@]}" "https://owner-preview.get-wired-autoworx-store.pages.dev" "https://integration-owner-preview-si.get-wired-autoworx-store.pages.dev"; do
            if [ -n "$candidate" ]; then
              aliases+=("${candidate%/}")
            fi
          done
          matched=""
          for attempt in $(seq 1 24); do
            for base in "${aliases[@]}"; do
              body="$(curl -fsS -H 'Cache-Control: no-cache' --max-time 5 "$base/qa-build-result.json?sha=$EXPECTED_SHA" 2>/dev/null || true)"
              if [ -n "$body" ] && printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("result")=="PASS" and d.get("preview_only") is True and d.get("commit")==sys.argv[1] else 1)' "$EXPECTED_SHA"; then
                matched="$base"
                break
              fi
            done
            [ -n "$matched" ] && break
            sleep 5
          done
          if [ -z "$matched" ]; then
            echo "No known staging alias published the exact triggering SHA $EXPECTED_SHA"
            exit 1
          fi
          echo "GW_EXACT_SHA_PREVIEW_URL=$matched" >> "$GITHUB_ENV"
          echo "GW_EXACT_SHA_PREVIEW_PASS url=$matched sha=$EXPECTED_SHA"
      - name: Install Playwright Chromium for hosted preview checks
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Verify deployed owner preview on phone and desktop viewports
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              const page = await browser.newPage({viewport:{width:390,height:844}});
              const errors=[];
              page.on('pageerror', e => errors.push(String(e)));
              await page.goto(process.env.GW_EXACT_SHA_PREVIEW_URL+'/owner-preview.html',{waitUntil:'domcontentloaded'});
              if(!(await page.locator('.preview-banner').innerText()).includes('NON-PRODUCTION')) throw new Error('Non-production preview banner missing');
              const frame=page.frameLocator('#store');
              await frame.locator('#categoryGrid > .catWrap:not(.findPartCategoryTile)').first().waitFor({state:'visible',timeout:45000});
              const roots=await frame.locator('#categoryGrid > .catWrap:not(.findPartCategoryTile) > .catBtn .catContent b').allTextContents();
              const expected=['Audio, Entertainment & Music','Auto Electrical Parts & Spares','Car Care & Accessories'];
              if(JSON.stringify(roots)!==JSON.stringify(expected)) throw new Error('Homepage root mismatch: '+JSON.stringify(roots));
              await page.waitForFunction(()=>document.querySelector('#store').contentWindow.__GW_PREVIEW_WRITE_BLOCKED===true,{timeout:15000});
              const checkoutHidden=await frame.locator('a[href*="checkout"],.checkoutNow,#checkout').evaluateAll(els=>els.every(el=>getComputedStyle(el).display==='none'||!el.getClientRects().length));
              if(!checkoutHidden) throw new Error('Checkout is exposed in owner preview');
              const collage=frame.locator('.audioFourTile img');
              if(await collage.count()!==4) throw new Error('Audio root collage must contain four department images');
              for(let i=0;i<4;i++){
                const img=collage.nth(i);
                await img.scrollIntoViewIfNeeded();
                const ok=await img.evaluate(async el=>{if(!el.complete)await new Promise(resolve=>{el.addEventListener('load',resolve,{once:true});el.addEventListener('error',resolve,{once:true});setTimeout(resolve,10000)});return el.complete&&el.naturalWidth>0});
                if(!ok) throw new Error('Audio root collage image failed to load: '+await img.getAttribute('alt'));
              }
              const audioRootLink=frame.locator('#categoryGrid > .rootCategoryLink > a.catBtn[href*="preview-category.html"]');
              const audioRootLinkFirst=audioRootLink.first();
              await audioRootLinkFirst.waitFor({state:'visible',timeout:15000});
              await audioRootLinkFirst.click({noWaitAfter:true});
              await page.waitForTimeout(1200);
              const rootNavigationDiagnostic=await page.evaluate(()=>{const f=document.querySelector('#store');try{return {src:f.src,href:f.contentWindow.location.href,title:f.contentDocument?.title,text:f.contentDocument?.body?.innerText?.slice(0,500)}}catch(e){return {src:f.src,error:String(e)}}});
              console.log('HOSTED_ROOT_CATEGORY_NAVIGATION',JSON.stringify(rootNavigationDiagnostic));
              await frame.locator('#heading').filter({hasText:'Audio, Entertainment & Music'}).waitFor({state:'visible',timeout:30000});
              await frame.locator('#grid > .card').first().waitFor({state:'visible',timeout:15000});
              const audioRootCardNames=await frame.locator('#grid > .card').evaluateAll(cards=>cards.map(c=>c.innerText));
              if(audioRootCardNames.length!==6||!audioRootCardNames.some(x=>x.includes('Car Audio & Video')))throw new Error('Audio category page must show six separate subcategory cards: '+JSON.stringify(audioRootCardNames));
              const audioCategoryImages=await frame.locator('#grid > .card img').evaluateAll(async imgs=>Promise.all(imgs.map(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,12000)});return {alt:img.alt,loaded:img.complete&&img.naturalWidth>0,src:img.currentSrc||img.src}})));
              if(audioCategoryImages.length!==6||audioCategoryImages.some(x=>!x.loaded))throw new Error('Audio subcategory picture cards failed to load: '+JSON.stringify(audioCategoryImages));
              const mobileCategoryLayout=await frame.locator('#grid').evaluate(grid=>{const cards=[...grid.querySelectorAll(':scope > .card')];return {columns:getComputedStyle(grid).gridTemplateColumns.split(' ').length,width:Math.round(grid.getBoundingClientRect().width),cardWidths:cards.map(x=>Math.round(x.getBoundingClientRect().width)),cardHeights:cards.map(x=>Math.round(x.getBoundingClientRect().height)),count:cards.length}});
              if(mobileCategoryLayout.columns<2||mobileCategoryLayout.count<6||mobileCategoryLayout.cardWidths.some(w=>w<130)||mobileCategoryLayout.cardHeights.some(h=>h>220))throw new Error('Audio subcategories are not compact two-column cards on mobile: '+JSON.stringify(mobileCategoryLayout));
              async function auditNonAudioRoot(rootIndex, headingText, expectedCount) {
                await frame.locator('body').evaluate(()=>{location.href='index-new.html'});
                const rootLinks=frame.locator('#categoryGrid > .rootCategoryLink > a.catBtn[href*="preview-category.html"]');
                const rootLink=rootLinks.nth(rootIndex);
                await rootLink.waitFor({state:'visible',timeout:30000});
                await rootLink.click({noWaitAfter:true});
                await frame.locator('#heading').filter({hasText:headingText}).waitFor({state:'visible',timeout:30000});
                const cards=frame.locator('#grid > .card');
                await cards.first().waitFor({state:'visible',timeout:15000});
                const imageAudit=await cards.evaluateAll(async cards=>Promise.all(cards.map(async card=>{
                  const img=card.querySelector('img');
                  if(!img)return {label:card.innerText,loaded:false,naturalWidth:0,alt:'',src:''};
                  if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,12000)});
                  return {label:card.innerText,loaded:img.complete&&img.naturalWidth>0,naturalWidth:img.naturalWidth,alt:img.alt,src:img.currentSrc||img.src};
                })));
                if(imageAudit.length!==expectedCount||imageAudit.some(item=>!item.loaded||item.naturalWidth<120||!item.alt.trim()))throw new Error(headingText+' category artwork failed hosted image QA: '+JSON.stringify(imageAudit));
                const layout=await frame.locator('#grid').evaluate(grid=>{const cards=[...grid.querySelectorAll(':scope > .card')];return {columns:getComputedStyle(grid).gridTemplateColumns.split(' ').length,count:cards.length,width:Math.round(grid.getBoundingClientRect().width),cardWidths:cards.map(card=>Math.round(card.getBoundingClientRect().width))}});
                if(layout.columns<2||layout.count!==expectedCount||layout.cardWidths.some(width=>width<130))throw new Error(headingText+' category cards are not usable two-column mobile tiles: '+JSON.stringify(layout));
                console.log('HOSTED_NON_AUDIO_CATEGORY_ART_AUDIT',JSON.stringify({headingText,imageAudit,layout}));
              }
              await auditNonAudioRoot(1,'Auto Electrical Parts & Spares',5);
              await auditNonAudioRoot(2,'Car Care & Accessories',4);
              await frame.locator('body').evaluate(()=>{location.href='index-new.html'});
              const audioRootLinkAgain=frame.locator('#categoryGrid > .rootCategoryLink > a.catBtn[href*="preview-category.html"]').first();
              await audioRootLinkAgain.waitFor({state:'visible',timeout:30000});
              await audioRootLinkAgain.click({noWaitAfter:true});
              await frame.locator('#heading').filter({hasText:'Audio, Entertainment & Music'}).waitFor({state:'visible',timeout:30000});
              await frame.locator('#grid > .card').filter({hasText:'Car Audio & Video'}).waitFor({state:'visible',timeout:15000});
              const carAudioCard=frame.locator('#grid .card').filter({hasText:'Car Audio & Video'});
              const carAudioHref=await carAudioCard.getAttribute('href');
              if(!carAudioHref||!carAudioHref.includes('preview-audio.html'))throw new Error('Car Audio & Video card did not link to the brand directory: '+carAudioHref);
              await carAudioCard.click();
              await page.waitForFunction(()=>{const f=document.querySelector('#store');const u=new URL(f.contentWindow.location.href);return /\/preview-audio(?:\.html)?$/.test(u.pathname)&&u.searchParams.get('department')==='Car Audio'},{timeout:30000});
              if(await frame.locator('#audioDepartments').isVisible())throw new Error('Car Audio selection left the previous department menu visible');
              const brandButton=frame.locator('#brands a[aria-label="Sony"][role="button"]');
              await brandButton.waitFor({state:'visible',timeout:30000});
              if(await frame.locator('#components').isVisible())throw new Error('Car Audio & Video must show brands before component cards');
              if(await frame.locator('#products').isVisible())throw new Error('Car Audio & Video brand landing page must hide products');
              await brandButton.scrollIntoViewIfNeeded();
              const logoImage=brandButton.locator('img').first();
              await logoImage.waitFor({state:'visible',timeout:15000});
              await logoImage.evaluate(img=>img.decode());
              const brandLogo=brandButton.locator('img');
              await brandLogo.waitFor({state:'visible',timeout:15000});
              const brandLogoLoaded=await brandLogo.evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,10000)});return img.complete&&img.naturalWidth>0});
              const brandLogoAudit=await brandLogo.evaluate(img=>({src:img.src,complete:img.complete,width:img.naturalWidth}));
              console.log('HOSTED_SONY_BRAND_LOGO_AUDIT',JSON.stringify(brandLogoAudit));
              if(!brandLogoLoaded)throw new Error('Sony brand logo did not load in the brand directory: '+JSON.stringify(brandLogoAudit));
              await brandButton.click();
              await page.waitForFunction(()=>/\/preview-audio-brand(?:\.html)?$/.test(document.querySelector('#store').contentWindow.location.pathname),{timeout:30000});
              const brandDoc=page.frameLocator('#store');
              await brandDoc.locator('.brandHero').waitFor({state:'visible',timeout:30000});
              if(await brandDoc.locator('#products,.audioProduct').count())throw new Error('Dedicated brand landing page must not show product stock');
              const brandTypeCards=brandDoc.locator('#types .typeCard');
              await brandTypeCards.filter({hasText:'Amplifiers'}).first().waitFor({state:'visible',timeout:30000});
              const categoryImageAudit=await brandTypeCards.evaluateAll(async cards=>Promise.all(cards.map(async card=>{const img=card.querySelector('img');if(!img)return {label:card.innerText,loaded:false};if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,12000)});return {label:card.innerText,loaded:img.complete&&img.naturalWidth>0,src:img.currentSrc||img.src}})));
              if(!categoryImageAudit.length||categoryImageAudit.some(x=>!x.loaded||/\.svg(?:$|\\?)/i.test(x.src)))throw new Error('Hosted product-type image cards must load real photographs, not illustrated SVGs: '+JSON.stringify(categoryImageAudit));
              await brandTypeCards.filter({hasText:'Amplifiers'}).first().click();
              await page.waitForFunction(()=>/\/preview-audio-products(?:\.html)?$/.test(document.querySelector('#store').contentWindow.location.pathname),{timeout:30000});
              const productDoc=page.frameLocator('#store');
              await productDoc.locator('.product').first().waitFor({state:'visible',timeout:30000});
              const audioAmpCount=await productDoc.locator('.product').count();
              if(audioAmpCount<1)throw new Error('Sony -> Amplifiers dedicated product page returned no products');

              // Alpine Halo 11: exact-model photo/details plus centred two-column product-card layout.
              await frame.locator('body').evaluate(()=>{location.href='preview-audio-products.html?department=Car%20Audio&brand=Alpine&component=Head%20Units%20%26%20Media%20Players'});
              await page.waitForFunction(()=>{const f=document.querySelector('#store');const u=new URL(f.contentWindow.location.href);return (u.pathname.endsWith('/preview-audio-products.html')||u.pathname.endsWith('/preview-audio-products'))&&u.searchParams.get('brand')==='Alpine'},{timeout:30000});
              const alpinePage=page.frameLocator('#store');
              const alpineCard=alpinePage.locator('#products .product').filter({hasText:'iLX-F115D'}).first();
              await alpineCard.waitFor({state:'visible',timeout:30000});
              const alpineImageLoaded=await alpineCard.locator('.productMedia img').evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,15000)});return img.complete&&img.naturalWidth>0});
              const alpineAudit=await alpineCard.evaluate((card,imageLoaded)=>{const img=card.querySelector('.productMedia img');const details=card.querySelector('.productDetails');const rect=details?.getBoundingClientRect();const media=card.querySelector('.productMedia')?.getBoundingClientRect();return {text:card.innerText,imageLoaded,imageWidth:img?.naturalWidth||0,textAlign:details?getComputedStyle(details).textAlign:'missing',mediaAndDetailsSeparated:!!media&&!!rect&&media.right<=rect.left+2,description:card.querySelector('.productDetails p')?.innerText||''}},alpineImageLoaded);
              console.log('HOSTED_ALPINE_HALO11_PRODUCT_AUDIT',JSON.stringify(alpineAudit));
              if(!alpineAudit.imageLoaded||alpineAudit.textAlign!=='center'||!alpineAudit.mediaAndDetailsSeparated||!alpineAudit.description.includes('DAB+')||!alpineAudit.description.includes('Apple CarPlay'))throw new Error('Alpine Halo 11 exact-model image, verified description or centred product layout failed: '+JSON.stringify(alpineAudit));

              // OneNav and Amplified must use the official Planetworld brand artwork in both directory and dedicated brand views.
              await frame.locator('body').evaluate(()=>{location.href='preview-audio.html?department=Car%20Audio'});
              await page.waitForFunction(()=>{const f=document.querySelector('#store');const u=new URL(f.contentWindow.location.href);return /\/preview-audio(?:\.html)?$/.test(u.pathname)&&u.searchParams.get('department')==='Car Audio'},{timeout:30000});
              const oneNavButton=frame.locator('#brands .brandLogoButton[aria-label="One"]');
              await oneNavButton.waitFor({state:'visible',timeout:30000});
              const oneNavDirectoryLogo=oneNavButton.locator('img');
              await oneNavDirectoryLogo.waitFor({state:'visible',timeout:15000});
              const oneNavDirectoryAudit=await oneNavDirectoryLogo.evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,12000)});return {src:img.currentSrc||img.src,loaded:img.complete&&img.naturalWidth>0,width:img.naturalWidth,alt:img.alt}});
              console.log('HOSTED_ONENAV_BRAND_LOGO_AUDIT',JSON.stringify(oneNavDirectoryAudit));
              if(!oneNavDirectoryAudit.loaded||!oneNavDirectoryAudit.src.startsWith('data:image/svg+xml')||!oneNavDirectoryAudit.alt.includes('OneNav'))throw new Error('Distinct ONE / OneNav wordmark did not load in the brand directory: '+JSON.stringify(oneNavDirectoryAudit));
              await oneNavButton.click();
              await page.waitForFunction(()=>{const f=document.querySelector('#store');const u=new URL(f.contentWindow.location.href);return /\/preview-audio-brand(?:\.html)?$/.test(u.pathname)&&u.searchParams.get('brand')==='One'},{timeout:30000});
              const oneNavBrandPage=page.frameLocator('#store');
              await oneNavBrandPage.locator('.brandHero').filter({hasText:'ONE / OneNav'}).waitFor({state:'visible',timeout:30000});
              const oneNavHeroLogo=oneNavBrandPage.locator('.brandHero img');
              await oneNavHeroLogo.waitFor({state:'visible',timeout:15000});
              const oneNavLogoLoaded=await oneNavHeroLogo.evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,12000)});return img.complete&&img.naturalWidth>0});
              const oneNavLogoSrc=await oneNavHeroLogo.getAttribute('src');
              if(!oneNavLogoLoaded||!oneNavLogoSrc||!oneNavLogoSrc.startsWith('data:image/svg+xml'))throw new Error('ONE / OneNav must use its own OneNav wordmark, not the OneX logo');
              const oneNavTypeCard=oneNavBrandPage.locator('.typeCard').first();
              await oneNavTypeCard.waitFor({state:'visible',timeout:30000});
              await oneNavTypeCard.click();
              await page.waitForFunction(()=>{const f=document.querySelector('#store');const u=new URL(f.contentWindow.location.href);return /\/preview-audio-products(?:\.html)?$/.test(u.pathname)&&u.searchParams.get('brand')==='One'},{timeout:30000});
              const oneNavProductPage=page.frameLocator('#store');
              // Product records load asynchronously after the route changes; wait for either populated cards or the explicit empty state before auditing.
              await oneNavProductPage.locator('#products .product').first().waitFor({state:'visible',timeout:30000});
              const oneNavProductCount=await oneNavProductPage.locator('.product').count();
              const oneNavProductImageCount=await oneNavProductPage.locator('.product img').count();
              const oneNavReviewNoteCount=await oneNavProductPage.locator('.imageReviewNote').count();
              const oneNavProductText=(await oneNavProductPage.locator('.product').allTextContents()).join(' ');
              console.log('HOSTED_ONENAV_PRODUCT_DETAIL_AUDIT',JSON.stringify({url:await oneNavProductPage.locator('body').evaluate(()=>location.href),products:oneNavProductCount,images:oneNavProductImageCount,reviewNotes:oneNavReviewNoteCount,details:oneNavProductText.includes('9-inch 1024 × 600 touchscreen'),text:oneNavProductText.slice(0,1200)}));
              if(oneNavProductCount<9||oneNavProductImageCount!==6||oneNavReviewNoteCount!==6||!oneNavProductText.includes('9-inch 1024 × 600 touchscreen'))throw new Error('OneNav product details, photos or fitment pages failed hosted QA');
              await frame.locator('body').evaluate(()=>{location.href='preview-audio.html?department=Car%20Audio'});
              await page.waitForFunction(()=>{const f=document.querySelector('#store');const u=new URL(f.contentWindow.location.href);return /\/preview-audio(?:\.html)?$/.test(u.pathname)&&u.searchParams.get('department')==='Car Audio'},{timeout:30000});
              const amplifiedButton=frame.locator('#brands .brandLogoButton[aria-label="Amplified"]');
              await amplifiedButton.waitFor({state:'visible',timeout:30000});
              const amplifiedDirectoryLogo=amplifiedButton.locator('img');
              await amplifiedDirectoryLogo.waitFor({state:'visible',timeout:15000});
              const amplifiedDirectoryAudit=await amplifiedDirectoryLogo.evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,12000)});return {src:img.currentSrc||img.src,loaded:img.complete&&img.naturalWidth>0,width:img.naturalWidth,alt:img.alt}});
              console.log('HOSTED_AMPLIFIED_BRAND_LOGO_AUDIT',JSON.stringify(amplifiedDirectoryAudit));
              if(!amplifiedDirectoryAudit.loaded||!amplifiedDirectoryAudit.src.includes('planetworld.canto.global'))throw new Error('Official Amplified brand-button logo did not load: '+JSON.stringify(amplifiedDirectoryAudit));
              await amplifiedButton.click();
              await page.waitForFunction(()=>{const f=document.querySelector('#store');const u=new URL(f.contentWindow.location.href);return /\/preview-audio-brand(?:\.html)?$/.test(u.pathname)&&u.searchParams.get('brand')==='Amplified'},{timeout:30000});
              const amplifiedBrandPage=page.frameLocator('#store');
              await amplifiedBrandPage.locator('.brandHero').filter({hasText:'Amplified'}).waitFor({state:'visible',timeout:30000});
              const amplifiedHeroLogo=amplifiedBrandPage.locator('.brandHero img');
              await amplifiedHeroLogo.waitFor({state:'visible',timeout:15000});
              if(!await amplifiedHeroLogo.evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,12000)});return img.complete&&img.naturalWidth>0}))throw new Error('Amplified logo failed on its dedicated brand page');

              // Kicker logo must load and render at a readable size in both the brand directory and its dedicated brand page.
              await frame.locator('body').evaluate(()=>{location.href='preview-audio.html?department=Car%20Audio'});
              await page.waitForFunction(()=>{const f=document.querySelector('#store');const u=new URL(f.contentWindow.location.href);return /\/preview-audio(?:\.html)?$/.test(u.pathname)&&u.searchParams.get('department')==='Car Audio'},{timeout:30000});
              const kickerButton=frame.locator('#brands .brandLogoButton[aria-label="Kicker"]');
              await kickerButton.waitFor({state:'visible',timeout:30000});
              const kickerDirectoryLogo=kickerButton.locator('img');
              await kickerDirectoryLogo.waitFor({state:'visible',timeout:15000});
              const kickerDirectoryAudit=await kickerDirectoryLogo.evaluate(async img=>{if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,12000)});const r=img.getBoundingClientRect();return {src:img.currentSrc||img.src,loaded:img.complete&&img.naturalWidth>0,naturalWidth:img.naturalWidth,renderedWidth:Math.round(r.width),renderedHeight:Math.round(r.height)}}); 
              console.log('HOSTED_KICKER_DIRECTORY_LOGO_AUDIT',JSON.stringify(kickerDirectoryAudit));
              if(!kickerDirectoryAudit.loaded||kickerDirectoryAudit.renderedWidth<170)throw new Error('Kicker directory logo failed to load or remains too small: '+JSON.stringify(kickerDirectoryAudit));
              await kickerButton.click();
