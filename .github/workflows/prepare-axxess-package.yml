name: Prepare Axxess upload package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-axxess-package.yml'
      - 'scripts/build-storefront.sh'
      - 'netlify.toml'
      - 'index.html'
      - 'store.html'
      - 'index-new.html'
      - 'product.html'
      - 'products.html'
      - 'checkout-v2.html'
      - 'checkout.html'
      - 'terms-and-conditions.html'
      - 'category.html'
      - 'returns-refunds.html'
      - 'product-details.js'
      - 'category-navigation.js'
      - 'admin.html'
      - 'assets/admin.js'
      - 'assets/gw-logo.png'
      - 'assets/product-image-fallback.js'
      - 'assets/category-cleanup.js'
      - 'assets/progressive-store-enhancements.js'
      - 'assets/product-placeholder.svg'
      - 'assets/category-tree.json'
      - 'assets/products_webp/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/prepare-axxess-package.yml'
      - 'scripts/build-storefront.sh'
      - 'netlify.toml'
      - 'index-new.html'
      - 'checkout-v2.html'
      - 'admin.html'
      - 'assets/admin.js'
      - 'supabase/functions/store-checkout/**'
      - 'supabase/functions/shipping-quote/**'
      - 'netlify/functions/shipping-quote.ts'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Test checkout validation helpers
        run: node --test tests/store-checkout-quote-validation.test.mjs
      - name: Assemble one clean storefront from the shared build script
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-storefront.sh dist
          (cd dist && zip -qr ../axxess-storefront-upload.zip .)
          unzip -t axxess-storefront-upload.zip
          for required in index.html store.html index-new.html product.html products.html checkout.html checkout-v2.html category.html returns-refunds.html terms-and-conditions.html admin.html assets/admin.js assets/product-placeholder.svg assets/category-tree.json; do
            unzip -Z1 axxess-storefront-upload.zip | grep -Fxq "$required" || { echo "ZIP missing required file: $required"; exit 1; }
          done
          if unzip -Z1 axxess-storefront-upload.zip | grep -E '(^|/)(store-enhancements|ui-fixes)\.js$'; then
            echo "Legacy overlay found in ZIP" >&2
            exit 1
          fi
          cat > axxess-upload-instructions.txt <<'EOF'
          GET WIRED AUTOWORX — CLEAN AXXESS WEBSITE REPLACEMENT

          This ZIP contains the website runtime only. It deliberately excludes repository history, supplier catalogues, SQL exports, source archives, and the old JPG image library. Product images use optimized WebP files.

          SAFE REPLACEMENT ORDER
          1. In DirectAdmin, create and download a backup of the complete current public_html folder before deleting anything.
          2. Check that the backup archive can be downloaded and has a non-zero size.
          3. Remove the old website files/folders inside public_html only after the backup is verified. Do not delete the public_html directory itself, domain settings, mailboxes, databases, or anything outside the website root.
          4. Upload axxess-storefront-upload.zip into public_html and extract directly into public_html, not into a nested folder.
          5. Confirm index.html is directly inside public_html and assets/products_webp contains the optimized product image files.
          6. This package includes the current admin.html and assets/admin.js; do not retain the old admin page or old checkout overlay.
          7. Test /, /store.html, /product.html, /products.html, /category.html, /checkout-v2.html, /returns-refunds.html, /terms-and-conditions.html and /admin.html.
          8. Verify HTTPS, Supabase catalogue loading, pickup checkout, delivery quote blocking for unverified rates, and the admin sign-in flow. Do not submit a real customer order as a test.

          The ZIP contains no Supabase secrets or database contents. Final upload must wait for release approval.
          EOF
          echo "Package size:"
          du -h axxess-storefront-upload.zip
          echo "Runtime image count: $(find dist/assets/products_webp -type f -name '*.webp' | wc -l | tr -d ' ')"
      - name: Upload clean package and separate instructions
        uses: actions/upload-artifact@v4
        with:
          name: axxess-storefront-upload
          path: |
            axxess-storefront-upload.zip
            axxess-upload-instructions.txt
          if-no-files-found: error
          retention-days: 14
