name: ASC Read-only SKU Reconciliation
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
  actions: read
concurrency:
  group: asc-read-only-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/staging-ui-verification-fixes-current
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Crawl ASC and exact-join active store SKUs (read-only)
        env:
          ASC_BASE: https://accessoriesspares.co.za
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/asc_catalogue_reconcile.py
      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asc-sku-reconciliation-${{ github.run_id }}
          path: artifacts/asc-reconciliation/
          if-no-files-found: warn
          retention-days: 30
