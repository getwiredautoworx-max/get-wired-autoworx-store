name: ASC 50-image owner watermark-treatment sample
on:
  push:
    branches:
      - asc-image-treatment-pilot-2026-11-09
    paths:
      - "assets/asc-catalogue-pilot-raw/**"
      - "catalogue-review/asc-catalogue-extraction/asc-product-pilot-review-only.csv"
      - "scripts/process-asc-catalogue-pilot.py"
      - ".github/workflows/asc-image-treatment-sample.yml"
permissions:
  contents: write
jobs:
  treatment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic image-processing dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.0.0
      - name: Process the 50 owner-authorised sample crops
        run: python scripts/process-asc-catalogue-pilot.py
      - name: Commit treated images and review evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/asc-catalogue-pilot-treated
          git add catalogue-review/asc-catalogue-extraction/asc-image-treatment-pilot-manifest.csv
          git add catalogue-review/asc-catalogue-extraction/asc-image-treatment-pilot-contact-sheet.jpg
          if git diff --cached --quiet; then
            echo "No image-treatment output changes."
            exit 0
          fi
          git commit -m "chore(asc): generate 50-image owner watermark-treatment sample"
          git push origin HEAD:asc-image-treatment-pilot-2026-11-09
