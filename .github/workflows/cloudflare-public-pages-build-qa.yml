name: Cloudflare Pages Public Package QA

on:
  pull_request:
    branches: [main, integration/storefront-current-main-2026-11-09]
    paths:
      - "scripts/build-cloudflare-pages-public.py"
      - ".github/workflows/cloudflare-pages-deploy.yml"
      - ".github/workflows/cloudflare-layout-preview.yml"
      - ".github/workflows/publish-approved-storefront-preview.yml"
      - ".github/workflows/cloudflare-public-pages-build-qa.yml"
      - "index.html"
      - "store.html"
      - "index-new.html"
      - "product.html"
      - "products.html"
      - "checkout.html"
      - "checkout-v2.html"
      - "category.html"
      - "returns-refunds.html"
      - "terms-and-conditions.html"
      - "privacy-policy.html"
      - "assets/**"
      - "preview-store.html"
      - "preview-category.html"
      - "preview-products.html"
      - "preview-product.html"
      - "preview-audio.html"
      - "preview-audio-brand.html"
      - "preview-audio-products.html"
      - "preview-planetworld.html"
      - "tests/three-category-storefront-structure.test.cjs"
      - "tests/audio-catalogue-preview.test.cjs"
      - "catalogue-review/planetworld-one-official-model-audit.csv"
permissions:
  contents: read
jobs:
  public-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit local audio preview completeness (read-only)
        run: python scripts/audit-audio-preview.py
      - name: Build and verify standard customer-only Pages directory
        run: python scripts/build-cloudflare-pages-public.py
      - name: Verify standard package excludes preview-only routes
        shell: bash
        run: |
          set -euo pipefail
          for page in preview-store.html preview-category.html preview-products.html preview-product.html preview-planetworld.html; do
            test ! -e "pages-public/$page"
          done
          echo "PAGES_STANDARD_PREVIEW_EXCLUSION_PASS"
      - name: Build isolated non-production preview package
        env:
          GW_INCLUDE_PREVIEW_ROUTES: "1"
        run: python scripts/build-cloudflare-pages-public.py
      - name: Verify current non-production preview routes and supplier-safe exclusions
        shell: bash
        run: |
          set -euo pipefail
          for page in owner-preview.html preview-store.html preview-category.html preview-products.html preview-product.html preview-audio.html preview-audio-brand.html preview-audio-products.html preview-auto-electrical.html preview-asc-sample.html product-image-treatment-pilot.html; do
            test -s "pages-public/$page"
          done
          for page in preview-planetworld.html asc-catalogue-preview.html asc-catalogue-preview-data.json planetworld-catalogue-preview.json audio-connections-catalogue-preview.json; do
            test ! -e "pages-public/$page"
          done
          test ! -d pages-public/suppliers
          test ! -d pages-public/catalogue-review
          test ! -d pages-public/supabase
          echo "PAGES_NONPRODUCTION_PREVIEW_ALLOWLIST_PASS"
