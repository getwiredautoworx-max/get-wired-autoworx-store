name: Cloudflare Pages Public Package QA

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/build-cloudflare-pages-public.py"
      - ".github/workflows/cloudflare-pages-deploy.yml"
      - ".github/workflows/cloudflare-layout-preview.yml"
      - ".github/workflows/publish-approved-storefront-preview.yml"
      - ".github/workflows/cloudflare-public-pages-build-qa.yml"
      - "index.html"
      - "store.html"
      - "index-new.html"
      - "product.html"
      - "products.html"
      - "checkout.html"
      - "checkout-v2.html"
      - "category.html"
      - "returns-refunds.html"
      - "terms-and-conditions.html"
      - "privacy-policy.html"
      - "assets/**"
      - "preview-store.html"
      - "preview-category.html"
      - "preview-products.html"
      - "preview-product.html"
      - "preview-planetworld.html"
permissions:
  contents: read
jobs:
  public-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify standard customer-only Pages directory
        run: python scripts/build-cloudflare-pages-public.py
      - name: Verify standard package excludes preview-only routes
        shell: bash
        run: |
          set -euo pipefail
          for page in preview-store.html preview-category.html preview-products.html preview-product.html preview-planetworld.html; do
            test ! "pages-public/$page"
          done
          echo "PAGES_STANDARD_PREVIEW_EXCLUSION_PASS"
      - name: Build isolated non-production preview package
        env:
          GW_INCLUDE_PREVIEW_ROUTES: "1"
        run: python scripts/build-cloudflare-pages-public.py
      - name: Verify preview package includes only the four approved non-supplier preview routes
        shell: bash
        run: |
          set -euo pipefail
          for page in preview-store.html preview-category.html preview-products.html preview-product.html; do
            test -s "pages-public/$page"
          done
          test ! -d pages-public/suppliers
          test ! -d pages-public/catalogue-review
          test ! -d pages-public/supabase
          echo "PAGES_NONPRODUCTION_PREVIEW_ALLOWLIST_PASS"
