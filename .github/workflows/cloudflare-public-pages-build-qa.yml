name: Cloudflare Pages Public Package QA

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/build-cloudflare-pages-public.py"
      - ".github/workflows/cloudflare-pages-deploy.yml"
      - ".github/workflows/cloudflare-layout-preview.yml"
      - ".github/workflows/publish-approved-storefront-preview.yml"
      - ".github/workflows/cloudflare-public-pages-build-qa.yml"
      - "index.html"
      - "store.html"
      - "index-new.html"
      - "product.html"
      - "products.html"
      - "checkout.html"
      - "checkout-v2.html"
      - "category.html"
      - "returns-refunds.html"
      - "terms-and-conditions.html"
      - "privacy-policy.html"
      - "assets/**"
      - "owner-preview.html"
      - "preview-store.html"
      - "preview-category.html"
      - "preview-products.html"
      - "preview-product.html"
      - "preview-planetworld.html"
      - "preview-audio.html"
      - "asc-catalogue-preview.html"
      - "tests/audio-catalogue-preview.test.cjs"
      - "tests/asc-catalogue-preview.test.cjs"
      - "tests/three-category-storefront-structure.test.cjs"
      - "scripts/public-sku-audit.py"
permissions:
  contents: read
jobs:
  public-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify standard customer-only Pages directory
        run: python scripts/build-cloudflare-pages-public.py
      - name: Verify standard package excludes preview-only routes
        shell: bash
        run: |
          set -euo pipefail
          for page in owner-preview.html preview-store.html preview-category.html preview-products.html preview-product.html preview-planetworld.html preview-audio.html asc-catalogue-preview.html; do
            test ! -e "pages-public/$page"
          done
          test ! -d pages-public/assets/asc-catalogue-source
          test ! -e pages-public/assets/planetworld-catalogue-preview.json
          test ! -e pages-public/assets/planetworld-verified-models-preview.json
          test ! -e pages-public/assets/audio-connections-catalogue-preview.json
          echo "PAGES_STANDARD_PREVIEW_EXCLUSION_PASS"
      - name: Build isolated non-production preview package
        env:
          GW_INCLUDE_PREVIEW_ROUTES: "1"
        run: python scripts/build-cloudflare-pages-public.py
      - name: Verify preview package includes all seven approved preview routes
        shell: bash
        run: |
          set -euo pipefail
          for page in owner-preview.html preview-store.html preview-category.html preview-products.html preview-product.html preview-planetworld.html preview-audio.html asc-catalogue-preview.html; do
            test -s "pages-public/$page"
          done
          test ! -d pages-public/suppliers
          test ! -d pages-public/catalogue-review
          test ! -d pages-public/supabase
          test -s pages-public/assets/asc-catalogue-source/ASC-Aerials.pdf
          test -s pages-public/assets/asc-catalogue-source/ASC-Automotive-Sensors.pdf
          test -s pages-public/assets/asc-catalogue-source/ASC-Automotive-Switches.pdf
          test -s pages-public/assets/asc-catalogue-source/ASC-Automotive-Globes.pdf
          test -s pages-public/assets/asc-catalogue-source/ASC-Car-Mats.pdf
          test -s pages-public/assets/asc-catalogue-source/ASC-Fuel-Pumps.pdf
          test -s pages-public/assets/planetworld-catalogue-preview.json
          test -s pages-public/assets/planetworld-verified-models-preview.json
          test -s pages-public/assets/audio-connections-catalogue-preview.json
          node tests/asc-catalogue-preview.test.cjs
          node tests/audio-catalogue-preview.test.cjs
          node tests/three-category-storefront-structure.test.cjs
          python3 scripts/public-sku-audit.py
          echo "PAGES_NONPRODUCTION_PREVIEW_ALLOWLIST_PASS"
