name: Storefront Smoke Test

on:
  push:
    branches: [main, release/verified-price-checkout-2026-10-13, fix/current-main-price-gate-2026-10-13]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'assets/**'
      - 'supabase/functions/**'
      - '.github/workflows/storefront-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'assets/**'
      - 'supabase/functions/**'
      - '.github/workflows/storefront-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify verified-price checkout gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "price_status!=='QUOTE_REQUIRED'" index-new.html
          grep -Fq "PRICE_CONFIRMATION_REQUIRED" supabase/functions/store-checkout/index.ts
          grep -Fq 'price_status !== "QUOTE_REQUIRED"' supabase/functions/store-checkout/index.ts
          grep -Fq 'create_store_order_v2' supabase/functions/store-checkout/index.ts
          grep -Fq "price_status==='QUOTE_REQUIRED'" checkout-v2.html
          grep -Fq "Price on request" index-new.html
          grep -Fq "price_status!=='QUOTE_REQUIRED'" products.html
          grep -Fq "price_status!=='QUOTE_REQUIRED'" product.html
          echo "Verified-price gate is present in storefront, checkout, and server-side order creation."
      - name: Run local storefront smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/store-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}});
            page.on('console', m => console.log('[browser:'+m.type()+'] '+m.text()));
            page.on('pageerror', e => console.log('[pageerror] '+e.message));
            await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'domcontentloaded'});
            await page.waitForSelector('#store');
            const iframe = page.locator('#store');
            await iframe.waitFor({timeout:10000});
            const frame = page.frameLocator('#store');
            try {
              await frame.locator('#categoryGrid .catWrap').first().waitFor({timeout:60000});
            } catch (e) {
              const diag = await frame.locator('body').innerText().catch(()=>'<frame unavailable>');
              throw new Error('Category grid did not render within 60s. Frame text: '+diag.slice(0,1000));
            }
            // Exercise the standalone category-navigation route as well as the embedded homepage.
            const categoryPage = await browser.newPage({viewport:{width:390,height:844}});
            categoryPage.on('console', m => console.log('[category-browser:'+m.type()+'] '+m.text()));
            categoryPage.on('pageerror', e => console.log('[category-pageerror] '+e.message));
            await categoryPage.goto('http://127.0.0.1:4173/category.html', {waitUntil:'domcontentloaded'});
            await categoryPage.waitForFunction(() => { const grid=document.querySelector('#grid'); return !!grid && (grid.dataset.error || grid.innerText.trim() !== 'Loading categories…'); }, null, {timeout:60000});
            const categoryLoadError = await categoryPage.locator('#grid').getAttribute('data-error');
            if (categoryLoadError) throw new Error('Category navigation failed: '+categoryLoadError);
            const rootOptions = await categoryPage.locator('#grid .card').count();
            if (rootOptions < 1) throw new Error('No populated main categories rendered on category.html; debug='+await categoryPage.locator('#grid').getAttribute('data-debug')+'; grid='+await categoryPage.locator('#grid').innerText());
            const rootNames = await categoryPage.locator('#grid .card h2').allTextContents();
            if (!rootNames.some(n => n.trim() === 'Auto Electrical')) throw new Error('Auto Electrical root missing from category navigation');
            await categoryPage.locator('#grid .card').first().click();
            await categoryPage.locator('#grid .card').first().waitFor({timeout:60000});
            const childOptions = await categoryPage.locator('#grid .card').count();
            if (childOptions < 1) throw new Error('Selected main category has no populated child/direct-product options');
            console.log('CATEGORY_NAVIGATION_PASS: '+rootOptions+' populated main categories; '+childOptions+' populated Auto Electrical options');
            await categoryPage.close();

            // Verify the image fallback only tries the exact public-SKU WebP.
            // A missing approved image must produce a clean "Image not available" state,
            // never fall back to supplier/catalogue imagery.
            const imageFallbackPage = await browser.newPage();
            await imageFallbackPage.setContent('<iframe id="imageFrame"></iframe>');
            await imageFallbackPage.locator('#imageFrame').evaluate(frame => {
              frame.srcdoc = '<!doctype html><html><head><base href="http://127.0.0.1:4173/"></head><body><div class="product"><div class="prodImg"><img src="/assets/gw-logo.png" alt=""></div><span class="sku">GW-000174D6</span><h3>Exact SKU fallback test</h3></div></body></html>';
            });
            await imageFallbackPage.waitForFunction(() => {
              const frame = document.querySelector('#imageFrame');
              return frame && frame.contentDocument && frame.contentDocument.readyState === 'complete';
            }, null, {timeout:10000});
            await imageFallbackPage.addScriptTag({path:'assets/product-image-fallback.js'});
            await imageFallbackPage.evaluate(() => window.installGetWiredProductImageFallback(document.querySelector('#imageFrame')));
            await imageFallbackPage.waitForFunction(() => {
              const frame = document.querySelector('#imageFrame');
              const doc = frame && frame.contentDocument;
              const img = doc && doc.querySelector('.prodImg img');
              const box = doc && doc.querySelector('.prodImg');
              if (!img || !box) return false;
              const isExactLocalImage = img.complete && img.naturalWidth > 0 && /\/assets\/products_webp\/GW-000174D6\.webp(?:$|\?)/.test(img.src);
              const isCleanMissingState = box.classList.contains('no-image') && box.textContent.includes('Image not available');
              return isExactLocalImage;
            }, null, {timeout:30000});
            const imageFallbackResult = await imageFallbackPage.locator('#imageFrame').evaluate(frame => {
              const doc = frame.contentDocument;
              const img = doc.querySelector('.prodImg img');
              const box = doc.querySelector('.prodImg');
              return {src:img && img.src, naturalWidth:img && img.naturalWidth, noImage:box && box.classList.contains('no-image'), text:box && box.textContent};
            });
            if (!imageFallbackResult.src || !imageFallbackResult.src.includes('/assets/products_webp/GW-000174D6.webp') || imageFallbackResult.noImage || imageFallbackResult.naturalWidth < 1) throw new Error('Exact-SKU WebP did not render successfully: '+JSON.stringify(imageFallbackResult));
            if (imageFallbackResult.src.includes('/functions/v1/product-image')) throw new Error('Supplier image proxy must never be used in storefront fallback');
            console.log('EXACT_SKU_IMAGE_FALLBACK_PASS: '+JSON.stringify(imageFallbackResult));
            await imageFallbackPage.close();

            // Verify product detail pages never render Buyer’s Guide/source/cost metadata.
            const productDetailPage = await browser.newPage();
            await productDetailPage.route('**/rest/v1/products?*', route => route.fulfill({
              status:200,
              contentType:'application/json',
              body:JSON.stringify([{
                id:'test-product-id',name:'Test Fuse',public_sku:'GW-TEST0001',
                description:'Clean customer description\nBuyer’s Guide: page 12\nsource_category: catalogue',
                price:10,stock_quantity:2,image_url:null,gallery_urls:[],
                compatible_vehicles:[],category_id:'test-category-id',active:true,
                specifications:{voltage:'12V',source_page:'page 12',source_guide:'Buyer’s Guide',supplier_sku:'SUPPLIER-SECRET',cost_price:5,internal_note:'catalogue page'}
              }])
            }));
            await productDetailPage.route('**/rest/v1/categories?*', route => route.fulfill({
              status:200,
              contentType:'application/json',
              body:JSON.stringify([{id:'test-category-id',name:'Electrical',parent_id:null}])
            }));
            await productDetailPage.goto('http://127.0.0.1:4173/product.html?id=test-product-id',{waitUntil:'domcontentloaded'});
            await productDetailPage.locator('.desc').waitFor({timeout:10000});
            const productDetailText = await productDetailPage.locator('body').innerText();
            if (!productDetailText.includes('Clean customer description') || !productDetailText.includes('12V')) throw new Error('Clean product description/specification missing');
            if (!productDetailText.includes('Vehicle compatibility not available')) throw new Error('Missing vehicle compatibility must show the customer-safe enquiry message');
            if (/Buyer’s Guide|catalogue|source_page|source_guide|SUPPLIER-SECRET|cost_price|internal_note/i.test(productDetailText)) throw new Error('Internal Buyer’s Guide/supplier/cost metadata leaked into product details');
            console.log('PRODUCT_METADATA_LEAK_GUARD_PASS');
            await productDetailPage.close();

            await frame.locator('#featuredGrid .product').first().waitFor({timeout:60000});
            await frame.locator('#searchInput').fill('');
            await frame.locator('#featuredGrid .product').first().locator('h3').click();
            try {
              await frame.locator('#productModal.open').waitFor({timeout:10000});
            } catch (e) {
              const modalDiag = await frame.locator('#productModal').evaluate(el => ({className:el.className, display:getComputedStyle(el).display, featuredCards:document.querySelectorAll('#featuredGrid .product').length, firstCardId:document.querySelector('#featuredGrid .product')?.getAttribute('data-id'), productsLoaded:Array.isArray(window.products)?window.products.length:'not-global'})).catch(()=>({error:'modal diagnostic unavailable'}));
              throw new Error('Product detail modal failed to open after clicking product title: '+JSON.stringify(modalDiag));
            }
            await frame.locator('#modalClose').click();
            await frame.locator('#allProductsLink').click();
            const quoteOnlyHtml = await frame.locator('#featuredGrid').evaluate(grid => grid.ownerDocument.defaultView.card({id:'quote-only-test',name:'Quote-only test product',public_sku:'GW-TEST0001',price:123.45,stock_quantity:3,image_url:null,specifications:{price_status:'QUOTE_REQUIRED'}}));
            if (!quoteOnlyHtml.includes('Price on request') || !quoteOnlyHtml.includes('REQUEST PRICE')) throw new Error('Explicit quote-only product must show Price on request and REQUEST PRICE');
            await frame.locator('#searchInput').fill('GW-B4F502E6');
            const pricedCard = frame.locator('.product').filter({hasText:'GW-B4F502E6'}).first();
            await pricedCard.waitFor({timeout:15000});
            const pricedText = await pricedCard.innerText();
            if (!pricedText.includes('ADD TO CART') || pricedText.includes('Price on request')) throw new Error('Formula-priced catalogue product must be purchasable unless explicitly marked QUOTE_REQUIRED: '+pricedText);
            await frame.locator('#searchInput').fill('GW-F165DD11');
            const verifiedCard = frame.locator('.product').filter({hasText:'GW-F165DD11'}).first();
            await verifiedCard.waitFor({timeout:15000});
            const verifiedText = await verifiedCard.innerText();
            if (!verifiedText.includes('ADD TO CART') || verifiedText.includes('Price on request')) throw new Error('Verified product must show its price and Add to Cart');
            const verifiedSuggestion = frame.locator('.gwResult').filter({hasText:'GW-F165DD11'}).first();
            await verifiedSuggestion.waitFor({timeout:10000});
            await verifiedSuggestion.click();
            await frame.locator('#productModal.open').waitFor({timeout:10000});
            await frame.locator('#detailAdd').click();
            await page.locator('#checkout').waitFor({timeout:10000});
            await page.locator('#checkout').click();
            await page.waitForURL('**/checkout-v2.html');
            await page.locator('#name').waitFor({timeout:10000});
            await page.locator('#phone').waitFor({timeout:10000});
            await page.locator('#deliverySummary').waitFor({timeout:10000});
            const delivery = await page.locator('#deliverySummary').textContent();
            if (!delivery || !delivery.includes('To be quoted')) throw new Error('Delivery must remain quoted separately until a delivery quote is selected');
            const checkoutText = await page.locator('body').innerText();
            if (!checkoutText.includes('R35.00 per item')) throw new Error('Packaging must be R35.00 per item');
            if (!checkoutText.includes('Pickup is free') && !checkoutText.includes('Pickup: R0.00')) throw new Error('Free pickup rule missing');
            if (!checkoutText.includes('Courier Guy') || !checkoutText.includes('PEP PAXI')) throw new Error('Delivery options missing');
            await page.locator('#fulfilment').selectOption('pickup');
            if (!(await page.locator('#deliverySummary').textContent()).includes('R0.00')) throw new Error('Pickup delivery charge must be R0.00');
            if (!(await page.locator('#packagingSummary').textContent()).includes('R35.00 per item')) throw new Error('Packaging summary must show R35.00 per item');
            await page.locator('#fulfilment').selectOption('delivery');
            if (!(await page.locator('#deliverySummary').textContent()).includes('To be quoted')) throw new Error('Delivery must reset to quote pending when delivery is selected');
            const listingPage = await browser.newPage({viewport:{width:390,height:844}});
            await listingPage.route('**/rest/v1/products?*', route => route.fulfill({status:200,contentType:'application/json',body:JSON.stringify([{id:'quote-listing-test',name:'Quote-only listing test',public_sku:'GW-TEST0001',description:'Customer-safe description',price:123.45,stock_quantity:3,image_url:null,specifications:{price_status:'QUOTE_REQUIRED'},active:true,category_id:'df14b7f8-f086-4fdb-8496-733bde7e18e7'}])}));
            await listingPage.goto('http://127.0.0.1:4173/products.html?category=df14b7f8-f086-4fdb-8496-733bde7e18e7',{waitUntil:'domcontentloaded'});
            const listingQuoteCard = listingPage.locator('.card').filter({hasText:'GW-TEST0001'}).first();
            await listingQuoteCard.waitFor({timeout:15000});
            const listingQuoteText = await listingQuoteCard.innerText();
            if (!listingQuoteText.includes('Price on request') || !listingQuoteText.includes('REQUEST PRICE')) throw new Error('Category product listing exposed an unverified price or Add to Cart');
            await listingPage.close();

            const productQuotePage = await browser.newPage({viewport:{width:390,height:844}});
            await productQuotePage.route('**/rest/v1/products?*', route => route.fulfill({status:200,contentType:'application/json',body:'[{"id":"quote-test","name":"Quote-only test product","public_sku":"GW-B4F502E6","description":"Customer-safe description","price":123.45,"stock_quantity":3,"image_url":null,"gallery_urls":[],"compatible_vehicles":[],"category_id":"quote-category","active":true,"specifications":{"price_status":"QUOTE_REQUIRED"}}]'}));
            await productQuotePage.route('**/rest/v1/categories?*', route => route.fulfill({status:200,contentType:'application/json',body:'[{"id":"quote-category","name":"Accessories","parent_id":null}]'}));
            await productQuotePage.goto('http://127.0.0.1:4173/product.html?id=quote-test',{waitUntil:'domcontentloaded'});
            await productQuotePage.locator('#root .error, #root #add').first().waitFor({timeout:15000});
            const productQuoteText = await productQuotePage.locator('body').innerText();
            if (!productQuoteText.includes('Price on request') || !productQuoteText.includes('REQUEST PRICE')) throw new Error('Direct product detail price gate failed. Page content: '+productQuoteText.slice(0,600));
            await productQuotePage.close();

            if (process.env.GITHUB_REF === 'refs/heads/main') {
              const publicPage = await browser.newPage({viewport:{width:390,height:844}});
              const response = await publicPage.goto('https://www.getwiredauto.co.za/store',{waitUntil:'domcontentloaded',timeout:45000});
              if (!response || response.status() >= 400) throw new Error('Public storefront did not return a successful HTTP response');
              const publicFrame = publicPage.frameLocator('iframe#store');
              await publicFrame.locator('#allProductsLink').waitFor({timeout:25000});
              await publicFrame.locator('#featuredGrid .product').first().waitFor({timeout:30000});
              await publicFrame.locator('#allProductsLink').click();
              await publicFrame.locator('#allProductsGrid .product').first().waitFor({timeout:60000});
              await publicFrame.locator('#searchInput').fill('GW-B4F502E6');
              const product = publicFrame.locator('#allProductsGrid .product').filter({hasText:'GW-B4F502E6'}).first();
              await product.waitFor({timeout:20000});
              const productText = await product.innerText();
              if (productText.includes('Price on request') || !productText.includes('ADD TO CART')) throw new Error('Public storefront still blocks formula-priced SKU GW-B4F502E6: '+productText);
              await product.getByRole('button',{name:'ADD TO CART',exact:true}).click();
              const cart = await publicPage.evaluate(() => JSON.parse(localStorage.getItem('gw_cart') || '[]'));
              if (!cart.some(item=>item.public_sku==='GW-B4F502E6' && Number(item.qty)===1)) throw new Error('Public cart did not persist the formula-priced product');
              await publicPage.goto('https://www.getwiredauto.co.za/checkout-v2.html',{waitUntil:'domcontentloaded',timeout:30000});
              await publicPage.locator('#summaryTotal').waitFor({timeout:20000});
              if (!(await publicPage.locator('#packagingSummary').innerText()).includes('Packaging:') || !(await publicPage.locator('#items').innerText()).includes('GW-B4F502E6')) throw new Error('Public checkout did not load cart items and packaging');
              console.log('PUBLIC_FALLBACK_CART_CHECKOUT_PASS');

              const policyChecks = [
                {url:'https://www.getwiredauto.co.za/terms-and-conditions.html', expected:'Terms'},
                {url:'https://www.getwiredauto.co.za/returns-refunds.html', expected:'Returns'}
              ];
              for (const policy of policyChecks) {
                const policyResponse = await fetch(policy.url,{redirect:'follow'});
                const policyBody = await policyResponse.text();
                if (!policyResponse.ok || !/<html[\\s>]/i.test(policyBody) || !policyBody.toLowerCase().includes(policy.expected.toLowerCase())) {
                  throw new Error('Public policy verification failed for '+policy.url+': HTTP '+policyResponse.status);
                }
                console.log('PUBLIC_POLICY_PASS '+policy.url+' HTTP '+policyResponse.status);
              }
              await publicPage.close();
            }
            await page.setViewportSize({width:1280,height:900});
            console.log('STOREFRONT_SMOKE_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
