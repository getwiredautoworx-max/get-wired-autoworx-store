name: Storefront Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'assets/**'
      - '.github/workflows/storefront-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run local storefront smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/store-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}});
            page.on('console', m => console.log('[browser:'+m.type()+'] '+m.text()));
            page.on('pageerror', e => console.log('[pageerror] '+e.message));
            await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'domcontentloaded'});
            await page.waitForSelector('#store');
            const iframe = page.locator('#store');
            await iframe.waitFor({timeout:10000});
            const frame = page.frameLocator('#store');
            try {
              await frame.locator('#categoryGrid .catWrap').first().waitFor({timeout:60000});
            } catch (e) {
              const diag = await frame.locator('body').innerText().catch(()=>'<frame unavailable>');
              throw new Error('Category grid did not render within 60s. Frame text: '+diag.slice(0,1000));
            }
            await frame.locator('#featuredGrid .product').first().waitFor({timeout:60000});
            await frame.locator('#searchInput').fill('');
            await frame.locator('#featuredGrid .product').first().click();
            await frame.locator('#productModal.open').waitFor({timeout:10000});
            await frame.locator('#modalClose').click();
            await frame.locator('#featuredGrid .product button').first().click();
            await page.locator('#checkout').waitFor({timeout:10000});
            await page.locator('#checkout').click();
            await page.waitForURL('**/checkout-v2.html');
            await page.locator('#name').waitFor({timeout:10000});
            await page.locator('#phone').waitFor({timeout:10000});
            await page.locator('#deliverySummary').waitFor({timeout:10000});
            const delivery = await page.locator('#deliverySummary').textContent();
            if (!delivery || !delivery.includes('To be quoted')) throw new Error('Delivery must remain quoted separately until a delivery quote is selected');
            const notice = await page.locator('.notice').first().textContent();
            if (!notice.includes('R15.00 despatch charge per delivery address')) throw new Error('Phoenix Plaza R15 despatch rule missing');
            if (!notice.includes('Courier Guy') && !notice.includes('PEP PAXI')) throw new Error('Delivery options missing');
            const checkoutText = await page.locator('body').innerText();
            if (/Pick up|pickup|Pickup|cash_on_pickup|R35\.00 per item/.test(checkoutText)) throw new Error('Obsolete pickup/packaging rule detected in checkout');
            await page.setViewportSize({width:1280,height:900});
            console.log('STOREFRONT_SMOKE_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
