name: Storefront Smoke Test
on:
  pull_request:
    branches: [main]
    paths:
      - 'index-new.html'
      - 'category.html'
      - 'preview-category.html'
      - 'preview-audio*.html'
      - 'owner-preview.html'
      - 'assets/category-tree.json'
      - 'assets/*catalogue-preview.json'
      - 'assets/auto-electrical-owner-preview.json'
      - 'tests/three-category-storefront-structure.test.cjs'
      - 'tests/pricing-display-policy.test.cjs'
      - '.github/workflows/storefront-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index-new.html'
      - 'category.html'
      - 'preview-category.html'
      - 'preview-audio*.html'
      - 'owner-preview.html'
      - 'assets/category-tree.json'
      - 'assets/*catalogue-preview.json'
      - 'assets/auto-electrical-owner-preview.json'
      - 'tests/three-category-storefront-structure.test.cjs'
      - 'tests/pricing-display-policy.test.cjs'
      - '.github/workflows/storefront-smoke.yml'
jobs:
  static-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify three-category structure and supplier-safe catalogue data
        run: node tests/three-category-storefront-structure.test.cjs
      - name: Verify current Price On Request and availability policy
        run: node tests/pricing-display-policy.test.cjs
