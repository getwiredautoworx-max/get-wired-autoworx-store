name: ASC Exact-SKU Read-only Status Refresh
on:
  pull_request:
    paths:
      - 'scripts/asc_exact_sku_status_refresh.py'
      - 'staging/ASC_STOCK_DISCONTINUATION_REVIEW_2026-10-19.csv'
      - '.github/workflows/asc-exact-sku-status-refresh.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only audit dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Refresh exact supplier SKUs from public ASC pages
        env:
          ASC_REVIEW_CSV: staging/ASC_STOCK_DISCONTINUATION_REVIEW_2026-10-19.csv
          ASC_REPORT_DIR: qa-evidence/asc-status-refresh
        run: python scripts/asc_exact_sku_status_refresh.py
      - name: Upload read-only evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asc-exact-sku-status-refresh-${{ github.run_id }}
          path: qa-evidence/asc-status-refresh/
          if-no-files-found: error
          retention-days: 30
