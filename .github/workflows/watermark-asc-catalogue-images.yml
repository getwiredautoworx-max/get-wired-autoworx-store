name: ASC Catalogue Image Watermark

on:
  push:
    branches:
      - integration/asc-auto-electrical-clean-2026-11-05
    paths:
      - 'scripts/watermark-asc-catalogue-images.py'
      - 'tests/test_asc_watermark.py'
      - '.github/workflows/watermark-asc-catalogue-images.yml'
      - 'assets/asc-auto-electrical-pilot/*.jpg'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asc-catalogue-image-watermark
  cancel-in-progress: false

jobs:
  watermark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ASC preview branch
        uses: actions/checkout@v4
        with:
          ref: integration/asc-auto-electrical-clean-2026-11-05
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCR and image processing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --disable-pip-version-check pillow pytesseract

      - name: Verify repeatable watermark pipeline
        run: python -m unittest tests/test_asc_watermark.py -v

      - name: Apply Get Wired AutoWorx watermark to all staged ASC pilot images
        run: python scripts/watermark-asc-catalogue-images.py

      - name: Confirm every preview image has a preserved source crop
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('assets/asc-auto-electrical-preview.json').read_text())
          images=Path('assets/asc-auto-electrical-pilot')
          originals=Path('assets/asc-auto-electrical-pilot-originals')
          referenced={Path(row['image_url']).name for row in data['records']}
          missing=[name for name in sorted(referenced) if not (images/name).is_file() or not (originals/name).is_file()]
          if missing:
              raise SystemExit('Missing watermarked/original ASC images: '+', '.join(missing))
          print('ASC_REFERENCED_IMAGES=',len(referenced))
          print('ASC_WATERMARKED_FILES=',len(list(images.glob('*.jpg'))))
          print('ASC_PRESERVED_ORIGINALS=',len(list(originals.glob('*.jpg'))))
          PY

      - name: Upload owner-review watermark samples
        uses: actions/upload-artifact@v4
        with:
          name: asc-watermarked-pilot-visual-review
          path: |
            assets/asc-auto-electrical-pilot/*.jpg
            assets/asc-auto-electrical-pilot-originals/*.jpg
          if-no-files-found: error
          retention-days: 3

      - name: Commit watermarked preview assets
        run: |
          git config user.name "Get Wired AutoWorx ASC Image Watermark"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/asc-auto-electrical-pilot assets/asc-auto-electrical-pilot-originals
          if git diff --cached --quiet; then
            echo "ASC images are already watermarked from preserved originals."
            exit 0
          fi
          git commit -m "assets: overlay Get Wired watermark on ASC catalogue images"
          git fetch origin integration/asc-auto-electrical-clean-2026-11-05
          git rebase origin/integration/asc-auto-electrical-clean-2026-11-05
          git push origin HEAD:integration/asc-auto-electrical-clean-2026-11-05
