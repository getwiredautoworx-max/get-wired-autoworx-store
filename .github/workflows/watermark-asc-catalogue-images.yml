name: ASC Image Pilot Review

on:
  push:
    branches:
      - integration/asc-auto-electrical-clean-2026-11-05
    paths:
      - 'scripts/watermark-asc-catalogue-images.py'
      - 'tests/test_asc_watermark.py'
      - '.github/workflows/watermark-asc-catalogue-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asc-image-pilot-review
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout owner-review branch
        uses: actions/checkout@v4
        with:
          ref: integration/asc-auto-electrical-clean-2026-11-05
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --disable-pip-version-check pillow opencv-python-headless pytesseract numpy
      - name: Test conservative image preparation
        run: python -m unittest tests/test_asc_watermark.py -v
      - name: Generate one sample from each of the six ASC catalogues
        run: python scripts/watermark-asc-catalogue-images.py
      - name: Validate six distinct outputs and review report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/asc-image-sample")
          images=list(root.glob("*.jpg"))
          report=json.loads((root/"image-review-report.json").read_text())
          if len(images)!=6 or len(report)!=6:
              raise SystemExit(f"Expected 6 sample images, got {len(images)} images / {len(report)} report rows")
          catalogues={row["catalogue"] for row in report}
          expected={"Aerials","Automotive Sensors","Automotive Switches","Automotive Globes","Fuel Pumps","Car Mats"}
          if catalogues != expected:
              raise SystemExit(f"Catalogue coverage mismatch: {sorted(catalogues)}")
          print("ASC_SAMPLE_IMAGES=6")
          print("ASC_SAMPLE_CATALOGUES=", ", ".join(sorted(catalogues)))
          PY
      - name: Upload six-catalogue visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: asc-six-catalogue-image-sample
          path: |
            artifacts/asc-image-sample/
            assets/asc-auto-electrical-pilot-originals/*.jpg
            suppliers/ASC/*.pdf
          if-no-files-found: error
          retention-days: 7
