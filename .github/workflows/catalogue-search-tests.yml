name: Free Catalogue Search Tests
on:
  pull_request:
    paths:
      - "assets/catalogue-search.js"
      - "tests/catalogue-search.test.cjs"
      - "preview-store.html"
      - ".github/workflows/catalogue-search-tests.yml"
  push:
    branches: [main]
    paths:
      - "assets/catalogue-search.js"
      - "tests/catalogue-search.test.cjs"
      - "preview-store.html"
      - ".github/workflows/catalogue-search-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run free catalogue search acceptance tests
        run: node tests/catalogue-search.test.cjs
      - name: Validate populated-preview browser integration and safe rendering
        run: |
          node --check assets/catalogue-search.js
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('preview-store.html','utf8');
          if (!html.includes('<script src="assets/catalogue-search.js"></script>')) throw new Error('Free search module is not loaded');
          if (!html.includes('window.gwCatalogueSearch.search(products,q,25)')) throw new Error('Store search does not use the tested free matcher');
          if (!html.includes('category_name:categoryNames.get(String(p.category_id))||')) throw new Error('Category names are not available to the matcher');
          if (!html.includes('esc(p.name)') || !html.includes('esc(p.public_sku')) throw new Error('Product text is not safely escaped by the existing renderer');
          console.log('FREE_CATALOGUE_SEARCH_PREVIEW_INTEGRATION_PASS');
          NODE
