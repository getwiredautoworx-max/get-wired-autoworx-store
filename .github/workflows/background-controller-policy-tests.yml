name: Background Controller Policy Tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/background_task_controller.py'
      - 'tests/test_background_controller_policy.py'
      - '.github/workflows/background-controller-policy-tests.yml'
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run safe controller policy regression tests
        run: python -m unittest discover -s tests -p 'test_background_controller_policy.py' -v
