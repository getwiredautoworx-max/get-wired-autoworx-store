name: Gemini Direct Document Generator

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name to create or update'
        required: true
        default: 'feature/docs-schema-pack'
      pr_title:
        description: 'Pull Request Title'
        required: true
        default: 'docs: Add Knowledge Base, Schema, and Runbook Pack'

jobs:
  generate-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout or Create Feature Branch
        run: |
          git config user.name "gemini-code-agent[bot]"
          git config user.email "gemini-code-agent[bot]@users.noreply.github.com"
          BRANCH="${{ github.event.inputs.branch_name }}"
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "Branch $BRANCH exists on remote. Checking out..."
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            echo "Creating new branch $BRANCH..."
            git checkout -b "$BRANCH"
          fi

      - name: Execute Gemini Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node .github/scripts/generate_docs.js

      - name: Commit and Push Changes
        run: |
          BRANCH="${{ github.event.inputs.branch_name }}"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: commit complete Priority 1-4 documentation and schema pack"
            git push origin "$BRANCH"
          fi

      - name: Ensure Pull Request Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.inputs.branch_name }}"
          if gh pr list --head "$BRANCH" --state open | grep -q "$BRANCH"; then
            echo "Pull request already open for $BRANCH."
          else
            gh pr create \
              --title "${{ github.event.inputs.pr_title }}" \
              --body "Automated documentation and catalogue schema pack generated via Gemini API. Requires human / ChatGPT review. Release hold remains active." \
              --head "$BRANCH" \
              --base main
          fi
          
