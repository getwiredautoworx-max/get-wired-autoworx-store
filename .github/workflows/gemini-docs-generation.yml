name: Gemini Direct Document Generator

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name to create'
        required: true
        default: 'feature/docs-schema-pack'
      pr_title:
        description: 'Pull Request Title'
        required: true
        default: 'docs: Add Knowledge Base, Schema, and Runbook Pack'

jobs:
  generate-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Feature Branch
        run: |
          git config user.name "gemini-code-agent[bot]"
          git config user.email "gemini-code-agent[bot]@users.noreply.github.com"
          git checkout -b ${{ github.event.inputs.branch_name }}

      - name: Execute Gemini Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm install @google/genai
          node .github/scripts/generate_docs.js

      - name: Commit and Push Changes
        run: |
          git add docs/ README.md
          git commit -m "docs: add Knowledge Base, Schema, Architecture, and Runbook pack"
          git push origin ${{ github.event.inputs.branch_name }} --force

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "${{ github.event.inputs.pr_title }}" \
            --body "Automated documentation and catalogue schema pack generated via Gemini API. Requires human / ChatGPT review. Release hold remains active." \
            --head ${{ github.event.inputs.branch_name }} \
            --base main
            
