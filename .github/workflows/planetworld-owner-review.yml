name: Planetworld isolated owner review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/planetworld-owner-review.yml'
      - 'scripts/enrich-planetworld-specifications.py'
      - 'scripts/apply-planetworld-exact-model-photos.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5 pillow beautifulsoup4
      - uses: actions/download-artifact@v4
        with:
          name: planetworld-reviewed-image-evidence
          path: /tmp
          run-id: 45616410859
          github-token: ${{ github.token }}
      - run: python scripts/apply-planetworld-exact-model-photos.py
      - run: python scripts/build-cloudflare-pages-public.py
        env:
          GW_INCLUDE_PREVIEW_ROUTES: '1'
      - run: python scripts/build-kicker-owner-preview.py
      - run: python scripts/stage-planetworld-batch.py
        env:
          GW_BATCH_OWNER_REVIEW: '1'
      - uses: actions/download-artifact@v4
        with:
          name: planetworld-model-spec-evidence
          path: /tmp
          run-id: 45598423453
          github-token: ${{ github.token }}
      - run: python scripts/enrich-planetworld-specifications.py
      - run: python scripts/localize-amplified-logo.py
      - name: Verify approved workbook repairs preserve all other cells and original archive
        run: python scripts/verify-planetworld-workbook-repairs.py
      - name: Check review scope
        run: |
          python -c 'import json; d=json.load(open("pages-public/assets/audio-catalogue-primary-preview.json"))["records"]; assert len(d)==693 and sum(p["brand"]=="Kicker" for p in d)==172; assert sum(p.get("specificationStatus")=="manufacturer_verified" for p in d)>=190; assert sum(p.get("imageReviewState")=="photo_pending" for p in d) in range(10,14); assert sum(p.get("imageReviewState")=="candidate_pending_review" for p in d)==3; assert next(p for p in d if p.get("getWiredSku")=="GWA-ONE-OX-CPAA3")["imageGatePassed"]; assert next(p for p in d if p.get("getWiredSku")=="GWA-ONE-OX-4990DVR")["imageGatePassed"]'
          test -z "$(find pages-public -type f -iname '*.xlsx' -print -quit)"
      - name: Validate the catalogue in a local browser
        env:
          URL: http://127.0.0.1:8765
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory pages-public > /tmp/planetworld-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 5 --retry-connrefused "$URL/owner-preview.html" > /dev/null
          npm install --no-save playwright
          npx playwright install chromium
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const base=process.env.URL;
          const browser=await chromium.launch({headless:true});
          for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
            const page=await browser.newPage({viewport});
            await page.goto(base+'/owner-preview.html');
            await page.locator('iframe').first().waitFor();
            const data=await (await page.request.get(base+'/assets/audio-catalogue-primary-preview.json')).json();
            const names=[...new Set(data.records.map(x=>x.brand))];
            assert.equal(names.length,12);
            for(const name of names){
              await page.goto(base+'/preview-audio.html?department=Car%20Audio');
              const link=page.locator('#brands a[aria-label="'+name+'"]').first();
              await link.waitFor({timeout:15000});
              if(name==='Amplified'){
                const logo=link.locator('img');
                await logo.waitFor({timeout:15000});
                await logo.evaluate(img=>img.decode());
                assert.ok((await logo.getAttribute('src')).includes('assets/brand-logos/amplified.png'));
                assert.ok(await logo.evaluate(img=>img.naturalWidth>=100));
                console.log('AMPLIFIED_LOGO_TILE_OK',viewport.width);
              }
              await page.goto(new URL(await link.getAttribute('href'),base).href);
              if(name==='Amplified'){
                const logo=page.locator('.brandHero img');
                await logo.waitFor({timeout:15000});
                await logo.evaluate(img=>img.decode());
                assert.ok(await logo.evaluate(img=>img.naturalWidth>=100));
                console.log('AMPLIFIED_LOGO_BRAND_OK',viewport.width);
              }
              const card=page.locator('#types a.typeCard').first();
              await card.waitFor({timeout:15000});
              await card.click();
              await page.locator('#products article.product').first().waitFor({timeout:15000});
              console.log('LOCAL_BRAND_NAV_OK',viewport.width,name);
            }
            await page.goto(base+'/preview-audio-brand.html?department=Car%20Audio&brand=Alpine');
            await page.getByText('Amplifiers',{exact:true}).first().click();
            const bbx=page.locator('article.product').filter({hasText:'BBX-F1200'}).first();
            await bbx.getByText('Technical specifications & features',{exact:true}).waitFor();
            await bbx.getByText('4 × 50 W',{exact:true}).waitFor();
            console.log('TECHNICAL_SPEC_UI_OK',viewport.width);
            await page.close();
          }
          await browser.close();
          console.log('PLANETWORLD_LOCAL_REVIEW_OK',base+'/owner-preview.html');
          JS

# Diagnose unmatched exact specification keys without lowering the coverage gate.
