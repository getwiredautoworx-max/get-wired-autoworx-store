name: Checkout Handler Security Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/store-checkout/**'
      - 'tests/checkout-security.test.cjs'
      - '.github/workflows/checkout-handler-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/store-checkout/**'
      - 'tests/checkout-security.test.cjs'
      - '.github/workflows/checkout-handler-tests.yml'

jobs:
  checkout-handler-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run existing source security assertions
        run: node --test tests/checkout-security.test.cjs
      - name: Type-check checkout Edge Function
        run: deno check supabase/functions/store-checkout/index.ts
      - name: Run mocked checkout handler tests
        run: deno test supabase/functions/store-checkout/handler.test.ts
