name: Deploy Planetworld Audio Preview
on:
  push:
    branches:
      - integration/current-main-refresh-2026-11-01
    paths:
      - "preview-store.html"
      - "assets/storefront-shell.css"
      - "index-new.html"
      - "preview-category.html"
      - "preview-products.html"
      - "preview-product.html"
      - "category.html"
      - "products.html"
      - "product.html"
      - "checkout-v2.html"
      - "returns-refunds.html"
      - "terms-and-conditions.html"
      - "privacy-policy.html"
      - ".github/workflows/deploy-planetworld-audio-preview.yml"
      - "preview-audio.html"
      - "preview-planetworld.html"
      - "preview-checkout.html"
      - "assets/audio-category-navigation.js"
      - "assets/planetworld-catalogue-preview.json"
      - "assets/planetworld-verified-models-preview.json"
      - "assets/asc-catalogue-pilot-preview.json"
      - "assets/asc-catalogue-pilot/*.jpg"
      - "scripts/build-cloudflare-pages-public.py"
permissions:
  contents: read
  deployments: write
concurrency:
  group: planetworld-audio-preview
  cancel-in-progress: false
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build isolated customer preview package
        env:
          GW_INCLUDE_PREVIEW_ROUTES: "1"
        run: python scripts/build-cloudflare-pages-public.py
      - name: Deploy isolated non-production Pages branch
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages-public --project-name=get-wired-autoworx-store --branch=planetworld-audio-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify deployed preview package privacy
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://planetworld-audio-preview.get-wired-autoworx-store.pages.dev'
          code=$(curl -L --max-redirs 5 --connect-timeout 5 --max-time 20 -sS -o /tmp/asc-public.json -w '%{http_code}' "$BASE/assets/asc-catalogue-pilot-preview.json")
          test "$code" = '200' || { echo "ASC public preview returned HTTP $code"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/asc-public.json').read_text(encoding='utf-8'))
          forbidden={'source_file','source_page','internal_sku','supplier_sku','source_image_pairing','image_crop_status','image_use_status','dealer_cost','indicative_price','public_sku'}
          bad=sorted({key for row in payload.get('records',[]) for key in row if key in forbidden})
          if bad:
              raise SystemExit(f"PUBLIC_PREVIEW_PRIVACY_FAIL fields={bad}")
          required={'id','title','catalogue_reference','fitment_as_printed','subcategory','image_url'}
          for row in payload.get('records',[]):
              if not required.issubset(row):
                  raise SystemExit(f"PUBLIC_PREVIEW_SHAPE_FAIL missing={sorted(required-set(row))}")
          print(f"DEPLOYED_ASC_PREVIEW_PRIVACY_PASS records={len(payload.get('records',[]))}")
          PY
          check_absent() {
            path="$1"
            marker="$2"
            curl -L --max-redirs 5 --connect-timeout 5 --max-time 15 -sS --path-as-is "$BASE$path" -o /tmp/gw-private-body
            if grep -aEqi "$marker" /tmp/gw-private-body; then
              echo "PUBLIC_DATA_EXPOSURE: $path"
              exit 1
            fi
          }
          check_absent '/HANDOVER_CURRENT.md' 'Current Execution Handover'
          check_absent '/suppliers/ASC/' '%PDF-'
          check_absent '/ASC-%20Aerials%20(1).pdf' '%PDF-'
          echo "DEPLOYED_PREVIEW_PRIVATE_SOURCE_BLOCKED_PASS"
