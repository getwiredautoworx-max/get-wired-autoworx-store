name: Deploy Approved Bright Store Preview
on:
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: planetworld-audio-preview
  cancel-in-progress: false
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build isolated customer preview package
        env:
          GW_INCLUDE_PREVIEW_ROUTES: "1"
          GW_INCLUDE_PRODUCT_IMAGES: "1"
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/build-cloudflare-pages-public.py
      - name: Deploy isolated non-production Pages branch
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages-public --project-name=get-wired-autoworx-store --branch=fix-approved-bright-shell-ca-yf6k
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact deployed SHA and customer-only package privacy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_BASE='https://fix-approved-bright-shell-ca-yf6k.get-wired-autoworx-store.pages.dev'
          BRANCH_BASE='https://fix-approved-bright-shell-ca-yf6k.get-wired-autoworx-store.pages.dev'
          expected="$GITHUB_SHA"
          ready=0
          for attempt in $(seq 1 24); do
            code=$(curl -L --max-redirs 5 --connect-timeout 5 --max-time 10 -sS -o /tmp/deployed-store.html -w '%{http_code}' "$DEPLOY_BASE/preview-store.html" || true)
            if [ "$code" = '200' ] && grep -Fq "GW_PREVIEW_SOURCE_SHA:$expected" /tmp/deployed-store.html; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = '1' || { echo "Isolated Pages alias did not serve exact SHA $expected"; exit 1; }
          check_absent() {
            base="$1"; path="$2"; marker="$3"
            curl -L --max-redirs 5 --connect-timeout 5 --max-time 10 -sS "$base$path" -o /tmp/privacy-body
            if grep -aEqi "$marker" /tmp/privacy-body; then
              echo "Public data exposure detected at $base$path ($marker)"
              exit 1
            fi
          }
          for base in "$DEPLOY_BASE" "$BRANCH_BASE"; do
            check_absent "$base" '/assets/planetworld-catalogue-preview.json' 'sourceWorkbooks|indicativePrice|hasStock|sourceFile'
            check_absent "$base" '/assets/audio-connections-catalogue-preview.json' 'indicativePrice|sourceFile|dealer'
            check_absent "$base" '/assets/electrocity-catalogue-preview.json' 'sourceFile|sourcePage|source_file|source_page|supplierCost|dealerCost|stockQuantity|stock_quantity'
            check_absent "$base" '/assets/asc-catalogue-pilot-preview.json' 'source_file|internal_sku|source_image_pairing|image_url'
            check_absent "$base" '/HANDOVER_CURRENT.md' 'Current Execution Handover'
            check_absent "$base" '/preview-planetworld.html' 'Planetworld Catalogue Preview'
          done
          review_code=$(curl -L --max-redirs 5 --connect-timeout 5 --max-time 10 -sS -o /tmp/review-route -w '%{http_code}' "$DEPLOY_BASE/preview-planetworld.html" || true)
          if [ "$review_code" = '200' ]; then
            if grep -aEqi 'Planetworld Catalogue Preview|sourceWorkbooks|indicativePrice|hasStock' /tmp/review-route; then
              echo "Internal supplier review content is publicly accessible."
              exit 1
            fi
          elif [ "$review_code" != '404' ]; then
            echo "Unexpected supplier review route status: HTTP $review_code"
            exit 1
          fi
          echo "DEPLOYED_EXACT_SHA_AND_PRIVACY_PASS $expected"
