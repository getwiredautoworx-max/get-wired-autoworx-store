name: Deploy Planetworld Audio Preview
on:
  push:
    branches:
      - fix/approved-bright-shell-category-product-ux-2026-11-01-v3
    paths:
      - "_redirects"
      - ".assetsignore"
      - "store.html"
      - "preview-store.html"
      - "assets/storefront-shell.css"
      - "assets/audio-connections-catalogue-preview.json"
      - "assets/product-image-pending.svg"
      - "assets/gw-logo.png"
      - "index-new.html"
      - "preview-category.html"
      - "preview-products.html"
      - "preview-product.html"
      - "category.html"
      - "products.html"
      - "product.html"
      - "checkout-v2.html"
      - "returns-refunds.html"
      - "terms-and-conditions.html"
      - "privacy-policy.html"
      - ".github/workflows/deploy-planetworld-audio-preview.yml"
      - "preview-audio.html"
      - "preview-planetworld.html"
      - "preview-checkout.html"
      - "assets/audio-category-navigation.js"
      - "assets/planetworld-catalogue-preview.json"
      - "assets/planetworld-verified-models-preview.json"
      - "assets/asc-catalogue-pilot-preview.json"
      - "assets/asc-catalogue-pilot/*.jpg"
      - "scripts/build-cloudflare-pages-public.py"
      - ".github/workflows/deploy-planetworld-audio-preview.yml"
permissions:
  contents: read
  deployments: write
concurrency:
  group: planetworld-audio-preview
  cancel-in-progress: false
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build isolated customer preview package
        env:
          GW_INCLUDE_PREVIEW_ROUTES: "1"
        run: python scripts/build-cloudflare-pages-public.py
      - name: Deploy isolated non-production Pages branch
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages-public --project-name=get-wired-autoworx-store --branch=planetworld-audio-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact deployed SHA and customer-only package privacy
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fix-approved-bright-shell-ca-yf6k.get-wired-autoworx-store.pages.dev'
          expected="$GITHUB_SHA"
          ready=0
          for attempt in $(seq 1 24); do
            code=$(curl -L --max-redirs 5 --connect-timeout 5 --max-time 10 -sS -o /tmp/deployed-store.html -w '%{http_code}' "$BASE/preview-store.html" || true)
            if [ "$code" = '200' ] && grep -Fq "GW_PREVIEW_SOURCE_SHA:$expected" /tmp/deployed-store.html; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = '1' || { echo "Hosted preview did not serve exact SHA $expected"; exit 1; }
          check_absent() {
            path="$1"; marker="$2"
            curl -L --max-redirs 5 --connect-timeout 5 --max-time 10 -sS "$BASE$path" -o /tmp/privacy-body
            if grep -aEqi "$marker" /tmp/privacy-body; then
              echo "Public data exposure detected at $path ($marker)"
              exit 1
            fi
          }
          check_absent '/assets/planetworld-catalogue-preview.json' 'sourceWorkbooks|indicativePrice|hasStock|sourceFile'
          check_absent '/assets/audio-connections-catalogue-preview.json' 'indicativePrice|sourceFile|dealer'
          check_absent '/assets/asc-catalogue-pilot-preview.json' 'source_file|internal_sku|source_image_pairing|image_url'
          check_absent '/HANDOVER_CURRENT.md' 'Current Execution Handover'
          review_code=$(curl -L --max-redirs 5 --connect-timeout 5 --max-time 10 -sS -o /tmp/review-route -w '%{http_code}' "$BASE/preview-planetworld.html" || true)
          test "$review_code" = '404' || { echo "Internal supplier review route unexpectedly public: HTTP $review_code"; exit 1; }
          echo "DEPLOYED_EXACT_SHA_AND_PRIVACY_PASS $expected"
