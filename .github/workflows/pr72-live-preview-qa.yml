name: PR72 Live Cloudflare Preview Browser QA
on:
  push:
    branches:
      - fix/pr70-storefront-owner-feedback-2026-10-20
    paths:
      - '.github/workflows/pr72-live-preview-qa.yml'
      - '.github/scripts/pr72-live-preview-qa.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr72-live-preview-browser-qa
  cancel-in-progress: true
jobs:
  verify-live-preview:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[preview-qa]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout review branch test harness
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install isolated Playwright runner
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser checks against deployed preview URL
        run: node .github/scripts/pr72-live-preview-qa.cjs
      - name: Upload live preview screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr72-live-preview-browser-qa-${{ github.run_number }}
          path: qa-live-preview-output/
          if-no-files-found: warn
          retention-days: 14
