name: Extract Buyer Guide PDF Text (Staging Only)

on:
  push:
    branches:
      - audit/buyer-guide-extraction
    paths-ignore:
      - 'staging/source-extracts/**'
      - 'HANDOVER*.md'
      - 'AI_HANDOVER*.md'
      - 'CATALOGUE_IMPORT_RULES.md'
      - 'PROPOSED_FINAL_CATEGORY_TREE_AND_MAPPING_PLAN_*.md'
      - 'staging/**/*.md'
      - 'staging/source-extracts/category-reconciliation*.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/buyer-guide-extraction
      - name: Install PDF utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Retrieve newly uploaded source PDFs from main without copying originals into audit history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          for pdf in "Feb Buyer's Guide.pdf" "March Buyer's Guide.pdf" "May Buyers Guide.pdf"; do
            if git cat-file -e "origin/main:$pdf" 2>/dev/null; then
              git show "origin/main:$pdf" > "/tmp/$pdf"
              echo "SOURCE_READY: $pdf"
            else
              echo "SOURCE_MISSING_ON_MAIN: $pdf"
              exit 1
            fi
          done
      - name: Extract source PDF text without changing originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/source-extracts
          : > staging/source-extracts/manifest.txt
          for pdf in "Feb Buyer's Guide.pdf" "March Buyer's Guide.pdf" "May Buyers Guide.pdf" "June Buyer's Guide (1).pdf" "July Buyer's Guide.pdf" "August Buyer's Guide.pdf" "September Buyer's Guide.pdf"; do
            source="$pdf"
            if [ -f "/tmp/$pdf" ]; then source="/tmp/$pdf"; fi
            if [ ! -f "$source" ]; then
              echo "MISSING: $pdf" | tee -a staging/source-extracts/manifest.txt
              continue
            fi
            base="${pdf%.pdf}"
            safe=$(printf '%s' "$base" | tr ' /' '__' | tr -cd '[:alnum:]_.-')
            pages=$(pdfinfo "$source" | awk '/^Pages:/ {print $2}')
            bytes=$(wc -c < "$source")
            out="staging/source-extracts/$safe.txt"
            pdftotext -layout -enc UTF-8 "$source" "$out"
            chars=$(wc -m < "$out")
            printf 'FILE: %s\nPAGES: %s\nBYTES: %s\nTEXT_CHARS: %s\nTEXT_FILE: %s\n---\n' "$pdf" "$pages" "$bytes" "$chars" "$out" | tee -a staging/source-extracts/manifest.txt
          done
      - name: OCR scanned June guide pages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y tesseract-ocr
          mkdir -p staging/source-extracts/june-page-images staging/source-extracts/june-ocr-pages
          if [ ! -s staging/source-extracts/June_Buyers_Guide_OCR.txt ]; then
            pdfinfo "June Buyer's Guide (1).pdf" | awk '/^Pages:/ {print $2}' > staging/source-extracts/june-page-count.txt
            # Render one page at a time at 200 DPI; OCR output retains page numbers.
            pages=$(cat staging/source-extracts/june-page-count.txt)
            for page in $(seq 1 "$pages"); do
              image="staging/source-extracts/june-page-images/page-$(printf '%02d' "$page")"
              pdftoppm -f "$page" -l "$page" -r 200 -gray -png -singlefile "June Buyer's Guide (1).pdf" "$image"
              tesseract "${image}.png" "staging/source-extracts/june-ocr-pages/page-$(printf '%02d' "$page")" -l eng --psm 6 2>/dev/null || true
            done
            : > staging/source-extracts/June_Buyers_Guide_OCR.txt
            for txt in staging/source-extracts/june-ocr-pages/page-*.txt; do
              [ -f "$txt" ] || continue
              printf '\n\n===== %s =====\n' "$(basename "$txt" .txt)" >> staging/source-extracts/June_Buyers_Guide_OCR.txt
              cat "$txt" >> staging/source-extracts/June_Buyers_Guide_OCR.txt
            done
            wc -m staging/source-extracts/June_Buyers_Guide_OCR.txt | tee staging/source-extracts/june-ocr-char-count.txt
          else
            echo "Existing June OCR found; skipping expensive repeat OCR."
          fi
      - name: Commit extraction text to audit branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/source-extracts/
          if git diff --cached --quiet; then
            echo "No extraction output to commit"
            exit 0
          fi
          git commit -m "staging: extract buyer guide PDF text for audit"
          git push origin HEAD:audit/buyer-guide-extraction
