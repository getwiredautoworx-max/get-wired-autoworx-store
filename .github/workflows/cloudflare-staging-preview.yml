name: Deploy review branch to Cloudflare Pages preview

on:
  push:
    branches:
      - review/staging-ui-verification-fixes-current
      - fix/pr70-storefront-owner-feedback-2026-10-20
    paths:
      - '.github/workflows/cloudflare-staging-preview.yml'
      - 'index.html'
      - 'index-new.html'
      - 'store.html'
      - 'assets/**'
      - 'category-navigation.js'
      - 'category.html'
      - 'product-details.js'
      - 'checkout-v2.html'
      - 'returns-refunds.html'
      - 'terms-and-conditions.html'
      - 'staging/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-staging-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy isolated review preview (not production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4

      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Repository Actions secret CLOUDFLARE_API_TOKEN is missing or unavailable to this workflow. Add a Cloudflare API token secret with Pages deployment permission; do not paste the token into source."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Repository Actions secret CLOUDFLARE_ACCOUNT_ID is missing or unavailable to this workflow."
            exit 1
          fi
          echo "Cloudflare deployment credential variables are present (values are not printed)."

      - name: Deploy review branch to non-production Pages preview
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=get-wired-autoworx-store --branch=pr72-owner-feedback
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
