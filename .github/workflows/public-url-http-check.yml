name: Public URL HTTP Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-url-http-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-http-check:
    name: Check public homepage and policy pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check homepage and both policy pages from GitHub-hosted runner
        shell: bash
        run: |
          set -uo pipefail
          base="https://getwiredautoworx-max.github.io/get-wired-autoworx-store"
          failed=0

          check_url() {
            local label="$1"
            local path="$2"
            local expected="$3"
            local body="/tmp/gw-${label}.html"
            local status
            echo "CHECK_LABEL=$label"
            echo "CHECK_URL=$base$path"
            if ! status="$(curl --retry 1 --retry-all-errors --retry-delay 2 -sS -L --connect-timeout 10 --max-time 35 -o "$body" -w '%{http_code}' "$base$path")"; then
              echo "HTTP_REQUEST_FAILED label=$label curl_status=$status"
              failed=1
              return
            fi
            echo "HTTP_STATUS_${label}=$status"
            if [ "$status" != "200" ]; then
              echo "FAIL: expected HTTP 200 for $label, got $status"
              failed=1
              return
            fi
            if ! grep -Eiq "$expected" "$body"; then
              echo "FAIL: HTTP 200 body did not contain expected page marker for $label"
              head -c 500 "$body" || true
              echo
              failed=1
              return
            fi
            echo "PASS: $label returned HTTP 200 and expected page marker"
          }

          check_url homepage "/" "Get Wired AutoWorx"
          check_url terms "/terms-and-conditions.html" "Terms.*Conditions"
          check_url returns "/returns-refunds.html" "Returns.*Refunds"
          check_url checkout "/checkout-v2.html" "Checkout|checkout|Your cart"
          check_url categories "/category.html" "Auto Electrical|Categories|category"
          check_url product "/product.html" "Product|product|Price on request"

          json_url="$base/assets/category-tree.json"
          json_status="$(curl --retry 1 --retry-all-errors --retry-delay 2 -sS -L --connect-timeout 10 --max-time 35 -o /tmp/gw-category-tree.json -w '%{http_code}' "$json_url")" || { echo "HTTP_REQUEST_FAILED label=category_tree"; failed=1; json_status="000"; }
          echo "CHECK_URL=$json_url"
          echo "HTTP_STATUS_category_tree=$json_status"
          if [ "$json_status" = "200" ] && jq -e 'type == "array" or type == "object"' /tmp/gw-category-tree.json >/dev/null && grep -Eiq "Auto Electrical|Spare Parts" /tmp/gw-category-tree.json; then
            echo "PASS: category tree returned valid JSON with expected category marker"
          else
            echo "FAIL: category tree status/content invalid"
            failed=1
          fi

          image_url="$base/assets/products_webp/GW-000174D6.webp"
          image_status="$(curl --retry 1 --retry-all-errors --retry-delay 2 -sS -L --connect-timeout 10 --max-time 35 -o /tmp/gw-exact-sku.webp -w '%{http_code} %{content_type}' "$image_url")" || { echo "HTTP_REQUEST_FAILED label=exact_sku_image"; failed=1; image_status="000"; }
          echo "CHECK_URL=$image_url"
          echo "HTTP_STATUS_and_CONTENT_TYPE_exact_sku_image=$image_status"
          if [[ "$image_status" == "200 image/webp"* ]] && file --mime-type -b /tmp/gw-exact-sku.webp | grep -qx "image/webp"; then
            echo "PASS: exact-SKU product image returned HTTP 200 with WebP content type"
          else
            echo "FAIL: exact-SKU image status/content type invalid"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "PUBLIC_URL_HTTP_CHECK_FAILED"
            exit 1
          fi
          echo "PUBLIC_URL_HTTP_CHECK_PASS: homepage, Terms and Conditions, and Returns/Refunds all returned HTTP 200."

      - name: Set up Node for safe public checkout browser test
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright browser
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify public checkout totals and block real order submission
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const base = 'https://getwiredautoworx-max.github.io/get-wired-autoworx-store';
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              const page = await browser.newPage({viewport:{width:390,height:844}});
              let interceptedOrder = false;
              page.on('pageerror', e => console.log('PUBLIC_CHECKOUT_PAGE_ERROR=' + e.message));
              await page.addInitScript(() => localStorage.setItem('gw_cart', JSON.stringify([{id:'00000000-0000-0000-0000-000000000001',qty:1}])));
              await page.route('**/rest/v1/products*', async route => {
                const req = route.request();
                const cors = {
                  'access-control-allow-origin':'*',
                  'access-control-allow-methods':'GET, OPTIONS',
                  'access-control-allow-headers':'apikey,authorization,content-type,prefer,range',
                  'access-control-max-age':'600'
                };
                if (req.method() === 'OPTIONS') return route.fulfill({status:204,headers:cors,body:''});
                return route.fulfill({
                  status:200, contentType:'application/json', headers:cors,
                  body:JSON.stringify([{
                    id:'00000000-0000-0000-0000-000000000001',
                    name:'Safe Test Verified Item',public_sku:'GW-TEST0001',price:100,
                    active:true,weight_kg:0.5,length_cm:10,width_cm:10,height_cm:10,
                    specifications:{price_status:'VERIFIED_PRICE'}
                  }])
                });
              });
              await page.route('**/functions/v1/store-checkout*', async route => {
                const req = route.request();
                const cors = {
                  'access-control-allow-origin':'*',
                  'access-control-allow-methods':'POST, OPTIONS',
                  'access-control-allow-headers':'apikey,authorization,content-type',
                  'access-control-max-age':'600'
                };
                if (req.method() === 'OPTIONS') return route.fulfill({status:204,headers:cors,body:''});
                if (req.method() === 'POST') {
                  interceptedOrder = true;
                  console.log('SAFE_TEST_ORDER_POST_INTERCEPTED_BEFORE_NETWORK=YES');
                  return route.fulfill({status:503,contentType:'application/json',headers:cors,body:JSON.stringify({error:'SAFE_TEST_BLOCKED: simulated response; no order was sent to Supabase'})});
                }
                return route.abort();
              });
              await page.goto(base+'/checkout-v2.html',{waitUntil:'domcontentloaded',timeout:45000});
              await page.locator('#checkout').waitFor({state:'visible',timeout:20000});
              const summary = await page.locator('#summaryTotal').innerText();
              const items = await page.locator('#items').innerText();
              console.log('PUBLIC_CHECKOUT_ITEM=' + items.replace(/\s+/g,' ').trim());
              console.log('PUBLIC_CHECKOUT_INITIAL_TOTAL=' + summary);
              if (!items.includes('Safe Test Verified Item')) throw new Error('Fixture product was not rendered.');
              if (!summary.includes('135')) throw new Error('Expected R135 total (R100 item + R35 packaging, free pickup) not rendered.');
              await page.locator('#fulfilment').selectOption('pickup');
              await page.locator('#name').fill('Safe Browser Test');
              await page.locator('#phone').fill('0700000000');
              const policyCheckboxCount = await page.locator('#form input[type="checkbox"]').count();
              console.log('CHECKOUT_POLICY_ACCEPTANCE_CHECKBOX_COUNT=' + policyCheckboxCount);
              await page.locator('#form button[type="submit"]').click();
              await page.waitForFunction(() => document.querySelector('#msg')?.textContent.includes('SAFE_TEST_BLOCKED'), null, {timeout:10000});
              if (!interceptedOrder) throw new Error('Expected checkout submission to be intercepted before network.');
              console.log('PUBLIC_CHECKOUT_SAFE_TEST_PASS: totals and pickup flow rendered; order POST intercepted before network.');
              if (policyCheckboxCount === 0) console.log('RELEASE_READINESS_NOTE: checkout currently has no policy-acceptance checkbox.');
            } finally {
              await browser.close();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Diagnose live public product grid and iframe routing
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              const page = await browser.newPage({viewport:{width:390,height:844}});
              page.on('request', req => {
                if (req.url().includes('supabase.co/rest/v1/products')) console.log('LIVE_PRODUCT_REQUEST='+req.method()+' '+req.url().slice(0,500));
              });
              page.on('response', res => {
                if (res.url().includes('supabase.co/rest/v1/products')) console.log('LIVE_PRODUCT_RESPONSE='+res.status()+' '+res.url().slice(0,500));
                if (res.url().includes('index-new.html') || res.url().endsWith('/store') || res.url().endsWith('/store/')) console.log('LIVE_PAGE_RESPONSE='+res.status()+' '+res.url());
              });
              page.on('requestfailed', req => {
                if (req.url().includes('supabase.co/rest/v1/products')) console.log('LIVE_PRODUCT_REQUEST_FAILED='+req.failure()?.errorText+' '+req.url().slice(0,500));
              });
              const response = await page.goto('https://www.getwiredauto.co.za/store',{waitUntil:'domcontentloaded',timeout:45000});
              console.log('LIVE_STORE_HTTP_STATUS='+(response?response.status():'no-response'));
              console.log('LIVE_STORE_FINAL_URL='+page.url());
              await page.waitForTimeout(6000);
              console.log('LIVE_STORE_FRAMES='+JSON.stringify(page.frames().map(f=>({name:f.name(),url:f.url()}))));
              const frame = page.frames().find(f=>f.url().includes('index-new.html')) || page.frames().find(f=>f!==page.mainFrame());
              if (!frame) {
                console.log('LIVE_GRID_DIAGNOSTIC_WARNING=No embedded store frame was found.');
              } else {
                const info = await frame.evaluate(() => ({
                  url:location.href,
                  title:document.title,
                  body:document.body?.innerText?.slice(0,1000)||'',
                  productCount:document.querySelector('#productCount')?.innerText||'',
                  allProductsText:document.querySelector('#allProductsGrid')?.innerText?.slice(0,500)||'',
                  searchInput:!!document.querySelector('#searchInput'),
                  allProductsLink:!!document.querySelector('#allProductsLink')
                })).catch(e=>({error:e.message,url:frame.url()}));
                console.log('LIVE_GRID_INITIAL_DIAGNOSTIC='+JSON.stringify(info));
                const search = frame.locator('#searchInput');
                if (await search.count()) {
                  await search.fill('GW-B4F502E6');
                  await page.waitForTimeout(3000);
                  const after = await frame.evaluate(() => ({
                    productCount:document.querySelector('#productCount')?.innerText||'',
                    allProductsText:document.querySelector('#allProductsGrid')?.innerText?.slice(0,800)||'',
                    productCards:document.querySelectorAll('#allProductsGrid .product').length,
                    body:document.body?.innerText?.slice(0,1000)||''
                  })).catch(e=>({error:e.message}));
                  console.log('LIVE_GRID_SKU_SEARCH_DIAGNOSTIC='+JSON.stringify(after));
                }
              }
              const policyLinks = await frame.locator('a').evaluateAll(anchors => anchors
                .filter(a => /terms|returns|refund/i.test((a.textContent || '') + ' ' + (a.getAttribute('href') || '')))
                .map(a => ({text:(a.textContent || '').trim(),href:a.href})));
              console.log('LIVE_POLICY_LINKS='+JSON.stringify(policyLinks));
              for (const link of policyLinks) {
                try {
                  const response = await page.request.get(link.href,{timeout:20000});
                  const body = await response.text().catch(()=> '');
                  console.log('LIVE_POLICY_LINK_RESPONSE='+response.status()+' requested='+link.href+' final='+response.url()+' contentType='+(response.headers()['content-type']||'')+' htmlDocument='+(/<html|<body/i.test(body))+' markdownHeading='+(/^# /m.test(body))+' preview='+JSON.stringify(body.slice(0,180)));
                } catch (e) {
                  console.log('LIVE_POLICY_LINK_REQUEST_FAILED='+link.href+' error='+e.message);
                }
              }
              console.log('LIVE_GRID_DIAGNOSTIC_COMPLETE');
            } finally {
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
