name: Refresh Category Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-category-snapshot.yml'
      - 'scripts/refresh_category_snapshot.py'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-category-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install snapshot refresh dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Refresh active category counts
        run: python scripts/refresh_category_snapshot.py
      - name: Commit changed snapshot only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Get Wired AutoWorx Category Snapshot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/category-tree.json
          git diff --cached --quiet && echo 'Category snapshot unchanged' && exit 0
          git commit -m '[category-snapshot] Refresh active product category counts'
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python -m pip install --disable-pip-version-check requests
            python scripts/refresh_category_snapshot.py
            git add assets/category-tree.json
            git diff --cached --quiet && echo 'Category snapshot already current after rebase retry' && exit 0
            git commit -m '[category-snapshot] Refresh active product category counts'
          fi
          git push
