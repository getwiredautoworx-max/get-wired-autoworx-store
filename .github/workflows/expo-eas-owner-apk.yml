name: Expo EAS Owner APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/expo-eas-owner-apk.yml'
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/expo-eas-owner-apk.yml'
permissions:
  contents: read
jobs:
  build-owner-apk:
    name: Build owner APK with Expo EAS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm Expo secret is available without exposing it
        shell: bash
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::GitHub secret EXPO_KEY is missing or unavailable to this run."
            exit 1
          fi
          echo "EXPO_KEY is available to the workflow (value not printed)."
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Link or initialize EAS project
        run: npx --yes eas-cli@latest init --force --non-interactive
      - name: Record linked EAS project configuration
        shell: bash
        run: |
          node -e "const c=require('./app.json').expo; console.log('Expo slug:', c.slug); console.log('Android package:', c.android.package); console.log('EAS project ID:', c.extra?.eas?.projectId || 'MISSING'); if (!c.extra?.eas?.projectId) process.exit(1)"
      - name: Build Android APK on EAS
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > eas-build-result.json
      - name: Download completed APK
        shell: bash
        run: |
          BUILD_ID="$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('eas-build-result.json','utf8')); const b=Array.isArray(d)?d[0]:d; const id=b?.id || b?.buildId; if(!id) process.exit(2); process.stdout.write(id)")"
          echo "EAS build ID: $BUILD_ID"
          npx --yes eas-cli@latest build:download --build-id "$BUILD_ID" --non-interactive
          mkdir -p dist
          APK="$(find . -maxdepth 2 -type f -name '*.apk' -not -path './node_modules/*' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::EAS build completed but no APK was downloaded."
            exit 1
          fi
          cp "$APK" dist/get-wired-autoworx-owner-preview.apk
          sha256sum dist/get-wired-autoworx-owner-preview.apk
      - name: Upload owner APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: get-wired-autoworx-expo-owner-apk
          path: android-app/dist/get-wired-autoworx-owner-preview.apk
          if-no-files-found: error
          retention-days: 14
