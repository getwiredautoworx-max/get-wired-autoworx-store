name: Product image endpoint and source QA

on:
  pull_request:
    branches:
      - recovery/approved-preview-index-new
    paths:
      - 'index-new.html'
      - 'category.html'
      - 'products.html'
      - 'product.html'
      - 'category-navigation.js'
      - 'assets/product-image-fallback.js'
      - '.github/workflows/product-image-endpoint-check.yml'

permissions:
  contents: read

jobs:
  image-source-and-network-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate inline JavaScript syntax and image-source guards
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = ['index-new.html', 'category.html', 'products.html', 'product.html'];
          let scriptsChecked = 0;
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            for (const [index, match] of [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)].entries()) {
              if (/\bsrc\s*=/.test(match[1])) continue;
              try { new Function(match[2]); scriptsChecked++; }
              catch (error) { throw new Error(file + ' inline script ' + index + ': ' + error.message); }
            }
          }
          const home = fs.readFileSync('index-new.html', 'utf8');
          const listing = fs.readFileSync('products.html', 'utf8');
          const detail = fs.readFileSync('product.html', 'utf8');
          const category = fs.readFileSync('category.html', 'utf8');
          const fallback = fs.readFileSync('assets/product-image-fallback.js', 'utf8');
          const bridge = fs.readFileSync('category-navigation.js', 'utf8');
          const checks = [
            ['homepage cards use product image_url', /esc\(p\.image_url\|\|PRODUCT_PLACEHOLDER\)/.test(home)],
            ['product listing uses product image_url', /esc\(p\.image_url\|\|/.test(listing)],
            ['product detail uses product image_url', /esc\(p\.image_url\|\|/.test(detail)],
            ['iframe fallback preserves canonical endpoint', fallback.includes('product-image') && fallback.includes('functions')],
            ['iframe fallback preserves neutral placeholder', fallback.includes('product-placeholder')],
            ['category bridge does not call generated illustration override', !/installCategoryIllustrations\(frame\);/.test(bridge)],
            ['security category uses key/remote photo', category.includes('photo-1693344150104-5ffb54127eff')],
            ['trailer category uses towing photo', category.includes('photo-1747711475650-b222ac557e58')],
            ['accessories category uses interior/accessory photo', category.includes('photo-1626966473515-71dc32f2aedd')]
          ];
          for (const [name, pass] of checks) {
            console.log((pass ? 'PASS ' : 'FAIL ') + name);
            if (!pass) process.exitCode = 1;
          }
          console.log('PASS inline script syntax count=' + scriptsChecked);
          NODE

      - name: Verify known exact-SKU images through the read-only product-image endpoint
        env:
          IMAGE_BASE: https://ojytykqpvonxvepprgbh.supabase.co/functions/v1/product-image
        run: |
          node <<'NODE'
          const base = process.env.IMAGE_BASE;
          const skus = ['GW-000174D6', 'GW-3DE84AF0'];
          const photoIds = [
            'photo-1486262715619-67b85e0b08d3',
            'photo-1693344150104-5ffb54127eff',
            'photo-1660022305751-54f903c7c4c8',
            'photo-1576792105433-00d9b512ae6e',
            'photo-1504148455328-c376907d081c',
            'photo-1504280390367-361c6d9f38f4',
            'photo-1747711475650-b222ac557e58',
            'photo-1626966473515-71dc32f2aedd'
          ];
          (async () => {
            for (const sku of skus) {
              const url = base + '?sku=' + encodeURIComponent(sku);
              const response = await fetch(url, { signal: AbortSignal.timeout(25000) });
              const bytes = Buffer.from(await response.arrayBuffer());
              const type = (response.headers.get('content-type') || '').toLowerCase();
              const webp = bytes.length >= 12 && bytes.toString('ascii', 0, 4) === 'RIFF' && bytes.toString('ascii', 8, 12) === 'WEBP';
              console.log(JSON.stringify({ sku, status: response.status, contentType: type, bytes: bytes.length, webpSignature: webp }));
              if (response.status !== 200 || !type.startsWith('image/') || bytes.length < 100 || (!webp && !type.includes('jpeg'))) {
                throw new Error('Image endpoint failed validation for ' + sku);
              }
            }
            for (const photoId of photoIds) {
              const url = 'https://images.unsplash.com/' + photoId + '?auto=format&fit=crop&w=960&q=82';
              const response = await fetch(url, { signal: AbortSignal.timeout(25000) });
              const bytes = Buffer.from(await response.arrayBuffer());
              const type = (response.headers.get('content-type') || '').toLowerCase();
              console.log(JSON.stringify({ categoryPhoto: photoId, status: response.status, contentType: type, bytes: bytes.length }));
              if (response.status !== 200 || !type.startsWith('image/') || bytes.length < 100) {
                throw new Error('Category photo failed validation: ' + photoId);
              }
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Install Playwright for real preview browser verification
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify latest branch preview photos and responsive grid in a real browser
        env:
          PREVIEW_BASE: https://fix-pr70-category-image-pari.get-wired-autoworx-store.pages.dev
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const base = process.env.PREVIEW_BASE;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            let currentHtml = '';
            let current = false;
            for (let attempt = 0; attempt < 18; attempt++) {
              const response = await fetch(base + '/category.html?qa=' + Date.now(), { signal: AbortSignal.timeout(20000) });
              currentHtml = await response.text();
              if (response.status === 200 && currentHtml.includes('photo-1747711475650-b222ac557e58') &&
                  currentHtml.includes('photo-1693344150104-5ffb54127eff')) {
                current = true;
                console.log(JSON.stringify({ previewSource: 'current candidate marker found', status: response.status, attempt: attempt + 1 }));
                break;
              }
              console.log(JSON.stringify({ previewSource: 'waiting for latest Pages deployment', status: response.status, attempt: attempt + 1 }));
              await sleep(10000);
            }
            if (!current) throw new Error('Branch preview did not serve the latest category-photo source marker; refusing to test a stale deployment.');
            const browser = await chromium.launch({ headless: true });
            try {
              for (const width of [1440, 390]) {
                const page = await browser.newPage({ viewport: { width, height: 900 } });
                const failedImages = [];
                page.on('response', response => {
                  if (response.request().resourceType() === 'image' && response.status() >= 400) {
                    failedImages.push({ url: response.url(), status: response.status() });
                  }
                });
                const response = await page.goto(base + '/category.html', { waitUntil: 'domcontentloaded', timeout: 45000 });
                if (!response || response.status() >= 400) throw new Error('Category page failed at viewport ' + width);
                await page.waitForSelector('.card-art img', { timeout: 45000 });
                await page.locator('.card-art img').evaluateAll(imgs => imgs.forEach(img => { img.loading = 'eager'; }));
                await page.waitForFunction(() => {
                  const imgs = [...document.querySelectorAll('.card-art img')];
                  return imgs.length > 0 && imgs.every(img => img.complete);
                }, null, { timeout: 60000 });
                const result = await page.evaluate(() => {
                  const grid = document.querySelector('#grid');
                  const imgs = [...document.querySelectorAll('.card-art img')].map(img => ({
                    alt: img.alt, src: img.currentSrc || img.src, width: img.naturalWidth, height: img.naturalHeight
                  }));
                  return {
                    title: document.title,
                    columns: getComputedStyle(grid).gridTemplateColumns.split(' ').length,
                    cards: imgs.length,
                    images: imgs
                  };
                });
                console.log(JSON.stringify({ viewport: width, ...result, failedImages }));
                if (!result.cards || result.images.some(img => img.width < 1 || img.height < 1)) {
                  throw new Error('One or more category images did not decode at viewport ' + width);
                }
                if (width > 900 && result.columns !== 3) throw new Error('Desktop category grid is not three columns');
                if (width <= 500 && result.columns !== 2) throw new Error('Mobile category grid is not two columns');
                if (failedImages.length) throw new Error('Image HTTP errors found at viewport ' + width);
                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
