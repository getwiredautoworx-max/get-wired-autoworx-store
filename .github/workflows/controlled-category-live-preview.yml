name: One-time controlled category live-data preview
on:
  push:
    branches:
      - finaltest/category-live-preview-2026-10-20
    paths:
      - '.github/workflows/controlled-category-live-preview.yml'
permissions:
  contents: read
  deployments: write
concurrency:
  group: controlled-category-live-preview-2026-10-20
  cancel-in-progress: false
jobs:
  deploy-preview:
    name: Deploy isolated non-production category preview
    if: github.ref == 'refs/heads/finaltest/category-live-preview-2026-10-20'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: finaltest/category-live-preview-2026-10-20
      - name: Verify required Cloudflare secrets are available
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN is unavailable"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is unavailable"; exit 1; }
          echo "Cloudflare credentials present; values are not printed."
      - name: Deploy to unique review-only Pages branch
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=get-wired-autoworx-store --branch=category-live-review-2026-10-20
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
