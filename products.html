<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#02060d"><title>Products | Get Wired AutoWorx</title><style>
:root{--bg:#02060d;--panel:#071222;--blue:#08a5ff;--red:#ff1c2d;--white:#f5f8fc;--muted:#9fb1c4;--line:#12456c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#0d2d4b,#030914 42%,#02060d 78%);color:var(--white);font-family:Arial,Helvetica,sans-serif}.header{position:sticky;top:0;z-index:5;background:rgba(2,6,13,.97);backdrop-filter:blur(12px);border-bottom:1px solid #0c3b60}.head{max-width:1400px;margin:auto;min-height:92px;display:flex;align-items:center;gap:16px;padding:8px 18px}.logo{height:76px;width:min(360px,65vw);object-fit:contain}.back{border:1px solid #087fe0;background:#06111e;color:#fff;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer}.search{margin-left:auto}.search input{width:min(430px,42vw);background:#050d18;border:2px solid #087fe0;border-radius:28px;padding:13px 18px;color:#fff;font-size:15px;outline:none}.cart{margin-left:6px;position:relative;background:#ff1c2d;color:#fff;border:0;border-radius:9px;padding:12px 15px;font-weight:900;cursor:pointer}.badge{position:absolute;right:-8px;top:-8px;background:#fff;color:#ff1c2d;border-radius:50%;min-width:22px;text-align:center;padding:3px;font-size:12px}.wrap{max-width:1400px;margin:auto;padding:22px 20px 80px}.crumb{color:#8fa4b8;font-size:13px;margin-bottom:12px}.crumb a{color:#20b1ff;text-decoration:none}.title{display:flex;align-items:end;justify-content:space-between;gap:15px;border-bottom:1px solid #12456c;padding-bottom:14px;margin-bottom:20px}.title h1{font-size:32px;margin:0}.title p{margin:5px 0 0;color:var(--muted)}.count{color:#8fa4b8;font-size:13px}.tools{display:flex;gap:10px;margin-bottom:16px}.tools select,.tools input{background:#06111e;color:#fff;border:1px solid #155078;border-radius:8px;padding:10px}.tools input{flex:1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:linear-gradient(145deg,#0b1b30,#050d18);border:1px solid #124e77;border-radius:12px;overflow:hidden;padding:12px;display:flex;flex-direction:column}.img{height:190px;background:radial-gradient(circle,#123452,#040912);display:grid;place-items:center;border-radius:8px;overflow:hidden}.img img{max-width:100%;max-height:180px;object-fit:contain}.img.no-image:after{content:'Image not available';color:var(--muted);font-size:12px;font-weight:700}.name{font-weight:800;font-size:15px;line-height:1.25;margin-top:12px}.sku{font-size:11px;color:#8fa4b8;margin-top:6px}.price{font-size:19px;font-weight:900;margin-top:9px}.stock{font-size:12px;color:#8fa4b8;margin-top:4px}.add{margin-top:auto;padding:10px;border:0;border-radius:8px;background:#ff1c2d;color:#fff;font-weight:900;cursor:pointer}.add:disabled{background:#39434d;cursor:not-allowed}.empty,.error{padding:25px;border:1px solid #12456c;border-radius:12px;background:#07111e;color:var(--muted)}.error{border-color:#ff1c2d;color:#ffd7da}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#06111e;border:1px solid #08a5ff;border-radius:10px;padding:12px 18px;display:none;z-index:20}.toast.show{display:block}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.search{display:none}.title h1{font-size:27px}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.head{min-height:78px}.logo{height:64px}.back{padding:9px 11px}.wrap{padding:16px 10px 80px}.img{height:150px}.img img{max-height:145px}.name{font-size:13px}.price{font-size:17px}.tools{flex-direction:column}}

.groupSections{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:22px}
.groupSection{background:linear-gradient(145deg,#fff,#edf5fb);border:1px solid #cbdbe7;border-radius:12px;padding:16px;box-shadow:0 3px 12px rgba(25,55,80,.06);color:#173650}
.groupSection h2{font-size:18px;margin:0 0 8px;color:#12344f}
.groupSection p{font-size:13px;color:#53687a;line-height:1.45;margin:0}
.groupEmpty{margin-top:10px;padding:12px;border:1px dashed #b9d2e3;border-radius:8px;background:#f8fafc;color:#53687a;font-size:13px}
.stagingNotice{padding:14px 16px;border:1px solid #b9d2e3;border-left:4px solid #087fce;border-radius:10px;background:#fff;color:#173650;margin-bottom:18px;line-height:1.5}
</style></head><body><header class="header"><div class="head"><button class="back" onclick="history.back()">← BACK</button><img class="logo" src="assets/gw-logo.png" alt="Get Wired AutoWorx"><div class="search"><input id="topSearch" placeholder="Search products, brands, or part numbers..."></div><button class="cart" onclick="location.href='checkout-v2.html'">CART <span class="badge" id="badge">0</span></button></div></header><main class="wrap"><div class="crumb"><a href="store.html">Home</a> / <a id="categoryLink" href="category.html">Categories</a> / <span id="crumbName">Products</span></div><div class="title"><div><h1 id="heading">PRODUCTS</h1><p>Browse the products in this sub-category.</p></div><div class="count" id="count"></div></div><div class="tools"><input id="filter" placeholder="Filter this category..."><select id="sort"><option value="default">Sort: Recommended</option><option value="price-low">Price: Low to High</option><option value="price-high">Price: High to Low</option><option value="name">Name A–Z</option></select></div><div class="grid" id="grid"><div class="empty">Loading products…</div></div></main><div class="toast" id="toast"></div><script>
const SUPABASE_URL='https://ojytykqpvonxvepprgbh.supabase.co',KEY='sb_publishable_rSKAEYqQheFAljUmro6uGA_MmBm-l3w';const params=new URLSearchParams(location.search),category=params.get('category'),rootSlug=params.get('root'),subcategorySlug=params.get('subcategory');let products=[],categoryName='Products';
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');const money=v=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(Number(v||0));
async function api(path){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw new Error('Catalogue request failed');return r.json()}async function apiAll(path,pageSize=1000){const all=[];for(let offset=0;;offset+=pageSize){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Range-Unit':'items',Range:offset+'-'+(offset+pageSize-1)}});if(!r.ok)throw new Error('Catalogue request failed');const batch=await r.json();if(!Array.isArray(batch))throw new Error('Unexpected catalogue response');all.push(...batch);if(batch.length<pageSize)break;}return all}
function productImageError(img){img.onerror=null;img.style.display='none';img.parentNode.classList.add('no-image')}function cart(){try{return JSON.parse(localStorage.getItem('gw_cart')||'[]')}catch(e){return []}}function saveCart(c){localStorage.setItem('gw_cart',JSON.stringify(c));updateBadge()}function updateBadge(){document.getElementById('badge').textContent=cart().reduce((s,x)=>s+Number(x.qty||0),0)}
function priceVerified(p){return Boolean(p&&Number(p.price)>0&&(!p.specifications||p.specifications.price_status!=='QUOTE_REQUIRED'))}function priceQuoteUrl(p){return 'https://wa.me/27744884234?text='+encodeURIComponent('Hi Get Wired AutoWorx, please confirm the current selling price and availability for '+p.name+' (SKU '+p.public_sku+').')}function add(p){if(!priceVerified(p)){window.open(priceQuoteUrl(p),'_blank','noopener');return}const c=cart();const x=c.find(x=>x.id===p.id);if(x)x.qty=(Number(x.qty)||0)+1;else c.push({id:p.id,public_sku:p.public_sku,name:p.name,price:p.price,image_url:p.image_url,qty:1});saveCart(c);toast('Added to cart: '+p.name)}function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function render(){const q=(document.getElementById('filter').value+' '+document.getElementById('topSearch').value).trim().toLocaleLowerCase('en-ZA');const terms=q.split(/\s+/).filter(Boolean);let list=products.filter(p=>{const hay=[p.name,p.public_sku,p.description].join(' ').toLocaleLowerCase('en-ZA');return !terms.length||terms.every(term=>hay.includes(term))});const s=document.getElementById('sort').value;if(s==='price-low')list.sort((a,b)=>Number(a.price)-Number(b.price));if(s==='price-high')list.sort((a,b)=>Number(b.price)-Number(a.price));if(s==='name')list.sort((a,b)=>String(a.name).localeCompare(String(b.name)));document.getElementById('count').textContent=list.length+' products';document.getElementById('grid').innerHTML=list.length?list.map(p=>{const verified=priceVerified(p);return `<article class="card" data-id="${esc(p.id)}"><a href="product.html?id=${encodeURIComponent(p.id)}" style="text-decoration:none;color:inherit"><div class="img"><img src="${'assets/products_webp/'+encodeURIComponent(p.public_sku||'')+'.webp'}" alt="${esc(p.name)}" loading="lazy" data-sku="${esc(p.public_sku||'')}" onerror="productImageError(this)"></div><div class="name">${esc(p.name)}</div><div class="sku">SKU: ${esc(p.public_sku||'—')}</div><div class="price">${verified?money(p.price):'Price on request'}</div><div class="stock">${!verified?'Current price must be confirmed':(Number(p.stock_quantity||0)>0?'In stock':'Stock to confirm')}</div></a><button class="add" data-add-id="${esc(p.id)}" ${verified&&Number(p.stock_quantity||0)<=0?'disabled':''}>${!verified?'REQUEST PRICE':(Number(p.stock_quantity||0)>0?'ADD TO CART':'OUT OF STOCK')}</button></article>`}).join(''):'<div class="empty">No products match this search in this category.</div>'}
document.getElementById('grid').addEventListener('click',e=>{const b=e.target.closest('[data-add-id]');if(!b||b.disabled)return;const p=products.find(x=>x.id===b.dataset.addId);if(p)add(p)});

function slugText(v){return String(v||'').toLocaleLowerCase('en-ZA').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim()}
async function renderStagedGroups(){
  const grid=document.getElementById('grid'),tools=document.querySelector('.tools'),title=document.getElementById('heading'),crumb=document.getElementById('crumbName'),count=document.getElementById('count');
  try{
    const [hr,gr]=await Promise.all([fetch('assets/store-category-hierarchy.json',{cache:'no-store'}),fetch('assets/product-grouping-rules.json',{cache:'no-store'})]);
    if(!hr.ok||!gr.ok)throw new Error('Staged category/grouping configuration unavailable');
    const hierarchy=await hr.json(),grouping=await gr.json();
    const root=hierarchy.roots.find(x=>x.slug===rootSlug);
    if(!root)throw new Error('Main category not found');
    const sub=(root.subcategories||[]).find(x=>x.slug===subcategorySlug);
    if(!sub)throw new Error('Subcategory not found');
    document.title=sub.label+' | Get Wired AutoWorx';
    title.textContent=sub.label;
    crumb.textContent=sub.label;
    document.querySelector('.title p').textContent='Products are organised into clear groups so individual items and sets stay separate.';
    document.getElementById('categoryLink').href='category.html?root='+encodeURIComponent(root.slug);
    if(tools)tools.style.display='none';
    const searchBox=document.getElementById('topSearch');
    if(searchBox){searchBox.disabled=true;searchBox.placeholder='Product search available after catalogue import';searchBox.setAttribute('aria-label','Product search available after catalogue import');}
    grid.style.display='none';
    let candidates=(grouping.groups||[]).filter(g=>g.root_slug===root.slug);
    const label=slugText(sub.label);
    const keywordRules=[
      {keys:['screwdriver'],groups:['screwdrivers-individual','screwdriver-sets']},
      {keys:['spanner','wrench'],groups:['spanners-individual','spanner-sets']},
      {keys:['socket'],groups:['sockets-individual','socket-sets']},
      {keys:['plier'],groups:['pliers-individual','plier-sets']},
      {keys:['clip','fastener'],groups:['clips-individual','clips-sets']},
      {keys:['relay'],groups:['relays']},
      {keys:['switch'],groups:['switches']},
      {keys:['winch'],groups:['winches','winch-spares','trailer-winch-applications']},
      {keys:['wiring','connector','terminal'],groups:['wiring-connectors']}
    ];
    const match=keywordRules.find(x=>x.keys.some(k=>label.includes(k)));
    if(match)candidates=candidates.filter(g=>match.groups.includes(g.group_slug));
    else if(/automotive tools|workshop tools|tools hardware|consumables/.test(label)){}
    else candidates=[];
    if(!candidates.length)candidates=[{group_slug:'products-in-subcategory',label:'Products in '+sub.label,order:1,note:'Products will be grouped after SKU-level catalogue validation.'}];
    candidates.sort((a,b)=>(a.order||0)-(b.order||0));
    const sections=document.createElement('div');sections.className='groupSections';
    sections.innerHTML='<div class="stagingNotice"><strong>Catalogue rebuild in progress.</strong> This staged page intentionally does not display the old catalogue. Products will appear here after the ASC source headings, SKU matches, images, applications and pricing status have been checked and the replacement catalogue is approved for import.</div>'+candidates.map(g=>'<section class="groupSection"><h2>'+esc(g.label)+'</h2><p>'+esc(g.note||'Products in this group will be listed together.')+'</p><div class="groupEmpty">No replacement-catalogue products loaded yet. No legacy products are being shown.</div></section>').join('');
    document.querySelector('.title').after(sections);
    count.textContent=candidates.length+' product groups';
  }catch(e){console.error('Staged product groups:',e);grid.style.display='block';grid.innerHTML='<div class="error">Unable to load the staged product groups. Please try again.</div>'}
}
async function main(){if(rootSlug&&subcategorySlug){await renderStagedGroups();return}if(!category){location.replace('category.html');return}try{const cats=await api('categories?select=id,name,parent_id,slug');const c=cats.find(x=>x.id===category);if(!c)throw new Error('Category not found');categoryName=c.name;document.title=c.name+' | Get Wired AutoWorx';document.getElementById('heading').textContent=c.name;document.getElementById('crumbName').textContent=c.name;document.getElementById('categoryLink').href='category.html?id='+encodeURIComponent(c.parent_id||c.id);products=await apiAll('products?select=id,name,public_sku,description,price,stock_quantity,image_url,specifications,active&category_id=eq.'+encodeURIComponent(category)+'&active=eq.true&order=name.asc');render()}catch(e){document.getElementById('grid').innerHTML='<div class="error">Unable to load products right now. Please try again.</div>'}}
document.getElementById('filter').addEventListener('input',render);document.getElementById('topSearch').addEventListener('input',render);document.getElementById('sort').addEventListener('change',render);updateBadge();main();
</script><div id="gwSourcePartButton" style="position:fixed;right:16px;bottom:16px;z-index:1200"><a href="index-new.html?open=request#home" style="display:block;background:#ff1c2d;color:#fff;border-radius:9px;padding:12px 16px;font-weight:900;text-decoration:none">CAN'T FIND IT? SOURCE A PART</a></div></body></html>
