<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Departments | Get Wired AutoWorx</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b3d;font:15px Arial,sans-serif}.top{background:#12344f;color:white;padding:14px}.top a{color:white}.wrap{max-width:1200px;margin:auto;padding:18px}.notice{padding:12px;background:#fff3cd;border:1px solid #e4c76a;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile,.product{background:white;border:1px solid #d5e0e9;border-radius:10px;padding:14px;min-width:0}.quoteLink{display:block;margin-top:12px;padding:11px;border-radius:7px;background:#087fe0;color:white;text-align:center;text-decoration:none;font-weight:800}.tile button{width:100%;padding:14px;border:1px solid #1688d0;background:#f7fbff;border-radius:8px;color:#17324a;font-weight:bold;text-align:left}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filters button{padding:9px 12px;border:1px solid #1688d0;border-radius:8px;background:white}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.muted{color:#63788b;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.products{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.grid,.products{grid-template-columns:1fr}}</style></head><body><header class="top"><a href="preview-store.html">← Back to store</a> · Get Wired AutoWorx — Audio</header><main class="wrap"><h1>Audio & Entertainment</h1><p class="notice">Preview catalogue only. Planetworld prices and availability are dated 25 October 2026 snapshots. Confirm current price and stock before ordering.</p><h2>Choose a department</h2><div id="departments" class="grid"></div><h2 id="brandsHeading" hidden>Choose a brand</h2><div id="brands" class="filters"></div><h2 id="componentsHeading" hidden>Shop by product type</h2><div id="components" class="filters"></div><h2 id="productsHeading" hidden>Products</h2><div id="products" class="products"></div></main><script>
const departments=[["Car Audio & Video","Car Audio & Video"],["Home Entertainment","Home Entertainment"],["Band & Live Sound","Band & Live Sound"],["DJ Equipment","DJ"],["Studio Equipment","Studio Equipment"],["Marine Audio","Marine Audio"],["Installed AV","Installed AV"],["Musical Instruments","Musical Instruments"],["Harnesses & Trims","Harnesses & Trims"]];
let rows=[],department="",brand="",component="",catalogueLoaded=false;
const el=id=>document.getElementById(id),safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function button(label,active,fn){const b=document.createElement("button");b.textContent=label;if(active)b.style.background="#dceffc";b.onclick=fn;return b}
function draw(){el("brandsHeading").hidden=!department;el("componentsHeading").hidden=!department;el("productsHeading").hidden=!department;el("brands").replaceChildren();el("components").replaceChildren();el("products").replaceChildren();if(!department)return;if(!catalogueLoaded){el("products").textContent="Loading Planetworld catalogue…";return}const data=rows.filter(p=>p.collection===department&&(brand==="All brands"||p.brand===brand)&&(component==="All product types"||p.component===component));el("productsHeading").textContent="Products ("+data.length+" matching; showing "+Math.min(data.length,120)+")";const bs=["All brands",...[...new Set(rows.filter(p=>p.collection===department).map(p=>p.brand).filter(Boolean))].sort()];bs.forEach(b=>el("brands").append(button(b,b===brand,()=>{brand=b;component="All product types";draw()})));const cs=["All product types",...[...new Set(rows.filter(p=>p.collection===department&&(brand==="All brands"||p.brand===brand)).map(p=>p.component).filter(Boolean))].sort()];cs.forEach(c=>el("components").append(button(c,c===component,()=>{component=c;draw()})));data.slice(0,120).forEach(p=>{const card=document.createElement("article");card.className="product";const message=["Get Wired AutoWorx — Planetworld product enquiry","Department: "+department,"Brand: "+(p.brand||"Not specified"),"Product: "+(p.title||"Not specified"),"Product type: "+(p.component||"Not specified"),"Snapshot: 25-Oct-2026","Please confirm current price and availability."].join("\n");card.innerHTML="<b>"+safe(p.brand)+"</b><h3>"+safe(p.title)+"</h3><div>"+safe(p.component)+"</div><p class='muted'>"+(p.indicativePrice==null?"Price on request":"Indicative preview: R"+Number(p.indicativePrice).toLocaleString("en-ZA",{minimumFractionDigits:2}))+"</p><p class='muted'>25-Oct-2026 snapshot · confirm price and availability</p><a class='quoteLink' target='_blank' rel='noopener' href='https://wa.me/27744884234?text="+encodeURIComponent(message)+"'>REQUEST PRICE & AVAILABILITY</a>";el("products").append(card)})}
departments.forEach(([label,value])=>{const d=document.createElement("div");d.className="tile";const b=document.createElement("button");b.textContent=label;b.onclick=()=>{department=value;brand="All brands";component="All product types";draw();el("brandsHeading").scrollIntoView({behavior:"smooth"})};d.append(b);el("departments").append(d)});
fetch("assets/planetworld-catalogue-preview.json").then(r=>{if(!r.ok)throw Error("Catalogue unavailable");return r.json()}).then(data=>{rows=data.records||[];catalogueLoaded=true;if(department)draw()}).catch(()=>{catalogueLoaded=true;el("departments").textContent="Catalogue could not be loaded. Please retry.";el("products").textContent="Catalogue could not be loaded. Please return to the store and retry."});
</script></body></html>
