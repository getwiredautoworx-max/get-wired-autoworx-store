<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f6fa">
<title>Shop Categories | Get Wired AutoWorx</title>
<style>
:root{--ink:#173650;--muted:#53687a;--blue:#087fce;--line:#d5e0e9;--panel:#fff;--bg:#f3f6fa}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#fff 0%,#f3f6fa 68%,#eaf0f6 100%);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.head{max-width:1320px;margin:auto;min-height:78px;display:flex;align-items:center;gap:14px;padding:8px 16px}
.back{border:1px solid #b9d2e3;background:#fff;color:var(--ink);border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}
.logo{height:60px;width:min(300px,52vw);object-fit:contain}
.search{margin-left:auto;max-width:430px;flex:1}
.search input{width:100%;background:#f8fafc;color:var(--ink);border:1px solid #1688d0;border-radius:28px;padding:12px 16px;font-size:15px;outline:none}
.wrap{max-width:1320px;margin:auto;padding:22px 18px 80px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:12px}.crumb a{color:var(--blue);text-decoration:none}
.title{display:flex;align-items:end;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:20px}
.title h1{font-size:clamp(25px,4vw,32px);margin:0;color:#12344f}.title p{margin:6px 0 0;color:var(--muted);line-height:1.45}.count{font-size:13px;color:var(--muted);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{min-width:0;min-height:145px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:18px;background:linear-gradient(145deg,#fff,#edf5fb);border:1px solid #cbdbe7;border-radius:14px;color:var(--ink);text-decoration:none;box-shadow:0 3px 12px rgba(25,55,80,.06);transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 10px 24px rgba(25,55,80,.12);outline:none}
.cardtop{display:flex;align-items:flex-start;gap:12px}.icon{width:48px;height:48px;flex:0 0 48px;border-radius:12px;background:#e4f3fd;display:grid;place-items:center;font-size:25px}
.card h2{font-size:17px;line-height:1.25;margin:2px 0 6px;overflow-wrap:anywhere}.card p{font-size:13px;line-height:1.4;color:var(--muted);margin:0}
.arrow{align-self:flex-end;color:var(--blue);font-size:24px;font-weight:800}
.empty{padding:24px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted)}
@media(max-width:760px){.grid{gap:8px}.card{padding:10px;min-height:125px;gap:8px}.cardtop{display:block}.icon{width:38px;height:38px;font-size:21px;margin-bottom:8px}.card h2{font-size:13px}.card p{font-size:11px}.head{gap:8px}.logo{height:49px}.back{padding:9px;font-size:12px}.search{max-width:40vw}.wrap{padding:16px 10px 60px}}
@media(max-width:360px){.grid{gap:6px}.card{padding:8px}.card h2{font-size:12px}.card p{font-size:10px}}
</style>
</head>
<body>
<header class="header"><div class="head"><button class="back" id="back">← BACK</button><img class="logo" src="assets/gw-logo.png" alt="Get Wired AutoWorx"><div class="search"><input id="search" placeholder="Search categories..." aria-label="Search categories"></div></div></header>
<main class="wrap"><div class="crumb"><a href="store.html">Home</a> / <span id="crumb">Shop Categories</span></div><div class="title"><div><h1 id="heading">SHOP BY CATEGORY</h1><p id="subtitle">Choose a main category to continue.</p></div><div class="count" id="count"></div></div><div class="grid" id="grid"><div class="empty">Loading category hierarchy…</div></div></main>
<script>
const params=new URLSearchParams(location.search),rootSlug=params.get('root');
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
let hierarchy=null,items=[];
function render(rows,title,subtitle,crumb){items=rows;document.getElementById('heading').textContent=title;document.getElementById('subtitle').textContent=subtitle;document.getElementById('crumb').textContent=crumb;document.getElementById('count').textContent=rows.length+' options';document.getElementById('grid').innerHTML=rows.length?rows.map(c=>'<a class="card" href="'+esc(c.href)+'"><div class="cardtop"><span class="icon" aria-hidden="true">'+esc(c.icon||'▦')+'</span><div><h2>'+esc(c.label)+'</h2><p>'+esc(c.description||'Browse related products and options.')+'</p></div></div><span class="arrow" aria-hidden="true">→</span></a>').join(''):'<div class="empty">No subcategories are listed here yet. The category mapping must be reviewed before products are imported.</div>'}
function searchFilter(){const q=document.getElementById('search').value.trim().toLocaleLowerCase('en-ZA');document.querySelectorAll('.card').forEach(el=>el.style.display=el.textContent.toLocaleLowerCase('en-ZA').includes(q)?'flex':'none')}
async function main(){try{const r=await fetch('staging/source-extracts/STORE_CATEGORY_HIERARCHY_2026-10-13.json',{cache:'no-store'});if(!r.ok)throw Error('Staged category hierarchy unavailable');hierarchy=await r.json();const root=hierarchy.roots.find(x=>x.slug===rootSlug);
if(!root){document.title='Shop Categories | Get Wired AutoWorx';render(hierarchy.roots.map(x=>({label:x.label,icon:x.icon,description:x.subcategories.length+' source subcategories mapped for review',href:'category.html?root='+encodeURIComponent(x.slug)})),'SHOP BY CATEGORY','Choose a main category to continue.','Shop Categories');return}
document.title=root.label+' | Get Wired AutoWorx';const subs=root.subcategories||[];render(subs.map(x=>({label:x.label,icon:root.icon,description:'Browse '+x.label.toLocaleLowerCase('en-ZA')+' products',href:'products.html?root='+encodeURIComponent(root.slug)+'&subcategory='+encodeURIComponent(x.slug)})),root.label,'Choose a subcategory to continue.',root.label);
}catch(e){console.error(e);document.getElementById('grid').innerHTML='<div class="empty">Unable to load the staged category hierarchy. Please retry later.</div>'}}
document.getElementById('back').addEventListener('click',()=>{if(rootSlug)location.href='category.html';else location.href='store.html'});
document.getElementById('search').addEventListener('input',searchFilter);main();
</script>
</body>
</html>
