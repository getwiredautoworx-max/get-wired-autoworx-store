const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');function artFor(label){const n=String(label||'').toLowerCase();let icon='⚙',color='#1688d0';if(/electrical|wiring|connector|fuse|relay|battery|alternator|starter/.test(n)){icon='⚡';color='#1688d0'}else if(/security|alarm|immobil|lock|remote|key/.test(n)){icon='🔒';color='#d9364b'}else if(/audio|speaker|radio|multimedia|amplifier|aerial/.test(n)){icon='♫';color='#0d9bb5'}else if(/marine|boat|waterproof|bilge|anchor/.test(n)){icon='⚓';color='#1688c4'}else if(/tool|spanner|socket|screwdriver|hardware|consumable|workshop|drill/.test(n)){icon='🛠';color='#b97b1d'}else if(/camp|outdoor|leisure|caravan|tent|sleep|lantern/.test(n)){icon='🏕';color='#368b5b'}else if(/trailer|canopy|tow|hitch/.test(n)){icon='🚙';color='#627b91'}else if(/light|lamp|led|bulb|headlight/.test(n)){icon='💡';color='#b88924'}else if(/accessor|camera|sensor|parking|interior|exterior|mirror|mat/.test(n)){icon='🚘';color='#2479b9'}else if(/spare|engine|mechanical|filter|belt|brake|clutch|suspension/.test(n)){icon='⚙';color='#52718b'}const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#153650"/><stop offset="1" stop-color="#030a12"/></linearGradient><radialGradient id="r"><stop stop-color="'+color+'" stop-opacity=".55"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></radialGradient></defs><rect width="640" height="260" fill="url(#g)"/><ellipse cx="320" cy="115" rx="245" ry="155" fill="url(#r)"/><path d="M22 226H618" stroke="'+color+'" stroke-opacity=".7" stroke-width="2"/><circle cx="320" cy="108" r="72" fill="#07111e" stroke="'+color+'" stroke-width="3"/><circle cx="320" cy="108" r="61" fill="none" stroke="#fff" stroke-opacity=".18"/><text x="320" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="76" fill="#fff">'+icon+'</text><text x="320" y="195"
