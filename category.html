<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#02060d"><title>Shop Categories | Get Wired AutoWorx</title><style>
:root{--bg:#02060d;--panel:#071222;--blue:#08a5ff;--red:#ff1c2d;--white:#f5f8fc;--muted:#9fb1c4;--line:#12456c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#0d2d4b,#030914 42%,#02060d 78%);color:var(--white);font-family:Arial,Helvetica,sans-serif}.header{position:sticky;top:0;z-index:5;background:rgba(2,6,13,.97);backdrop-filter:blur(12px);border-bottom:1px solid #0c3b60}.head{max-width:1400px;margin:auto;min-height:92px;display:flex;align-items:center;gap:16px;padding:8px 18px}.logo{height:76px;width:min(360px,65vw);object-fit:contain}.back{border:1px solid #087fe0;background:#06111e;color:#fff;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer}.search{margin-left:auto}.search input{width:min(430px,42vw);background:#050d18;border:2px solid #087fe0;border-radius:28px;padding:13px 18px;color:#fff;font-size:15px;outline:none}.wrap{max-width:1400px;margin:auto;padding:22px 20px 80px}.crumb{color:#8fa4b8;font-size:13px;margin-bottom:12px}.crumb a{color:#20b1ff;text-decoration:none}.title{display:flex;align-items:end;justify-content:space-between;gap:15px;border-bottom:1px solid #12456c;padding-bottom:14px;margin-bottom:20px}.title h1{font-size:32px;margin:0}.title p{margin:5px 0 0;color:var(--muted)}.count{color:#8fa4b8;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{display:flex;flex-direction:column;justify-content:space-between;min-height:145px;background:linear-gradient(145deg,#0b1b30,#050d18);border:2px solid #087fe0;border-radius:14px;padding:20px;text-decoration:none;color:#fff;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#20b1ff;box-shadow:0 12px 35px #000}.card h2{font-size:18px;margin:0 0 12px}.arrow{color:#20b1ff;font-size:27px;align-self:flex-end}.empty,.error{padding:25px;border:1px solid #12456c;border-radius:12px;background:#07111e;color:var(--muted)}.error{border-color:#ff1c2d;color:#ffd7da}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.search{display:none}.title h1{font-size:27px}}@media(max-width:500px){.grid{grid-template-columns:1fr}.head{min-height:78px}.logo{height:64px}.back{padding:9px 11px}.wrap{padding:16px 12px 80px}.card{min-height:120px}}
</style></head><body><header class="header"><div class="head"><button class="back" onclick="history.length>1?history.back():location.href='store.html'">← BACK</button><img class="logo" src="assets/gw-logo.png" alt="Get Wired AutoWorx"><div class="search"><input id="search" placeholder="Search categories..."></div></div></header><main class="wrap"><div class="crumb"><a href="store.html">Home</a> / Shop Categories</div><div class="title"><div><h1 id="heading">SHOP BY CATEGORY</h1><p id="subtitle">Choose a category to continue to its sub-categories.</p></div><div class="count" id="count"></div></div><div class="grid" id="grid"><div class="empty">Loading categories…</div></div></main><script>
const SUPABASE_URL='https://ojytykqpvonxvepprgbh.supabase.co',KEY='sb_publishable_rSKAEYqQheFAljUmro6uGA_MmBm-l3w';
const params=new URLSearchParams(location.search);const slug=params.get('slug');const id=params.get('id');
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
async function api(path){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw new Error('Catalogue request failed');return r.json()}
function href(c){return 'category.html?id='+encodeURIComponent(c.id)}
async function main(){try{
 const cats=await api('categories?select=id,name,slug,parent_id&order=name.asc');
 let current=null;if(id)current=cats.find(c=>c.id===id);else if(slug)current=cats.find(c=>c.slug===slug);
 if(!current){
   // canonical top-level categories only; legacy duplicates are intentionally excluded.
   const roots=cats.filter(c=>!c.parent_id&&!/^legacy-/.test(c.slug)).filter(c=>!['Parts'].includes(c.name));
   render(roots,'SHOP BY CATEGORY','Choose a main category to continue.');return;
 }
 const children=cats.filter(c=>c.parent_id===current.id);
 document.title=current.name+' | Get Wired AutoWorx';
 document.getElementById('heading').textContent=current.name;
 document.getElementById('subtitle').textContent=children.length?'Choose a sub-category to view its products.':'Products in this category.';
 if(children.length){render(children,current.name,'Choose a sub-category to continue.');return;}
 location.replace('products.html?category='+encodeURIComponent(current.id));
}catch(e){document.getElementById('grid').innerHTML='<div class="error">Unable to load this category right now. Please try again.</div>';}}
function render(items,title,sub){const grid=document.getElementById('grid');const count=document.getElementById('count');document.getElementById('heading').textContent=title;document.getElementById('subtitle').textContent=sub;count.textContent=items.length+' options';if(!items.length){grid.innerHTML='<div class="empty">No sub-categories are currently assigned here.</div>';return}grid.innerHTML=items.map(c=>`<a class="card" href="${href(c)}"><h2>${esc(c.name)}</h2><span class="arrow">→</span></a>`).join('');}
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.card').forEach(c=>c.style.display=c.textContent.toLowerCase().includes(q)?'flex':'none')});main();
</script></body></html>
