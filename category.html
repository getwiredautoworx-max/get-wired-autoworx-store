/* Responsive layout polish: make category choices easy to scan and tap. */
@media (min-width: 901px) {
  html body .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
}
@media (max-width: 900px) {
  html body .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  html body .card { min-width: 0; }
  html body .card h2 { overflow-wrap: anywhere; }
}
@media (max-width: 500px) {
  html body .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  html body .card { min-height: 0; border-radius: 10px; }
  html body .card-art { height: clamp(82px, 26vw, 124px); }
  html body .card h2 { font-size: 13px; line-height: 1.25; padding: 0 9px; }
  html body .card .card-count { font-size: 11px; }
  html body .title { align-items: flex-start; flex-wrap: wrap; }
  html body .title h1 { font-size: clamp(21px, 6vw, 27px); }
}
@media (max-width: 359px) {
  html body .grid { gap: 6px; }
  html body .card h2 { font-size: 12px; padding: 0 6px; }
}
